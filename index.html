<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B5E8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="호주여행">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="format-detection" content="telephone=no">
<title>호주 가족여행 2026 · 11/15–11/24</title>
<style>
:root{
  --bg:#F6EFE2;--card:#FFFFFF;--card2:#FBF7EE;--ink:#14202B;--muted:#4B5966;--line:#E3D9C4;--chip:#EFE7D6;
  --ocean:#0B5E8A;--sun:#E08A1E;--sunink:#9A5A0C;--gum:#2F7D5B;--gumink:#25664A;--night:#1B2A4A;--red:#B93A0B;
  --warn-bg:#FFF1C9;--warn-ink:#5F4400;--ok-bg:#DDF1E6;--shadow:0 1px 0 rgba(20,32,43,.06),0 6px 18px rgba(20,32,43,.07);
  --c-syd:#0B5E8A;--c-gc:#E08A1E;--c-bne:#2F7D5B;--c-fly:#1B2A4A;
  --i-syd:#0B5E8A;--i-gc:#9A5A0C;--i-bne:#25664A;--i-fly:#1B2A4A;
  --r:16px;--tab:64px;--top:56px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1B26;--card:#172636;--card2:#1B2D3F;--ink:#F2F5F7;--muted:#B6C2CC;--line:#2A3C4D;--chip:#223548;
    --ocean:#6DB8E3;--sun:#F2B15C;--sunink:#F2B15C;--gum:#7CCBA0;--gumink:#7CCBA0;--night:#AFC3E8;--red:#FF9B73;
    --warn-bg:#3A3015;--warn-ink:#FFE7A3;--ok-bg:#183A2B;--shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --c-syd:#3F9BCB;--c-gc:#E69A3A;--c-bne:#4FAE82;--c-fly:#7C8FBF;
    --i-syd:#6DB8E3;--i-gc:#F2B15C;--i-bne:#7CCBA0;--i-fly:#AFC3E8;
  }
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--top) + env(safe-area-inset-top) + 12px)}
html[data-fs="1"]{font-size:20px}
html[data-fs="2"]{font-size:22px}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  line-height:1.5;letter-spacing:-.01em;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 28px)}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--ocean);text-decoration-thickness:1.5px;text-underline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ocean);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-999px;top:0;background:var(--card);padding:.6rem 1rem;z-index:99}
.skip:focus{left:8px;top:8px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pane{overflow-wrap:anywhere}
.copybuf{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:.5rem;
  padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));background:var(--card);border-bottom:1px solid var(--line);
  box-sizing:content-box}
.top .loc{flex:1;min-width:0;display:flex;align-items:center;gap:.55rem}
.cdot{flex:none;width:.8rem;height:.8rem;border-radius:50%;background:var(--cc,var(--c-fly))}
.top .lt{min-width:0;line-height:1.2}
.top .lt b{display:block;font-size:1.02rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .lt small{display:block;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dday{flex:none;font-weight:800;font-size:1rem;background:var(--night);color:#fff;border-radius:999px;padding:.25rem .7rem;white-space:nowrap}
@media (prefers-color-scheme:dark){.dday{background:#2B4468}}
.fsbtn{flex:none;min-width:48px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-weight:800;font-size:1.1rem}
.simbadge{position:fixed;top:calc(var(--top) + env(safe-area-inset-top) + 4px);right:8px;z-index:31;background:#B93A0B;color:#fff;font-size:.8rem;padding:.1rem .6rem;border-radius:999px}

/* ---------- panes ---------- */
.pane{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.pane[hidden]{display:none}
.pane>*+*{margin-top:14px}
.h2{font-size:1.2rem;font-weight:800;margin:6px 2px -4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.card>*+*{margin-top:.6rem}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.note{font-size:.92rem;color:var(--muted)}
.stack>*+*{margin-top:.6rem}
.row-flex{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;padding:.5rem 1rem;border-radius:12px;
  border:1.5px solid var(--ocean);background:var(--card);color:var(--ocean);font-weight:700;text-decoration:none;font-size:1rem;text-align:center}
.btn.pri{background:var(--ocean);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#0F1B26}}
.btn.lg{min-height:52px;font-size:1.02rem}
.btn.ghost{border-color:var(--line);color:var(--ink);background:var(--card2)}
.btn.sm{min-height:44px;padding:.3rem .8rem;font-size:.95rem}
.btn.block{display:flex;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:.5rem}
.btns>.btn{flex:1 1 7rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;background:var(--chip);padding:.2rem .7rem;font-size:.9rem;font-weight:600}
.chip.red{background:#FBE0D6;color:#7C2606}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.ok{background:var(--ok-bg);color:#14513A}
.chip.navy{background:var(--night);color:#fff}
@media (prefers-color-scheme:dark){.chip.red{background:#4A2113;color:#FFC9B3}.chip.ok{color:#BDEBD2}.chip.navy{background:#2B4468}}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.pill{display:inline-block;flex:none;white-space:nowrap;border-radius:999px;padding:.15rem .8rem;font-weight:800;font-size:.95rem;color:#fff;background:var(--night)}
.pill.now{background:#1F7A4F}.pill.next{background:#0B5E8A}.pill.transit{background:#5A6672}.pill.flight{background:#1B2A4A}.pill.rest{background:#5A4A8A}.pill.pre{background:#0B5E8A}
@media (prefers-color-scheme:dark){.pill.now{background:#2E8F61}.pill.next{background:#2778A5}}

/* ---------- ticket (now/next, hero) ---------- */
.ticket{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:20px 16px 16px;overflow:hidden}
.ticket::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--cc,var(--c-fly))}
.ticket .tk-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.ticket .tk-time{font-size:1.5rem;font-weight:800;line-height:1.15;margin-top:.55rem}
.ticket .tk-name{font-size:1.35rem;font-weight:800;line-height:1.25;margin-top:.25rem}
.ticket .tk-one{font-size:1.05rem;margin-top:.3rem}
.ticket .tk-big{font-size:2.6rem;font-weight:800;line-height:1.05;margin-top:.4rem}
.perf{position:relative;border-top:2px dashed var(--line);margin:14px -16px 12px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-12px}.perf::after{right:-12px}
.bar{height:10px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:.7rem}
.bar>i{display:block;height:100%;background:var(--cc,var(--ocean));border-radius:999px;width:0}
.tk-next{display:flex;gap:.6rem;align-items:flex-start;font-size:1rem}
.tk-next b{font-weight:800}
.tz{font-size:.85rem;color:var(--muted);font-weight:600}

/* ---------- deadline rows ---------- */
.dl{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem 0;border-top:1px solid var(--line)}
.dl:first-of-type{border-top:0}
.dl .due{flex:none;min-width:4.2rem;text-align:center;border-radius:12px;padding:.35rem .3rem;font-weight:800;font-size:1.05rem;background:var(--chip)}
.dl .due small{display:block;font-size:.8rem;font-weight:600;color:var(--muted)}
.dl .due.hot{background:#FBE0D6;color:#7C2606}.dl .due.hot small{color:#7C2606}
@media (prefers-color-scheme:dark){.dl .due.hot{background:#4A2113;color:#FFC9B3}.dl .due.hot small{color:#FFC9B3}}
.dl .tt{font-weight:800;font-size:1.05rem;line-height:1.3}
.dl .nn{font-size:.95rem;color:var(--muted);margin-top:.15rem}
.dl .dlbody{flex:1;min-width:0}
.dl .dlhit{flex:none;display:flex;align-items:center;justify-content:center;width:48px;height:48px;margin:-.4rem -.4rem -.4rem 0;cursor:pointer}

/* ---------- checkboxes ---------- */
.ckw{border-top:1px solid var(--line)}
.ckw:first-child{border-top:0}
.ck{display:flex;gap:.8rem;align-items:flex-start;min-height:56px;padding:.6rem 0;cursor:pointer}
.ckx{padding:0 0 .5rem calc(32px + .8rem)}
.ck input{flex:none;width:32px;height:32px;margin:0;accent-color:var(--ocean);cursor:pointer}
.ck .tx{flex:1;min-width:0;font-size:1rem;line-height:1.45}
.ck input:checked+.tx{opacity:.55;text-decoration:line-through;text-decoration-thickness:1.5px}
.ck .tag{display:inline-block;font-size:.85rem;font-weight:700;background:var(--chip);border-radius:999px;padding:0 .6rem;margin-right:.4rem}
.more{margin-top:.3rem}
.more summary{font-size:.92rem;color:var(--ocean);font-weight:700;min-height:44px;display:flex;align-items:center}
.more p{font-size:.92rem;color:var(--muted)}
.more>div>p+p{margin-top:.4rem}
.prog{display:flex;align-items:center;gap:.7rem}
.prog .bar{flex:1;margin:0;height:12px}
.prog b{font-size:.95rem;min-width:3.2rem;text-align:right}
.datechip{display:inline-flex;align-items:center;min-height:44px;border:0;background:var(--chip);border-radius:999px;padding:0 .7rem;font-weight:700;font-size:.9rem;color:var(--ink);margin-right:.3rem}

/* ---------- accordion / details ---------- */
details.acc,details.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
details.acc>summary,details.fold>summary{list-style:none;display:flex;align-items:center;gap:.6rem;min-height:56px;padding:.5rem 16px;font-weight:800;font-size:1.05rem;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details.acc>summary::after,details.fold>summary::after{content:"";margin-left:auto;flex:none;width:.6rem;height:.6rem;border-right:3px solid var(--muted);border-bottom:3px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .18s}
details[open].acc>summary::after,details[open].fold>summary::after{transform:rotate(-135deg) translateY(-2px)}
details.acc>.in,details.fold>.in{padding:2px 16px 16px}
details.acc>.in>*+*,details.fold>.in>*+*{margin-top:.7rem}
.cnt{font-size:.9rem;font-weight:700;background:var(--chip);border-radius:999px;padding:0 .6rem}
.bul{display:grid;gap:.55rem}
.bul>li{position:relative;padding-left:1.1rem;font-size:1rem;line-height:1.5}
.bul>li::before{content:"";position:absolute;left:.1rem;top:.6em;width:.45rem;height:.45rem;border-radius:50%;background:var(--cc,var(--ocean))}
.sub{font-size:.95rem;font-weight:800;color:var(--muted);margin-top:.8rem}

/* ---------- schedule: band, chips, header ---------- */
.band{display:flex;height:30px;border-radius:10px;overflow:hidden;font-size:.82rem;font-weight:800;color:#fff;gap:2px}
.band>span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 4px;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.band .syd{background:#0B5E8A;flex:3}.band .gc{background:#A55F00;flex:2}.band .bne{background:#2F7D5B;flex:3}.band .fly{background:#1B2A4A;flex:1}
.chips-row{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 8px;margin:0 -4px;-webkit-overflow-scrolling:touch}
.dchip{flex:none;scroll-snap-align:center;width:60px;min-height:68px;border-radius:14px;border:2px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0;position:relative}
.dchip small{font-size:.8rem;color:var(--muted);font-weight:600}
.dchip b{font-size:1.1rem;font-weight:800;line-height:1.1}
.dchip i{width:.55rem;height:.55rem;border-radius:50%;background:var(--cc)}
.dchip em{position:absolute;top:-9px;font-style:normal;font-size:.72rem;font-weight:800;background:var(--red);color:#fff;border-radius:999px;padding:0 .45rem}
.dchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dchip[aria-pressed="true"] small{color:var(--bg)}
.dchip.today{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.dayhead{position:relative;border-radius:var(--r);padding:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.dayhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--cc)}
.dayhead.move::before{background:linear-gradient(var(--cc0),var(--cc))}
.dayhead>*+*{margin-top:.5rem}
.dayhead h2{font-size:1.4rem;line-height:1.25;font-weight:800;padding-left:6px}
.dayhead .st{font-size:1rem;color:var(--muted);padding-left:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dayhead .chips{padding-left:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{min-height:46px;border:0;background:transparent;font-weight:800;font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- timeline ---------- */
.tl{--cc:var(--c-fly)}
.tl>li{display:grid;grid-template-columns:3.7rem 2rem minmax(0,1fr);column-gap:.55rem;position:relative}
.tl .rr{position:relative;display:flex;justify-content:center}
.tl .rr::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--cc);opacity:.4}
.tl>li:first-child .rr::before{top:1.3rem}
.tl>li:last-child .rr::before{bottom:calc(100% - 1.3rem)}
.tl .dot{position:relative;z-index:1;margin-top:.55rem;width:2rem;height:2rem;border-radius:50%;background:var(--card);border:2.5px solid var(--cc);display:grid;place-items:center;font-size:.95rem;line-height:1}
.tl .rt{padding-top:.6rem;text-align:right;line-height:1.15}
.tl .rt b{display:block;font-size:1.2rem;font-weight:800}
.tl .rt small{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.tl .rb{padding:.5rem 0 .75rem;min-width:0}
.tl .nm{font-size:1.1rem;font-weight:800;line-height:1.3}
.tl .one{font-size:1rem;line-height:1.4;margin-top:.1rem}
.tl .bd{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.4rem}
.tl .acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.tl>li.row.past{opacity:.55}
.tl>li.row.cur .rb{background:var(--card2);border-left:6px solid var(--cc);margin-left:-6px;padding-left:.6rem;border-radius:10px}
.tl>li.row.cur .dot{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cc) 55%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.tl>li.row.cur .dot{animation:none}*{transition:none!important}}
.tl>li.conn .rr::before{background:none;opacity:1;border-left:3px dotted var(--cc)}
.tl>li.conn .rb{padding:.1rem 0 .3rem}
.cchip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.15rem .5rem;background:var(--chip);border-radius:14px;padding:.3rem .8rem;font-size:.92rem;font-weight:600;line-height:1.35}
.cchip.long{background:var(--ink);color:var(--bg)}
.cconn{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.cconn .btn{min-height:44px}
.legd{font-size:.92rem;color:var(--muted);margin-top:.35rem}
.dl2{display:grid;gap:.45rem;margin-top:.5rem;font-size:.95rem}
.dl2>div{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:.5rem}
.dl2 dt{font-weight:800;color:var(--muted)}
.dl2 dd{margin:0;line-height:1.45}

/* ---------- tour card ---------- */
.tour{border:2px solid var(--c-syd);background:var(--card)}
.tour h3{font-size:1.2rem;font-weight:800;line-height:1.3}
.tour .big{font-size:1.5rem;font-weight:800;line-height:1.2}
.tour .meet{background:var(--card2);border-radius:12px;padding:12px;border:1px dashed var(--line)}
.warnbox{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-weight:600;font-size:1rem}
.warnbox b{font-weight:800}
.trade{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;text-align:center}
.trade>div{background:var(--card2);border-radius:12px;padding:.5rem .2rem;border:1px solid var(--line)}
.trade b{display:block;font-size:1.15rem}
.trade small{font-size:.82rem;color:var(--muted)}
.opt{border-top:1px solid var(--line);padding-top:.7rem}
.opt h4{font-size:1rem;font-weight:800}

/* ---------- map ---------- */
.mapframe{width:100%;height:70vh;height:70dvh;min-height:360px;border:0;border-radius:var(--r);background:var(--chip);display:block}
.lists{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.lists a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72px;border-radius:14px;color:#fff;text-decoration:none;font-weight:800;font-size:1.02rem;text-align:center;padding:.4rem}
.lists a small{font-size:.85rem;font-weight:600;opacity:.95}
.lists .syd{background:#0B5E8A}.lists .gc{background:#A55F00}.lists .bne{background:#2F7D5B}
.routes{display:grid;gap:.5rem}
.routes a{display:flex;align-items:center;gap:.8rem;min-height:56px;padding:.4rem .9rem;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;border-left:8px solid var(--cc)}
.routes a small{display:block;font-weight:500;color:var(--muted);font-size:.88rem}
.routes a span.d{font-weight:800;font-size:1.05rem;min-width:3.6rem}

/* ---------- info ---------- */
.fcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card2)}
.fcard .route{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.3rem 0}
.fcard .route b{font-size:1.6rem;font-weight:800;line-height:1}
.fcard .route small{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.fcard .route .ar{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 6px,transparent 6px 12px);position:relative;margin:0 .3rem}
.fcard .route .ar::after{content:"";position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:9px solid var(--muted)}
.bag{display:inline-flex;align-items:center;gap:.4rem;background:var(--night);color:#fff;border-radius:999px;padding:.25rem .9rem;font-weight:800;font-size:.98rem}
@media (prefers-color-scheme:dark){.bag{background:#2B4468}}
.answer{background:var(--ok-bg);border:2px solid var(--gum);border-radius:14px;padding:14px}
.answer .q{font-weight:800;font-size:1.05rem}
.answer .a{font-size:1.05rem;margin-top:.4rem;line-height:1.55}
.hotel{border-left:8px solid var(--cc)}
.hotel h3{font-size:1.1rem;font-weight:800}
.tel{display:flex;align-items:center;justify-content:space-between;gap:.6rem;min-height:60px;padding:.5rem 1rem;border-radius:14px;background:var(--card2);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tel b{font-size:1.15rem;color:var(--ocean)}
.tel span{font-weight:700}

/* ---------- tab bar, toast ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--card);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-shadow:0 -4px 18px rgba(20,32,43,.08)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{position:relative;min-height:var(--tab);border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:.82rem;font-weight:800;color:var(--muted);padding:6px 0}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--ocean)}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:6px;width:56px;height:30px;border-radius:999px;background:color-mix(in srgb,var(--ocean) 16%,transparent);z-index:0}
.tabbar svg,.tabbar span{position:relative;z-index:1}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:20px;height:20px;border-radius:999px;background:var(--red);color:#fff;font-style:normal;font-size:.75rem;
  font-weight:800;display:grid;place-items:center;padding:0 5px;z-index:2}
.tabbar .badge[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);opacity:0;z-index:60;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:.6rem 1.2rem;border-radius:999px;font-weight:700;transition:opacity .2s,transform .2s;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act.on{pointer-events:auto}
.toastbtn{margin-left:.8rem;min-height:44px;padding:0 .8rem;border:0;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:800}

@media print{
  .top,.tabbar,#toast,.btns,.seg,.chips-row,.band,.fsbtn{display:none!important}
  .pane[hidden]{display:block!important}
  details>*{display:block!important}
  body{background:#fff;color:#000;padding:0}
  .card,.dayhead,.ticket,details.acc,details.fold{box-shadow:none;break-inside:avoid}
}

/* city color hooks (set via data-c / data-c0 so no inline styles are needed) */
[data-c="syd"]{--cc:var(--c-syd);--ci:var(--i-syd)}
[data-c="gc"]{--cc:var(--c-gc);--ci:var(--i-gc)}
[data-c="bne"]{--cc:var(--c-bne);--ci:var(--i-bne)}
[data-c="fly"]{--cc:var(--c-fly);--ci:var(--i-fly)}
[data-c0="syd"]{--cc0:var(--c-syd)}[data-c0="gc"]{--cc0:var(--c-gc)}[data-c0="bne"]{--cc0:var(--c-bne)}[data-c0="fly"]{--cc0:var(--c-fly)}
.ci{color:var(--ci,inherit)}
.dl .dlcb{flex:none;width:32px;height:32px;margin:0;accent-color:var(--ocean);cursor:pointer}
.tel span{display:block}
.tel small{display:block;font-weight:500;color:var(--muted);font-size:.85rem;margin-top:.15rem}
.gloss{display:grid;gap:.6rem}
.gloss dt{font-weight:800}
.gloss dd{margin:0;color:var(--muted);font-size:.95rem}
.pane p a,.bul a,.tx a,.dl2 a{padding:.3em 0}

</style>

Concrete Playground는 더 늦게까지로 표기; 신뢰도 중간)","cost":25,"bk":"불필요 (워크인)","wt":"태국 음식 점심입니다. 팟타이, 카오팟(볶음밥), 쏨땀(파파야 샐러드), 똠얌 같은 메뉴를 3명이 나눠 먹기 좋습니다. 1인 약 AUD 25입니다. 대기 없이 앉을 수 있는 시간대입니다. 식사 40~45분. 2026년 최신 후기는 확인하지 못했고(검색된 최신 후기는 2023년 12월, OpenTable 평점 3.7) 체인 본사 사이트에는 정상 운영으로 안내돼 있으니 출발 전 구글 지도 영업 상태를 확인하세요. 전화 (02) 9211 1808.","bu":"Mamak Haymarket (15 Goulburn St, 말레이 로티·사테, 월요일 점심 11:30~14:30 / 저녁 17:30~22:00로 알려짐, 줄이 길 수 있음, 예약 불가). 또는 인근 Chinatown 식당가.","url":"https://www.chatthai.com.au/","one":"헤이마켓 태국 음식으로 점심","m":1,"q":"Chat Thai Haymarket, 20 Campbell St, Haymarket NSW 2000"},{"id":"s6","k":"차이나타운 경전철역 (L2/L3 승차)","n":"Chinatown Light Rail Stop","kind":"station","lat":-33.87857,"lng":151.20556,"adr":"George St near Hay St, Haymarket NSW 2000","a":"13:29","l":"13:36","ea":29913269,"el":29913276,"tz":660,"hrs":"경전철 05:00~01:00 운행, Circular Quay~Moore Park 구간 약 4~8분 간격","cost":null,"bk":"불필요","wt":"Circular Quay 방면 L2(Randwick) 또는 L3(Kingsford) 트램을 탑니다. 승차 때 카드를 단말기에 터치하고 내릴 때도 터치합니다. 같은 카드로 탑승합니다. 바로 옆 Capitol Square 정류장은 L1(Dulwich Hill선) 전용이라 서큘러키로 가지 않으니 헷갈리지 마세요.","bu":"트램이 지연되면 Town Hall역에서 기차로 Circular Quay까지 갈 수 있습니다(지하철 아님, 시티 서클). 또는 도보 약 25분.","url":"","one":"","m":0,"q":"Chinatown Light Rail Stop, George St near Hay St, Haymarket NSW 2000"},{"id":"s7","k":"서큘러키 경전철역 (하차)","n":"Circular Quay Light Rail Stop","kind":"station","lat":-33.8615,"lng":151.21,"adr":"Alfred St, Circular Quay NSW 2000","a":"13:51","l":"13:53","ea":29913291,"el":29913293,"tz":660,"hrs":"경전철 05:00~01:00 운행","cost":0,"bk":"불필요","wt":"하차 후 터치 아웃. 해안 산책로(Circular Quay 부두 앞)를 따라 오페라하우스 쪽으로 걷습니다. 페리 부두와 하버브리지가 보입니다.","bu":"오페라하우스까지 도보 약 11~12분입니다. 정류장 위치는 OSM 기준(-33.8615, 151.2100)으로 재확인했습니다.","url":"","one":"","m":0,"q":"Circular Quay Light Rail Stop, Alfred St, Circular Quay NSW 2000"},{"id":"s8","k":"시드니 오페라하우스 (외관 + 한국어 투어)","n":"Sydney Opera House","kind":"sight","lat":-33.8572,"lng":151.2151,"adr":"Bennelong Point, Sydney NSW 2000","a":"14:05","l":"15:15","ea":29913305,"el":29913375,"tz":660,"hrs":"한국어 30분 투어 매일 운영, 11/16 회차: 11:15, 12:15, 13:45, 14:45, 15:45 (공식 페이지 확인, 변경 가능)","cost":37,"bk":"온라인 사전 예매 권장 (AUD 37 vs 당일 AUD 42). https://www.sydneyoperahouse.com/tours-and-experiences/korean-tour . 예매 화면의 달력에서 11/16 회차를 꼭 확인하세요. (요금은 2027년 4월부터 AUD 39/44로 오르지만 이번 여행에는 해당 없음)","wt":"14:05~14:30 외관 사진과 광장(포어코트) 산책. 14:30까지 Lower Concourse의 Welcome Centre에서 체크인합니다 (투어 15분 전 도착 필수, 5분 넘게 늦으면 예약 취소·환불 불가). 14:45 한국어 30분 투어 (약 1.5km 도보, 계단 약 200개, 엘리베이터·에스컬레이터 없음, 계속 서서 이동). 성인 AUD 37 (온라인 사전 예매, 당일 AUD 42). 15:15 종료. A4보다 큰 가방은 입장 전 맡겨야 합니다.","bu":"14:45 회차가 매진이면 15:45 회차로 옮기고 Mrs Macquarie's Chair 구간을 줄입니다. 계단이 힘들면 외관만 보고 Opera Bar에서 음료를 마십니다.","url":"https://www.sydneyoperahouse.com/tours-and-experiences/korean-tour","one":"외관 사진 찍고 14:45 한국어 투어","m":1,"q":"Sydney Opera House, Bennelong Point, Sydney NSW 2000"},{"id":"s9","k":"미세스 맥쿼리스 체어 (보태닉 가든 해안 전망대)","n":"Mrs Macquarie's Chair","kind":"sight","lat":-33.8597,"lng":151.22257,"adr":"Mrs Macquaries Rd, Sydney NSW 2000","a":"15:42","l":"16:10","ea":29913402,"el":29913430,"tz":660,"hrs":"로열 보태닉 가든은 11월 07:00~20:00, 무료 입장 (공식 페이지 재확인, 악천후 시 조기 폐쇄 가능)","cost":0,"bk":"불필요","wt":"오페라하우스에서 Farm Cove 해안길로 Royal Botanic Garden을 가로질러 걷습니다 (약 1.5km, 순수 도보 약 20분, 사진 정차 포함 27분). 사암 의자에서 오페라하우스와 하버브리지가 한 프레임에 들어오는 사진을 찍습니다. 벤치에서 20분 정도 쉽니다.","bu":"피곤하면 여기서 Uber/택시로 호텔까지 이동합니다 (약 AUD 15~20, 10분 안팎, 추정). 비가 오면 정원 산책을 생략하고 Art Gallery of NSW로 이동합니다.","url":"","one":"보태닉 가든 해안길 산책과 하버 뷰","m":1,"q":"Mrs Macquarie's Chair, Mrs Macquaries Rd, Sydney NSW 2000"},{"id":"s10","k":"YEHS 호텔 (체크인·휴식)","n":"YEHS Hotel Sydney QVB","kind":"hotel","lat":-33.872424,"lng":151.206266,"adr":"143 York St, Sydney NSW 2000","a":"16:45","l":"17:50","ea":29913465,"el":29913530,"tz":660,"hrs":"체크인 15:00 이후","cost":0,"bk":"예약 완료 (11/16~19)","wt":"체크인하고 맡긴 짐을 찾습니다. 샤워와 휴식 1시간. 방수 재킷과 겉옷은 챙기세요 (저녁 다리 위는 바람이 있어 쌀쌀할 수 있음).","bu":"-","url":"","one":"체크인하고 짐 찾아 잠깐 휴식","m":1,"q":"YEHS Hotel Sydney QVB, 143 York St, Sydney NSW 2000"},{"id":"s11","k":"로드 넬슨 브루어리 호텔 (록스 펍)","n":"Lord Nelson Brewery Hotel","kind":"restaurant","lat":-33.8582,"lng":151.2034,"adr":"19 Kent St, The Rocks NSW 2000","a":"18:13","l":"19:05","ea":29913553,"el":29913605,"tz":660,"hrs":"월요일 바 11:00~23:00 (Time Out·Crafty Pint). 2층 레스토랑은 수~토 저녁/목~금 점심만 운영해 월요일은 휴무로 보임. 주방 마감 시간 미확인","cost":35,"bk":"불필요 (워크인, 월요일 저녁은 한산한 편이나 확정은 아님)","wt":"1841년 면허로 알려진 시드니 최고령급 펍입니다. 아래층에서 피시앤칩스, 파이, 스테이크, 버거 등 펍 음식과 자체 양조 맥주를 먹습니다. 1인 약 AUD 35 (음료 포함 추정, 신뢰도 낮음). 식사 50분. 2024년 Laundy Hotels가 인수했으나 2026년 중반까지 정상 영업 중인 것으로 보입니다(폐업 보도는 확인되지 않음).","bu":"The Australian Heritage Hotel (100 Cumberland St, 정오부터 늦게까지, 피자·버거, 다리 계단 바로 옆, 전화 (02) 9247 2229). 도착 전 Lord Nelson 주방 마감 시간은 전화 (02) 9251 4044로 확인하세요.","url":"https://www.lordnelsonbrewery.com/","one":"록스의 오래된 펍에서 저녁","m":1,"q":"Lord Nelson Brewery Hotel, 19 Kent St, The Rocks NSW 2000"},{"id":"s12","k":"하버브리지 계단 입구 (컴벌랜드 스트리트)","n":"Bridge Stairs (Cumberland St)","kind":"sight","lat":-33.8591,"lng":151.20698,"adr":"Cumberland St, The Rocks NSW 2000 (Australian Heritage Hotel 인근)","a":"19:11","l":"19:13","ea":29913611,"el":29913613,"tz":660,"hrs":"보행로·엘리베이터 24시간 개방 (TfNSW)","cost":0,"bk":"불필요","wt":"계단(약 64단) 또는 24시간 운영 엘리베이터로 올라가 동쪽 보행로를 따라 북쪽(Kirribilli·Milsons Point 방향)으로 걷습니다. 보행로는 무료입니다.","bu":"계단이 부담스러우면 Cumberland St 쪽 엘리베이터를 이용합니다. 반대편 Kirribilli(Broughton St)에도 계단(약 61단)과 엘리베이터가 있습니다.","url":"","one":"하버브리지 보행로 걸으며 일몰 감상","m":1,"q":"Bridge Stairs, Cumberland St, The Rocks NSW 2000"},{"id":"s13","k":"밀슨스 포인트역 (기차 승차)","n":"Milsons Point Station","kind":"station","lat":-33.84586,"lng":151.21179,"adr":"Alfred St S, Milsons Point NSW 2061","a":"19:50","l":"19:56","ea":29913650,"el":29913656,"tz":660,"hrs":"기차 운행 중 (약 5분 간격)","cost":null,"bk":"불필요","wt":"다리를 건넌 뒤 Kirribilli 쪽 계단/엘리베이터로 내려와 Milsons Point역까지 걸어 도착합니다. 터치 인하고 Town Hall 방면(City 방향) 열차를 탑니다. 정차역: Wynyard → Town Hall.","bu":"컨디션이 좋으면 Luna Park 앞 야경을 5~10분 더 보고 출발합니다.","url":"","one":"","m":0,"q":"Milsons Point Station, Alfred St S, Milso ":14,"mode":"walk","line":"","board":"","alight":"","dep":"20:03","arr":"20:09","dur":6,"cost":0,"notes":"York St 따라 약 170m(순수 도보 2~3분, 출구 위치 고려해 6분).","de":29913663,"ae":29913669}],"bookings":[{"t":"ETA(서브클래스 601) 승인 - 출발 전 필수 (Australian ETA 앱, 수수료 약 AUD 20)","act":1},{"t":"오페라하우스 한국어 투어 14:45 온라인 예매 AUD 37/인 - https://www.sydneyoperahouse.com/tours-and-experiences/korean-tour","act":1},{"t":"호텔 얼리 짐 보관 가능 여부 이메일 확인","act":1},{"t":"각자 비접촉 Visa/Mastercard 준비 (해외 사용 수수료 확인)","act":1}],"tips":["Opal 교통카드를 사지 말고 각자 해외 결제 가능한 비접촉 Visa/Mastercard로 터치하세요. 한 카드로 한 명만 탑승할 수 있고, 같은 카드로 타고 내려야 하루 요금 상한(월~목 AUD 19.30)이 적용됩니다. NSW 정부가 2026년 7월 이후 12개월간 Opal 요금을 2025년 수준으로 동결한다고 발표해(Time Out, 2026-07-06) 이 상한이 11월에도 유효할 가능성이 큽니다.","공항역 접근료 AUD 18.61(공식 확인)은 일일·주간 Opal 상한에 포함되지 않습니다. 접근료 자체의 주간(월~일) 상한은 AUD 37.75라서 같은 주 11/16과 11/19 두 번 이용(합계 AUD 37.22)은 상한 안입니다. 11/19 시드니→골드코스트 국내선도 공항역을 이용하면 두 번째 접근료입니다. 공항역에서는 60분 환승 할인이 적용되지 않습니다.","T8을 타면 Central에서 Town Hall 방면으로 한 번 갈아타는 쪽이 빠르고 안전합니다. T8이 City Circle을 돌아가는 방향이면 Town Hall까지 25분 이상 걸릴 수 있으니 전광판을 확인하세요.","Capitol Square 정류장은 L1(Dulwich Hill선) 전용입니다. 서큘러키행 L2/L3은 바로 옆 Chinatown 정류장에서 탑니다.","오페라하우스 한국어 30분 투어(11:15, 12:15, 13:45, 14:45, 15:45)는 사전 예매가 AUD 5 저렴합니다. 11/16이 예매 달력에 열려 있는지 지금 확인하세요. 투어 15분 전까지 Welcome Centre 체크인 필수이며 5분 이상 늦으면 예약이 취소되고 환불되지 않습니다. A4보다 큰 가방은 맡겨야 하고 큰 여행 가방은 보관이 안 되므로 캐리어는 호텔에 두세요.","하버브리지 보행로는 무료이며 Cumberland St 쪽 계단은 약 64단이고 24시간 운영 엘리베이터도 있습니다(계단 200개는 오페라하우스 투어 이야기입니다). 건너편 Kirribilli(Broughton St)에도 계단 약 61단과 엘리베이터가 있습니다.","Pylon Lookout은 이번 일정에서 뺐습니다. 공식 안내상 토~월 10:00~18:00(마지막 입장 17:00)이고 성인 AUD 29.95이나 요금과 영업시간 모두 최신 여부는 확인하지 못했습니다(신뢰도 낮음). 현금은 받지 않습니다. 온라인 예약 가능 여부도 확인하지 못했으니 시간이 남으면 17:00 이전에 들어가세요.","대부분의 월요일 휴무 식당을 피하기 위해 영업이 확인된 챗타이·로드넬슨 위주로 골랐습니다. 두 곳 모두 2026년 후기는 직접 확인하지 못했으니 가기 전 구글 지도에서 월요일 영업시간과 영업 상태를 한 번 더 보세요.","입국 심사 지연에 대비해 점심 시각을 유연하게 두세요. 일몰 후에도 20:04까지는 시민박명이라 사진을 찍을 수 있습니다.","호텔 짐 보관 가능 여부는 확인하지 못했습니다. 출발 전에 호텔에 메일로 11/16 12:00경 도착 예정이라고 알리세요.","체력이 떨어지면 Mrs Macquarie's Chai  공제 11/14).","act":1},{"t":"대안 예약(3명 최소 충족): 와그 140228 소그룹 시닉월드 + 선셋 + 별보기 (12:00 출발, ₩228,451~ 1인, 최소 3명): https://www.waug.com/ko/activities/140228","act":1},{"t":"식사: 아침 Industry Beans(예약 불필요, 38-40 York St), 점심은 페더데일/시닉월드 카페 또는 테이크어웨이(불포함), 저녁은 카툼바(산위에 등, 예약 불필요; 가이드 지정 가능).","act":0},{"t":"시닉월드 입장권·페더데일 입장권·동물 먹이는 투어 가격에 포함이라 별도 구매 불필요. 코알라 사진(약 A$30)·여행자 보험·식사만 별도.","act":0},{"t":"교통: 이날은 도보와 투어 차량만 이용하므로 오팔 사용 없음(야간에 우버/택시 사용 시 별도).","act":0}],"tips":["【요구 조건 충돌과 선택】 '10시 출발 + 20시 복귀 + 별보기' 3가지를 모두 만족하는 상품은 물리적으로 불가능합니다. 카툼바 일몰 19:41, 항해박명 종료 20:42, 천문박명 종료 21:18(천문 근사 계산 ±2분)이고 블루마운틴 → 시드니는 약 90~100분입니다. 20:00에 도착하려면 18:20쯤 출발해야 하는데 이는 일몰보다 80분 이릅니다. 별보기를 넣으면 복귀는 22:30~23:30이 됩니다. 이 일정은 '10:30 출발 + 시닉월드 + 세자매봉 + 별보기'를 선택하고 복귀를 22:55로 두었습니다. 20시 전후 복귀를 우선하면 별보기를 빼는 낮 투어(와그 159364: 영어/중국어, 시닉월드 포함, 복귀 17~18시 추정)를 고르세요. 11월 서머타임 기간의 일몰·별보기 상품은 보통 12:00~14:30 출발, 22:00~23:30 복귀입니다.","【최소 인원 경고(가장 중요)】 와그 139468 상품 공지에 '최소 여행 인원 4명, 최대 10명'으로 명시되어 있습니다(이전 조사에서 '최소인원 표기 없음'이던 부분을 정정). 3명이면 출발 확정이 안 될 수 있으며, 여행 3일 전(11/14)까지 확정 여부를 안내하고 불확정 시 100% 환불이라고 안내합니다. 예약 전에 고호주 카카오톡(ID: gohojutour)으로 3명 출발 가능 여부를 반드시 물어보세요. 안 되면 대안은 ① 같은 업체의 와그 140228(소그룹 시닉월드 4종 + 선셋 + 별보기, 최소 3명/최대 10명, 12:00 출발, 1인 ₩228,451~, 숙소 근처 드랍, 후기 평점 5.0 13건): 출발이 12:00이라 오전 일정을 바꿔야 함 ② 4번째 인원 자리를 대신 결제(비용 증가) ③ 지그재그투어 124942(14:30 출발)·놀러와시드니 123865(14:00 출발)(둘 다 시닉월드 없음).","【가격】 와그 페이지 표시 ₩28,429(정가 ₩31,588)는 최저가/표기값으로 보이며 실제 1인 금액이 아닐 가능성이 높습니다(같은 업체 140228은 ₩228,451~). 3인 합계는 예약 달력·옵션 단계에서만 확정할 수 있습니다. 이 일정의 비용 계산은 임시로 1인 A$250(약 ₩23만 환산, 불확실)을 넣었으므로 예약 후 수정하세요. 와그 '가을 슈퍼세일 10% 쿠폰'은 2026-10-31까지 사용 가능(페이지 표기).","【취소 규정】 출발 4일 전까지 취소 시 전액 환불, 3일 전 50% 공제, 2일 전~당일은 취소/변경/환불 불가(11/17 기준 11/13까지 무료 취소 추정). 취소 접수는 평일 영업시간(10:00~18:00, 시간대 미표기)만 가능. 날씨와 관계없이 확정 후 투어는 진행됩니다. 날짜 변경은 1회 가능(4일 전까지, 변경일 최소 인원 충족 시).","【시간표는 모두 추정】 업체가 제공하는 시간은 '10:20 집결, 10:30 정시 출발'과 '12시간 이용'뿐이고 각 정차 시각은 없습니다. 본 표의 11:30 페더데일, 13:40 시닉월드, 15:55 에코포인트 등은 이동시간과 공식 운영시간으로 맞춘 예상입니다. 시닉월드는 화요일 16:00 마감이므로 실제로도 낮에 배치될 가능성이 큽니다. 예약 후 받는 바우처/확정서(여행 전날 오전)에서 정확한 순서와 시간을 다시 확인하세요.","【식사】 투어에 식사 불포함입니다. 아침은 Industry Beans(평일 07:00~15:30), 점심은 s2에서 산 테이크어웨이 또는 페더데일/시닉월드 카페, 저녁은 카툼바(예: 산위에 한식당)입니다. 후기 한 건에서 가이드가 로컬 식당으로 안내했다고 하므로 저녁 식당은 가이드 제안을 따르세요.","【체력/옷】 카툼바는 해발 약 1,000m로 시드니보다 5~7도 낮고 해 지면 급격히 추워집니다(11월 밤 8~12도 안팎, 예보 아님). 겉옷·긴바지·모자·선글라스·선크림과 편한 운동화 필수. 별보기 때 얇은 담요/핫팩/장갑 권장. 하루 약 12시간 일정이라 간식과 물 준비.","【숙소 드랍】 상품은 '숙소 드랍까지 제공'이지만 구체 지점은 미표기입니다. 예약 직후 카카오톡으로 'YEHS Hotel Sydney QVB, 143 York St 앞 드랍'을 요청하고 바우처에서 확인하세요. 타운홀역은 호텔에서 도보 2분이므로 '타운홀역 근처 하차'도 대안입니다(YEHS 호텔은 Town Hall 기준 가까움).","【미확인 항목】 Klook·KKday 상품은 봇 차단(HTTP 403)으로 직접 읽지 못했고, 와그 상세 코스는 접힌 영역이라 읽지 못했습니다. 화요일(11/17) 운영 여부는 예약 캘린더에서만 확인 가능(요일 제한 미표기). 별보기 장소, 일몰 장소, 저녁 식당은 업체 미공개라 좌표와 이름은 대표값/예시입니다.","【일출/일몰】 시드니 일출 05:43, 일몰 19:38. 카툼바 일몰 19:41, 시민박명 종료 20:09, 항해박명 종료 20:42, 천문박명 종료 21:18 (NOAA식 천문 계산, ±2분). 11/17은 상현달 무렵(조도 약 50%, 추정)이라 은하수는 약할 수 있습니다."],"rain":"비/짙은 안개: 업체 공지상 확정 후에는 날씨와 관계없이 투어가 진행됩니다. 비옷·방수 신발을 챙기고 페더데일은 지붕 있는 구역 위주, 시닉월드 케이블웨이/레일웨이는 지붕이 있어 약한 비에는 이용하지만 호우 시 중단될 수 있어 가이드가 순서를 조정합니다. 별보기는 구름이 많으면 취소되고 시티 야경 전망대로 대체되는 사례가 있으며(후기), 이 경우 복귀가 더 늦어질 수 있습니다. 날짜 변경이 필요하면 출발 4일 전(11/13)까지만 1회 가능(변경일 최소 인원 충족 시). 투어 자체가 불가하면 시드니 시내 실내 일정(QVB, 시드니 타워, 오스트레일리안 뮤지엄 등)으로 대체.","tzchg":0},{"date":"2026-11-18","key":"1118","wd":"수","ck":"syd","city":"Sydney (Manly)","short":"맨리 페리 데이","sub":"노스헤드 전망대, 맨리 비치, 쉘리비치 스노클링, 일몰 무렵 페리와 CBD 저녁","sun":"일출 05:41 · 일몰 19:38","cost":207,"hotel":"예스 호텔 시드니 QVB","hotel_city":"시드니","summary":"호텔(YEHS QVB)에서 걸어서 서큘러키(오페라 쿼이스)로 가 아침을 먹고, 09:45경 F1 맨리 페리를 탑니다. 맨리에서는 Stand C에서 161번 버스를 타고 노스헤드 생추어리 앞에서 내려 도보 약 12분으로 Fairfax Walk 전망대를 돌아봅니다. 점심은 맨리 워프의 Manly Fish \u0026 Chips입니다. 오후에는 코르소와 맨리 비치를 지나 스노클 장비를 빌리고, 해안 산책로로 쉘리비치까지 걸어가 먼저 보트하우스 키오스크(16시 마감 가능성)에서 간식을 먹은 뒤 스노클링을 합니다. 장비를 반납하고 펠론스에서 쉬다가 19:00경 페리로 돌아와(일몰 19:38) 서큘러키 근처 Mr Wong에서 저녁을 먹고 21:15경 호텔로 걸어 돌아옵니다. 내일 10:00 체크아웃이므로 귀가 후 짐을 쌉니다. 페리와 버스 161의 정확한 출발 시각은 공식 시간표를 확인하지 못해 추정치입니다. 전날 Transport NSW 앱에서 꼭 확인하세요(신뢰도 낮음).","weather":"11월 중순 시드니의 일반적인 기후는 낮 최고 24~25도, 아침 최저 16~17도입니다. 해수온은 약 20도 안팎으로 추정되며 확인한 수치는 아닙니다. 예보는 아직 나오지 않았으니 3일 전쯤 BoM(기상청)에서 확인하세요. 자외선이 강하니 선크림과 모자를 챙기세요. (일출 05:41, 일몰 19:38은 sunrise-sunset.org API로 확인)","stops":[{"id":"s1","k":"YEHS 호텔 시드니 QVB (출발)","n":"YEHS Hotel Sydney QVB","kind":"hotel","lat":-33.872424,"lng":151.206266,"adr":"143 York St, Sydney NSW 2000","a":"08:10","l":"08:10","ea":29915830,"el":29915830,"tz":660,"hrs":"체크아웃은 내일 11/19 10:00. 오늘은 짐을 두고 출발","cost":null,"bk":"","wt":"가벼운 데이팩(수건, 선크림, 방수 가방, 여벌 옷, 수영복)을 메고 출발합니다. 수영복은 안에 입고 가면 편합니다.","bu":"","url":"","one":"수영복 입고 데이팩 메고 출발","m":1,"q":"YEHS Hotel Sydney QVB, 143 York St, Sydney NSW 2000"},{"id":"s2","k":"베니스 카페 앤 비스트로 (아침)","n":"Bennies Cafe \u0026 Bistro","kind":"cafe","lat":-33.86,"lng":151.213,"adr":"Shop 10, 3 Macquarie St, Sydney NSW 2000 (Opera Quays 인근, 좌표는 근사치)","a":"08:32","l":"09:10","ea":29915852,"el":29915890,"tz":660,"hrs":"수요일 영업시간은 공식 확인 실패 (sydney.com 목록에도 시간 없음, 신뢰도 낮음). 아침 메뉴 제공으로 소개됨. 전화 (02) 8000 3333","cost":22,"bk":"불필요","wt":"브런치 메뉴(에그 베네딕트, 아보카도 토스트 등)와 플랫화이트로 든든히 먹습니다. 오전에 많이 걷기 때문입니다.","bu":"문을 닫았거나 만석이면 오페라 쿼이스와 서큘러키 주변의 다른 카페로 갑니다. 가까운 곳에 카페가 여럿 있습니다.","url":"https://www.sydney.com/destinations/sydney/sydney-city/city-centre/food-and-drink/bennies-cafe-and-bistro","one":"브런치와 커피로 든든히 아침","m":1,"q":"Bennies Cafe \u0026 Bistro, Shop 10, 3 Macquarie St, Sydney NSW 2000"},{"id":"s3","k":"서큘러키 3번 부두 (맨리행 페리)","n":"Circular Quay Wharf 3 (Manly ferry)","kind":"pier","lat":-33.8614,"lng":151.2115,"adr":"Circular Quay, Sydney NSW 2000 (3번 부두는 맨리 페리 전용)","a":"09:19","l":"09:45","ea":29915899,"el":29915925,"tz":660,"hrs":"F1 맨리 페리: 평일 이른 아침부터 심야까지 운항, 낮에는 약 30분 간격 (공식 시간표 미확인, 신뢰도 낮음)","cost":null,"bk":"불필요 (Opal 또는 컨택트리스 카드 탭)","wt":"Opal 카드나 컨택트리스 카드를 한 사람당 하나씩 준비해 개찰구에서 탭온 합니다. 올라갈 때 윗층 야외석 오른쪽에 앉으면 오페라하우스와 하버브리지가 잘 보입니다.","bu":"F1이 지연되거나 결항되면 Manly Fast Ferry(별도 운영사, 약 20분 소요, 다른 부두에서 출발)를 이용합니다. Opal 사용 여부는 운영사 페이지에서 확인하세요.","url":"https://transportnsw.info/routes/details/sydney-ferries-network/manly/F1","one":"","m":0,"q":"Circular Quay Wharf 3, Circular Quay, Sydney NSW 2000"},{"id":"s4","k":"맨리 워프 (도착)","n":"Manly Wharf","kind":"pier","lat":-33.7999,"lng":151.2846,"adr":"East Esplanade, Manly NSW 2095","a":"10:15","l":"10:20","ea":29915955,"el":29915960,"tz":660,"hrs":"페리 운항 시간 내 상시","cost":null,"bk":"불필요","wt":"하선 후 탭오프 합니다. 화장실을 다녀오고 바로 앞 버스 정류장(Stand C)으로 이동합니다.","bu":"","url":"","one":"","m":0,"q":"Manly Wharf, East Esplanade, Manly NSW 2095"},{"id":"s5","k":"맨리 워프 버스 정류장 Stand C (161번 탑승)","n":"Manly Wharf Stand C (bus 161 to North Head)","kind":"station","lat":-33.8007,"lng":151.2845,"adr":"Manly Wharf forecourt, near Manly Visitor Information Centre, Manly NSW 2095 (좌표는 근사치)","a":"10:25","l":"10:30","ea":29915965,"el":29915970,"tz":660,"hrs":"161번은 Harbour Trust와 Hello Manly 안내상 약 30분 간격 (정확한 수요일 시각표 미확인, 신뢰도 낮음). Transport NSW 방문자 안내는 Stand C(정류장 번호 209579)를 161번 North Head 승차장으로 표기","cost":null,"bk":"불필요","wt":"161번 North Head행 버스를 탑니다. 승차 시 탭온, 하차 시 탭오프 합니다. 하차 정류장은 North Head Scenic Dr, North Head Sanctuary 맞은편입니다.","bu":"버스 시간이 안 맞거나 안 오면 걸어서 갑니다. Harbour Trust 안내로 맨리 워프에서 North Head Sanctuary까지 약 40~45분이고 Fairfax Walk까지는 더 멉니다. 택시나 우버로 가거나 오전 노스헤드를 건너뛰고 오후 일정부터 시작해도 됩니다.","url":"","one":"","m":0,"q":"Manly Wharf Stand C, Manly Wharf forecourt, near Manly Visitor Information Centre, Manly NSW 2095"},{"id":"s6","k":"노스헤드 생추어리 맞은편 버스 정류장 (하차)","n":"North Head Scenic Dr opp North Head Sanctuary (bus stop)","kind":"station","lat":-33.8172,"lng":151.2957,"adr":"North Head Scenic Dr, North Head NSW 2095 (좌표는 근사치, 신뢰도 낮음)","a":"10:45","l":"10:47","ea":29915985,"el":29915987,"tz":660,"hrs":"버스 운행 시간 내 상시","cost":null,"bk":"불필요","wt":"탭오프 하고 Fairfax Walk 쪽(남동쪽)으로 North Head Scenic Dr을 따라 걷습니다. 정류장 위치는 앱 지도로 꼭 확인하세요. 버스가 Fairfax Walk 가까이까지 가는지 확인되지 않았습니다.","bu":"앱에서 Fairfax Walk에 더 가까운 정류장이 보이면 거기서 내려도 됩니다. 걷기 싫으면 North Head Sanctuary 방문자센터(10~16시, 자원봉사 운영)와 포대 유적만 둘러봅니다.","url":"","one":"","m":0,"q":"North Head Scenic Dr opp North Head Sanctuary, North Head Scenic Dr, North Head NSW 2095"},{"id":"s7","k":"페어팩스 워크와 전망대 (노스헤드)","n":"Fairfax Walk and Lookouts, North Head","kind":"sight","lat":-33.821,"lng":151.2998,"adr":"End of North Head Scenic Dr, North Head, Manly NSW 2095","a":"10:59","l":"11:45","ea":29915999,"el":29916045,"tz":660,"hrs":"산책로는 일출~일몰 주간 개방으로 알려져 있음. 2026년 2월 폐쇄는 지났고 11월 폐쇄 공지는 찾지 못했음. North Head 일부 구역(Cannae Point 등)은 낙석과 화재 피해로 부분 폐쇄 중이라 NPWS 알림을 확인하세요","cost":0,"bk":"불필요","wt":"약 1km 평탄한 길을 따라 전망대(Yiningma 등)를 돕니다. 시드니 CBD, 하버, 외해가 보입니다. 사진을 찍고 쉬며 45분 잡았습니다. 무료입니다.","bu":"길이 막혀 있으면 North Head Sanctuary 방문자센터(좌표 -33.8177,151.2960)와 North Fort 포대 유적을 둘러봅니다.","url":"https://www.nationalparks.nsw.gov.au/things-to-do/walking-tracks/fairfax-walk","one":"노스헤드 평탄한 길 1km 전망대 산책","m":1,"q":"Fairfax Walk and Lookouts, North Head, End of North Head Scenic Dr, North Head, Manly NSW 2095"},{"id":"s8","k":"노스헤드 버스 정류장 (맨리행 귀환)","n":"North Head Scenic Dr bus stop (return to Manly)","kind":"station","lat":-33.8172,"lng":151.2956,"adr":"North Head Scenic Dr, North Head NSW 2095 (좌표는 근사치, 신뢰도 낮음)","a":"11:57","l":"12:05","ea":29916057,"el":29916065,"tz":660,"hrs":"161번 약 30분 간격 추정 (신뢰도 낮음)","cost":null,"bk":"불필요","wt":"맨리행 161번을 탑니다. 승차 시 탭온 합니다. 정류장에서 다음 버스 시각을 확인하고 놓치면 30분 기다립니다.","bu":"버스가 오지 않으면 택시나 우버를 부르거나 걸어 내려갑니다(약 40분).","url":"","one":"","m":0,"q":"North Head Scenic Dr bus stop, North Head Scenic Dr, North Head NSW 2095"},{"id":"s9","k":"맨리 피시앤칩스 (맨리 워프, 펠론스 계열) (점심)","n":"Manly Fish \u0026 Chips (Manly Wharf)","kind":"restaurant","lat":-33.8,"lng":151.285,"adr":"East Esplanade, Manly Wharf, Manly NSW 2095 (좌표는 근사치)","a":"12:25","l":"13:25","ea":29916085,"el":29916145,"tz":660,"hrs":"11:00~21:00 매일 (Concrete Playground, 2026.9.4 갱신, 공식 미확인)","cost":28,"bk":"불필요 (워크인)","wt":"생선과 감자튀김, 새우롤, 피시버거, 시드니 락오이스터를 시킵니다. 3명이 2~3개를 나눠 먹고 하버를 보며 먹습니다. 갈매기를 조심하세요.","bu":"만석이면 Fishmongers Manly(Shop 4, 11-27 Wentworth St, 12:00~21:00, 02 9977 1777)로 갑니다. 워프에서 걸어서 약 5분입니다.","url":"https://concret t":1},{"t":"스노클 장비 대여는 Manly Surfboards에 영업시간과 재고 사전 확인 (예약은 제3자 사이트)","act":1},{"t":"국내선 SYD→OOL 11/19 항공권 미예약, 여행 전에 미리 예약 필요","act":1}],"tips":["교통비: 3명 각자 Opal 카드나 컨택트리스 카드를 쓰면 수요일 하루 상한 A$19.30(Transport NSW 공식 확인, 월~목)이 적용됩니다. 페리 왕복과 버스를 합쳐도 1인 A$19.30을 넘지 않습니다. 같은 카드로 탭온/탭오프 하세요. 한 장으로 여럿이 탭하면 정산이 꼬입니다.","페리 요금은 자료마다 달라(A$8.39~9.20) 신뢰도가 낮습니다. 정확한 요금과 시간표는 Transport NSW 앱에서 보세요.","페리와 버스 161의 실제 시각은 공식 확인을 못 했습니다. 출발 전날 앱에서 F1 맨리행과 161번 시각을 확인하고, 이 일정의 시각을 그에 맞춰 옮기세요. 161번은 Manly Wharf Stand C에서 탑니다.","161번 버스는 North Head Sanctuary(North Fort) 맞은편에서 내리고, 거기서 Fairfax Walk까지 약 12분 걸어야 합니다. Fairfax Walk 바로 앞까지 가는지는 확인하지 못했으니 앱 지도로 정류장을 확인하세요.","쉘리비치 키오스크(보트하우스)는 16시 마감으로 알려져 먼저 들르는 순서로 짰습니다. 해안 산책이 편도 약 1.5~1.8km이니 편한 신발과 물병을 챙기세요. 오전에 노스헤드를 못 가면 오후에 쉘리비치부터 가고 해변 휴식을 늘려도 됩니다.","스노클링은 수영이 가능한 사람만 하세요. 11월 수온이 서늘할 수 있어 웨트수트(A$10)를 추천합니다. 대여점 영업시간은 제3자 자료(월~금 09:00~18:00)라 오전에 전화나 온라인으로 확인하세요.","일몰 19:38에 맞춰 19:00 페리를 탑니다. 윗층 야외석은 먼저 줄을 서면 앉기 쉽습니다.","내일(11/19) 10:00 체크아웃입니다. 귀가 후 짐을 싸고 젖은 물건은 비닐백에 넣으세요. 국내선 SYD→OOL 항공권은 아직 예약 전이므로 여행 전에 미리 예약하세요.","시드니는 AEDT(UTC+11) 서머타임입니다. 한국과 시차는 2시간이며 시드니가 2시간 빠릅니다."],"rain":"비가 오면 해안 산책과 스노클링은 취소합니다. 가벼운 비면 오전 노스헤드 대신 맨리 코르소 카페나 Fishmongers Manly(12:00~21:00)에서 점심을 일찍 먹고, 오후 페리로 일찍 돌아옵니다. 큰비나 번개가 치면 맨리 일정을 접고 시드니 Art Gallery of NSW(The Domain, 매일 10:00~17:00, 수요일은 22:00까지, 일반 입장 무료)에서 시간을 보낸 뒤 저녁은 Mr Wong 대신 호텔 근처 Chat Thai로 가세요. 페리는 대부분 비가 와도 운행하지만 강풍과 높은 파도에서는 결항할 수 있으니 앱 알림을 확인하세요.","tzchg":0},{"date":"2026-11-19","key":"1119","wd":"목","ck":"gc","city":"Sydney → Gold Coast (Surfers Paradise)","short":"시드니 → 골드코스트","sub":"체크아웃 → QF594 국내선 → 골드코스트 → 서퍼스 파라다이스 석양과 스카이포인트","sun":"골드코스트 일몰 18:19 · 시드니 19:39","cost":326,"hotel":"만트라 온 뷰 호텔","hotel_city":"골드코스트","summary":"오전에 시드니 호텔에서 체크아웃하고 T8 공항철도로 Domestic 역까지 간 뒤, Qantas QF594(13:40 SYD → 14:05 OOL, 현지시각 기준, 퀸즐랜드는 서머타임이 없어 1시간 느림)를 탑니다. 골드코스트 공항에서는 777번 버스(15분 간격, 약 20분)로 Burleigh Heads 역까지 가서 G:link 트램 L1(Helensvale 방면, 승강장 1번)으로 갈아타 Cypress Avenue 역에 내립니다. 호텔 체크인 후 서퍼스 파라다이스 해변과 Cavill Ave를 걷고, 일몰(18:19) 전에 SkyPoint 전망대에 올라 노을과 야경을 본 뒤 트램으로 한 정거장 이동해 저녁을 먹습니다. 항공편 시각은 2026년 10월 현재 목요일 운항 시각(QF594 13:40/14:05)을 기준으로 한 것이므로 예약 때 항공사 사이트에서 다시 확인해야 합니다. 777번 버스와 G:link 시각은 Translink 공식 GTFS(2026-11-19 목요일 기준)로 직접 확인했습니다.","weather":"11월 19일은 2주 이상 남아 예보가 없습니다. 평년 기준 시드니 약 16~24도, 골드코스트 약 19~26도입니다. 11월은 퀸즐랜드 남동부의 오후 뇌우 시즌 초입이라 늦은 오후에 소나기나 천둥번개 가능성이 있습니다. 출발 전날 BOM(bom.gov.au) 예보를 확인하세요.","stops":[{"id":"s1","k":"YEHS 호텔 시드니 QVB","n":"YEHS Hotel Sydney QVB","kind":"hotel","lat":-33.872424,"lng":151.206266,"adr":"143 York St, Sydney NSW 2000","a":"08:40","l":"08:54","ea":29917300,"el":29917314,"tz":660,"hrs":"체크아웃 10:00 (짐은 방 또는 프런트에 보관)","cost":null,"bk":"불필요","wt":"짐을 챙겨 두고 가벼운 몸으로 아침 식사 장소로 출발합니다. 체크아웃은 10:00 전에 마칩니다.","bu":"","url":"","one":"짐 두고 아침 먹으러 출발","m":1,"q":"YEHS Hotel Sydney QVB, 143 York St, Sydney NSW 2000"},{"id":"s2","k":"검프션 바이 커피 알케미 (스트랜드 아케이드)","n":"Gumption by Coffee Alchemy (Strand Arcade)","kind":"cafe","lat":-33.8694568,"lng":151.2075762,"adr":"Shop 11, Strand Arcade, 412-414 George St, Sydney NSW 2000","a":"09:00","l":"09:42","ea":29917320,"el":29917362,"tz":660,"hrs":"Time Out 기준 목 09:00-20:00 (Concrete Playground의 08:00-18:00은 2013년 자료라 오래됨, Trip.com 평일 08:00-16:30도 일반 범위). 정확한 오픈 시각은 확신 낮음","cost":22,"bk":"불필요","wt":"시드니 시내 스페셜티 커피로 유명한 곳입니다. 커피와 가벼운 브런치(토스트, 에그 메뉴, 페이스트리)로 아침을 먹습니다. 점심을 공항에서 먹으므로 가볍게 먹습니다.","bu":"호텔 바로 옆 QVB 안의 카페 또는 George St의 아무 카페. 09:00에 열려 있지 않으면 York St/Druitt St 주변 카페로 이동합니다.","url":"https://www.timeout.com/sydney/restaurants/gumption","one":"스페셜티 커피로 아침","m":1,"q":"Gumption by Coffee Alchemy, Shop 11, Strand Arcade, 412-414 George St, Sydney NSW 2000"},{"id":"s3","k":"YEHS 호텔 (짐 수령 및 체크아웃)","n":"YEHS Hotel Sydney QVB (check-out)","kind":"hotel","lat":-33.872424,"lng":151.206266,"adr":"143 York St, Sydney NSW 2000","a":"09:48","l":"09:56","ea":29917368,"el":29917376,"tz":660,"hrs":"체크아웃 10:00까지","cost":null,"bk":"불필요","wt":"맡겨 둔 짐을 찾고 키를 반납해 체크아웃합니다.","bu":"","url":"","one":"짐 찾고 체크아웃"  운항합니다. PlaneMapper의 2026-10-22(목) 데이터로 JQ410(13:20→13:40, T2), QF594(13:40→14:05, T3), Qantas QF596(15:50→16:15)을 확인했습니다. 11월 스케줄은 항공사 사이트에서 최종 확인하세요. 3명이 모두 Qantas로 가는 것을 전제로 짰습니다.","항공 운임 참고(편도, 1인): Jetstar Starter A$69-129 + 위탁수하물 예약 시 A$32-55(공항 현장 A$75-130), Virgin Choice A$129-199(23kg 포함), Qantas Red e-Deal A$139-229(23kg 포함). 3명이면 위 금액의 3배이며 총액이 비슷하므로 Qantas의 정시성과 수하물 포함이 편합니다. 운임은 가변이므로 예약 시 실제 요금으로 확정하세요.","공항철도 요금: 시드니 공항역은 일반 Opal 요금에 공항역 이용료(Transport NSW 공식 페이지 현재 표기 성인 A$18.61, 주간 상한 A$37.75)가 붙어 편도 1인 약 A$23-25입니다. 3명이면 약 A$70이므로 택시/우버보다 저렴하거나 비슷합니다. 공항역에서는 60분 환승 혜택이 적용되지 않으니 탭오프 후 다시 타면 이용료가 다시 붙습니다.","시간 여유: 호텔 체크아웃이 10:00이고 비행은 13:40이라 공항 도착(10:36)이 3시간 이상 빠릅니다. 이는 짐을 일찍 부치고 공항 점심으로 여유를 두는 구성입니다. 수하물 위탁 키오스크가 10:40 전에 안 열리면 점심을 먼저 먹으세요. 원하면 호텔에 짐을 맡기고 시드니에서 한 시간 더 보낸 뒤 11:15쯤 출발해도 13:40 비행에는 충분합니다.","SkyPoint: 07:30-21:00(마지막 입장 20:30)이 일반 시간이나 공식 시간표가 11/18까지만 게시되어 있어 11/19는 방문 전 재확인이 필요합니다. 온라인 'Fixed Date'가 가장 저렴하지만 날짜 고정이므로 날씨가 불안하면 'Flexi Access'(A$51부터)를 고르세요. 일몰은 18:19, 박명 종료 18:44, 17:45 전에 올라가면 해가 지는 모습을 충분히 볼 수 있습니다.","교통카드: 퀸즐랜드 Translink는 남동부(SEQ) 전 노선 50센트 균일요금입니다(공항 Airtrain 제외). Visa/Mastercard 비접촉 카드나 Apple/Google Pay로 탭온/탭오프하며, 탭오프를 빼먹으면 최대 요금이 부과될 수 있으니 하차 시 반드시 탭오프합니다. 3명은 각자 다른 카드를 사용합니다.","G:link 승강장: Burleigh Heads, Surfers Paradise, Cypress Avenue 모두 Helensvale 방면은 승강장 1번입니다. 반대로 Burleigh Heads 방면은 2번입니다.","해변 안전: 서퍼스 파라다이스는 깃발 사이에서만 수영합니다. 이 일정은 수영 없이 산책 위주입니다.","확신이 낮은 항목: Gumption/Lotus Dumpling Bar/Baritalia/Messina의 11/19 정확한 영업시간, Town Hall 출발 T8 정확한 시각, 항공 운임, T3의 식당 위치(보안검색 전후), 수하물 위탁 개시 시각은 직접 확인 전 대표값입니다."],"rain":"비/뇌우 시: (1) 해변 산책은 생략하고 호텔에서 휴식 후 16:30에 Cavill Ave의 Paradise Centre 쇼핑몰 안에서 Messina 젤라토를 먹으며 시간을 보냅니다. (2) SkyPoint는 비가 약하면 그대로 가고(77층 실내 전망대), 뇌우나 안개로 시야가 막히면 Flexi Access 티켓으로 바꾸거나 다음날 11/20 맑은 시간에 방문합니다(날짜 고정 티켓은 변경 불가이므로 날씨가 불안하면 처음부터 Flexi 권장). (3) 저녁은 실내 식당(Baritalia) 그대로이며, 트램은 호텔 앞 Cypress Ave 역에서 2-3분이라 비를 거의 맞지 않습니다. (4) 항공 지연 시: 777번과 트램은 저녁까지 15분 이하 간격이라 대체 편이 많으나, 일몰 관람이 어려울 수 있으니 SkyPo t":0,"notes":"호텔까지 도보 약 2~3분","de":29919440,"ae":29919443}],"bookings":[{"t":"커럼빈 야생동물 보호구역 입장권 3매 온라인 사전 예매 (https://currumbinsanctuary.com.au/visit/tickets/)","act":1},{"t":"(선택) 유료 코알라 체험은 별도 예약 필요","act":1},{"t":"(권장) 확실한 일몰 저녁을 원하면 The Tropic 예약 (https://thetropic.com.au/ , 07 5240 9869). The Pav는 금요일 저녁 예약 불가(워크인)","act":1},{"t":"(선택) Justin Lane 점심 예약 (https://justinlane.com.au/home/)","act":1}],"tips":["교통 변경 매우 중요: 2026-08-09 G:link 벌리 헤즈 연장 개통(공식 프로젝트 페이지 확인), 700번은 Stockland Burleigh Heads~Tweed Heads 구간 운행(GTFS 확인). 구글맵/구버전 안내는 Broadbeach South 환승을 안내할 수 있으니 'G:link 직행 후 700번' 방식을 따르세요. 출발 전날 Translink 앱/Journey Planner로 한 번 더 확인하세요.","시각표는 Translink 공식 GTFS(유효기간 2026-10-22~2026-12-21)의 11/20 금요일 평일 운행에서 직접 대조했습니다(L1, 700번 모든 시각 일치).","요금은 SEQ 전 노선 균일 50센트(영구화, 에어트레인 제외)입니다. 같은 카드로 탭 온/탭 오프 하고, 3명 각자 카드(비접촉 카드 또는 go card)가 필요합니다.","커럼빈 입장권은 공식 'From A$50'(온라인 수수료 1.75%)이지만 2026년 가이드는 성인 A$65로 소개합니다. 예매 화면에서 확정하세요. 결제는 카드(현금 불가 안내).","코알라: 퀸즐랜드는 코알라 안기를 주 차원에서 금지하지 않으며 커럼빈은 코알라 사진 체험 콤보(A$129~)를 판매합니다. 이날 가능 여부와 방식은 예약 사이트에서 확인하세요.","로리키트 무료 먹이주기(08:00/16:00)는 이 동선과 맞지 않습니다.","금요일 밤 참고: 커럼빈 Astra Lumina 야간 산책은 금·토 운영(From A$30)입니다. 이 일정에는 넣지 않았지만 원하면 별도 예약으로 가능합니다.","The Pav는 금요일 저녁 예약이 안 되고 붐빕니다. 복장 규정(smart casual, 슬리퍼·민소매 불가)을 지키고 17:15 전에 입장하세요. 확실한 좌석을 원하면 The Tropic을 예약하세요(07 5240 9869).","국립공원 Ocean View Track은 2025년 9월 산불 피해와 11월 제초 작업으로 폐쇄된 적이 있고, 악천후 전후로 낙석 위험으로 임시 폐쇄될 수 있습니다. 2026년 현황은 확인하지 못했으니 Queensland Parks park alerts를 확인하세요. 출입금지 보울더 필드(Cannon Rock 등)는 들어가지 마세요.","남쪽 입구 좌표는 Jellurgal 문화센터(1711 Gold Coast Hwy)와 버스정류장 300177이 같은 위치임을 확인했습니다. 툼건 전망대 좌표는 지도 데이터(OSM 기반)로 확인했습니다.","11월 퀸즐랜드는 자외선이 매우 강하니 선크림, 모자, 물 필수. 오후에는 소나기/뇌우가 잦은 편이라 접이식 우산이나 우비를 챙기세요."],"rain":"비가 오면: (1) 커럼빈 보호구역은 그대로 가되 코알라 너서리, 파충류관, Lost Valley 에비어리처럼 지붕 있는 구역 위주로 관람하고 야외 쇼는 취소될 수 있으니 입구에서 확인하세요. (2) 오후 벌리 헤드 국립공원 걷기는 비 오는 날 미끄럽고 낙석 위험(Ocean View Track 임시 폐쇄 가능)이 있으니 생략하고, 점심을 Justin Lane에서 느긋하게 먹은 뒤 700번 버스 종점 Stockland Burleigh Heads(쇼핑몰)에서 실내 시간을 보내거나 The Pav/The T OMA는 일반 상설전 입장 무료이나 'Make, Believe, Magic: The Worlds of The Jim Henson Company'(2026-09-12 ~ 2027-04-18)는 유료 시간지정 티켓(가격 미확인, 마지막 입장 16:00). 이번 일정에는 넣지 않았고, 비 오는 날 대체로 고려. 사우스뱅크 퀸즐랜드 박물관은 현재 'Queensland Museum Kurilpa'로 표기.","저녁 Stanley는 토요일이므로 예약 필수에 가까움. 예약이 안 되면 같은 HSW 내 Fellini's Trattoria(워크인, 수-일 12:00-22:00) 또는 Felons Barrel Hall로 즉시 변경.","페리는 강풍/뇌우 시 운휴 가능(2026년 8월 브리즈번 시의회 페리 노조 업무정지 사례 있음 - 11월 공지는 확인되지 않음). 야간 귀환이 막히면 Uber/택시로 HSW → 호텔(약 AUD 15-20 추정, 신뢰도 낮음) 이용.","CityCat 승선 시 진행방향 왼쪽 창가가 시내(CBD) 쪽 풍경(이전 안내의 '오른쪽'은 오류였음).","캥거루 포인트 야경은 번화한 강변 구간(Holman St 터미널~Captain Burke Park)에서만 짧게 머물고 21:00 전에 복귀. 스토리 브리지 조명 색은 날마다 바뀜.","예상 1인 비용: 점심 35 + 마켓 간식 8 + 퍼시벌스 음료 12 + 저녁 85 + 교통 약 2.5 = 약 AUD 143(식비는 추정치, 신뢰도 낮음)."],"rain":"오전 이동은 실내(G:link·열차)라 영향 없음. 오후에 비가 오면 (1) 점심 후 Collective Markets/Streets Beach를 건너뛰고 GOMA(일반 상설전 무료, 개관 10:00-17:00)와 Queensland Museum Kurilpa(9:30-17:00, 일반 입장 무료, SparkLab 유료)로 대체하고 각각 약 60-90분. 두 곳은 사우스뱅크 문화 센터 구역에서 도보 5분 거리이며 호텔로 복귀 시 Victoria Bridge 경유 Queen St Mall 실내 아케이드를 활용. (2) 17:07 CityCat은 강풍·뇌우 시 운휴될 수 있으므로 운행 여부를 Translink 앱에서 확인하고, 불가하면 Uber/택시(약 AUD 15-20)로 HSW 이동 후 Stanley 18:00 저녁(실내석)은 그대로 유지. (3) 야경은 Stanley 식후 HSW 보드워크(지붕 있는 구간)에서 스토리 브리지만 감상하고 캥거루 포인트 이동은 생략, 귀환은 19:27/19:55 페리 또는 택시.","tzchg":0},{"date":"2026-11-22","key":"1122","wd":"일","ck":"bne","city":"Brisbane / Moreton Island (Tangalooma)","short":"모턴 아일랜드 당일치기","sub":"탕갈루마 난파선 스노클링","sun":"일출 04:46 · 일몰 18:22","cost":298,"hotel":"그레이트 서던 호텔 브리즈번","hotel_city":"브리즈번","summary":"호텔 근처 지미스 온 더 몰에서 아침을 먹고 Royal on the Park 앞에서 08:35에 탕갈루마 셔틀버스(STA)를 타고(08:35 픽업이 셔틀의 마지막 출발 시간) Holt Street Wharf로 이동합니다. 10:00 카타마란을 타고 75분 걸려 11:15 탕갈루마에 도착하고, 13:00 난파선(Wrecks) 가이드 스노클링(전체 90분, 실제 물속 약 30~35분)을 합니다. 점심은 패키지에 포함된 A$25 바우처로 리조트 식당에서 해결하고 오후에는 해변과 수영장에서 쉽니다. 16:00 배로 돌아와 17:30 셔틀을 타고 시내로 돌아오며(Royal on the Park 도착은 정차 순서에 따라 18:05~18:30 예상), CBD의 Corbett \u0026 Claude에서 피자로 저녁을 먹고 호텔로 걸어 돌아옵니다. 샌드 토보건(모래썰매)은 스노클링과 같은 시간대(13:00~13:15)라 10:00 배로는 둘 다 할 수 없습니다. 둘 다 하려면 07:30 배를 타야 하며 팁에 적어 두었습니다.","weather":"11월 하순 브리즈번은 늦봄입니다. 평균 최고 약 28도, 최저 약 18도이고 오후에 소나기나 뇌우가 올 수 있습니다. 자외선 지수가 매우 높습니다. 이 날짜의 예보는 아직 나오지 않아 계절 평균으로 적었습니다. 탕갈루마 투어는 날씨와 파도에 따라 취소될 수 있습니다. 출발 전날(11/21)에 예보를 보고, 탕갈루마의 예약 재확인(출발 24시간 전까지 확인 안내)을 꼭 하세요. 시간대는 퀸즐랜드 AEST(UTC+10)이며 서머타임이 없습니다(시드니와 1시간 차이).","stops":[{"id":"s1","k":"그레이트 서던 호텔 브리즈번","n":"Great Southern Hotel Brisbane","kind":"hotel","lat":-27.47284,"lng":153.02539,"adr":"103 George St, Brisbane City QLD 4000","a":"07:00","l":"07:10","ea":29921580,"el":29921590,"tz":600,"hrs":"체크인 14:00 / 체크아웃 10:00 (11/24). 이 날은 3박 중 2일차라 짐은 두고 가볍게 출발","cost":null,"bk":"불필요(숙박 예약 완료)","wt":"일어나 수영복을 겉옷 안에 입고 출발합니다. 타올, 선크림, 모자, 선글라스, 물, 멀미약, 예약 때 쓴 신용카드(승선 때 예약자 카드 일치 확인)를 챙깁니다. 셔틀은 가방 1개만 허용되며 크기는 56x36x23cm 이하입니다.","bu":"호텔 조식은 시간이 맞지 않아 이용하지 않습니다.","url":"","one":"수영복 입고 일찍 출발","m":1,"q":"Great Southern Hotel Brisbane, 103 George St, Brisbane City QLD 4000"},{"id":"s2","k":"지미스 온 더 몰 (아침 식사)","n":"Jimmy's on the Mall","kind":"restaurant","lat":-27.46946,"lng":153.02547,"adr":"Queen Street Mall, Brisbane City QLD 4000","a":"07:15","l":"08:10","ea":29921595,"el":29921650,"tz":600,"hrs":"일요일 07:00-24:00. 아침 메뉴는 매일 07:00-11:00 (공식 사이트와 2026년 6월자 아침 메뉴 PDF 확인)","cost":29,"bk":"불필요(07:00 오픈 직후라 예약 없이 가능)","wt":"퀸 스트리트 몰 위의 대형 레스토랑입니다. 아침 메뉴에서 에그 베네딕트(A$24), 클럽 브렉퍼스트(A$28), 아보카도 에그 토스트(A$22) 중에서 고르고 커피(A$5.5~)를 곁들입니다. 배에서 멀미가 올 수 있으니 기름진 음식은 적당히 드세요. 카드 결제는 1.1% 수수료가 붙습니다.","bu":"Cafe Mondial (167 Albert St, Royal Albert Hotel 1층)은 걸어서 약 6분이며 일요일 07:00 오픈은 제3자 정보라 확인이 필요합니다.","url":"https://www.jimmysonthemall.com.au","one":"퀸 스트리트 몰 위 레스토랑에서 아침","m":1,"q":"Jimmy's on the Mall, Queen Street Mall, Brisbane City QLD 4000"},{"id":"s3","k":"로열 온 더 파크 앞 셔틀 탑승 지점","n":"Royal on the Park (STA shuttle pickup)","kind":"station","lat":-27.47283,"lng":153.02912,"adr":"152 Alice St, Brisbane City QLD 4000","a":"08:20","l":"08:35","ea":29921660,"el":29921675,"tz":600,"hrs":"탕갈루마 셔틀 10:00 배 연결편 픽업 08:35 픽업 (셔틀의 마지막 출발 시간)","cost":50,"bk":"필수·선불. 일일투어 예약 후 STA 셔틀 추가: 탕갈루마 1300 652 250 또는 STA 1300 782 118 (24시간). 왕복 1인 A$25x2. https://www.tangalooma.com/resort-info/getting-here/bus-coach-transfers","wt":"탕갈루마 공식 사이트에 적힌 시내 픽업 지점은 Cineplex Southbank 08:00, Roma St 08:10, Marriott Brisbane 08:25, Royal on the Park 08:35입니다. 그레이트 서던 호텔은 지점이 아니고 이곳이 가장 가깝습니다(직선 약 370m, 걸어서 약 8~10분). 08:25까지 도착해 기다리고 버스 기사에게 예약 이름을 말합니다. 버스 안에서는 음식과 음료가 금지입니다.","bu":"셔틀을 놓치면 Uber/택시로 Holt Street Wharf까지 약 15~20분, 3명 기준 약 A$35~50(추정, 신뢰도 낮음). 부두에 대중교통 버스와 기차는 없습니다. 체크인은 출발 1시간 전(09:00) 마감이므로 셔틀이 09:00 무렵 도착하는지 예약 때 STA에 확인하세요.","url":"","one":"","m":0,"q":"Royal on the Park, 152 Alice St, Brisbane City QLD 4000"},{"id":"s4","k":"홀트 스트리트 워프 (탕갈루마 페리 터미널)","n":"Holt Street Wharf (Tangalooma Ferry Terminal)","kind":"pier","lat":-27.43952,"lng":153.10814,"adr":"220 Holt St, Pinkenba QLD 4008","a":"09:00","l":"10:00","ea":29921700,"el":29921760,"tz":600,"hrs":"일요일 포함 매일 운항. 브리즈번 출발 07:30, 10:00, 12:30, 17:30 / 탕갈루마 출발 09:30, 14:30, 16:00, 19:00. 체크인은 출발 최소 1시간 전","cost":179,"bk":"Snorkel the Wrecks Day Cruise Classic(10:00 브리즈번 출발, 16:00 탕갈루마 출발) 예약 필수. 성인 A$179(연료할증 A$10 포함, 2027-01-31까지 가격). 포함 내용은 왕복 페리, 가이드 스노클 투어, 장비 일체, 리조트 이용권, 점심 바우처 A$25. 출발 48시간 이내 변경·환불 불가. https://www.tangalooma.com/snorkel-the-wrecks-day-cruise","wt":"체크인 데스크에서 예약 확인과 신용카드 확인을 하고 탑승권을 받습니다. 10:00 카타마란에 탑승합니다. 이동 중 차, 커피, 소프트드링크 중 1잔이 무료입니다. 승선 전에 멀미약을 먹으세요. 이 부두에는 대중교통 버스와 기차가 없습니다.","bu":"10:00 배가 만석이면 07:30 배(체크인 06:30)를 문의합니다. 이 경우 STA 셔틀이 없어 택시나 Uber로 이동해야 합니다.","url":"https://www.tangalooma.com/location-transport/moreton-island-resort-ferry-schedule","one":"","m":0,"q":"Holt Street Wharf, 220 Holt St, Pinkenba QLD 4008"},{"id":"s5","k":"탕갈루마 선착장 도착","n":"Tangalooma Wharf (jetty)","kind":"pier","lat":-27.18106,"lng":153.37147,"adr":"Tangalooma Island Resort, Moreton Island QLD 4025","a":"11:15","l":"11:25","ea":29921835,"el":29921845,"tz":600,"hrs":"리조트 리셉션 일요일 08:00-17:00","cost":null,"bk":"스노클 투어는 일일투어 패키지에 포함. 도착 후 TangaTours에서 시간만 확정","wt":"선착장에 내려 리조트 센터 쪽으로 걸어갑니다. 먼저 TangaTours 데스크(Fire \u0026 Stone 옆, 매일 08:30-17:00, 전화 07 3410 6927)에서 오늘 스노클 시간(10월 가이드 기준 13:00)을 확인하고 이름을 등록합니다. 시간은 바뀔 수 있습니다.","bu":"스노클 시간이 오전 9:30(이미 지남)뿐이라면 13:00 이후 대체 시간을 문의합니다.","url":"","one":"","m":0,"q":"Tangalooma Wharf, Tangalooma Island Resort, Moreton Island QLD 4025"},{"id":"s6","k":"비치 카페 (리조트 점심)","n":"Beach Cafe, Tangalooma Island Resort","kind":"restaurant","lat":-27.18,"lng":153.3722,"adr":"Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025","a":"11:30","l":"12:30","ea":29921850,"el":29921910,"tz":600,"hrs":"매일 11:30-15:30 / 17:00-21:00 (10월 What's On 가이드 기준)","cost":5,"bk":"불필요","wt":"버거, 피자, 파스타, 샐러드를 파는 곳입니다. 패키지에 포함된 점심 바우처(성인 A$25)를 사용합니다. 거스름돈은 주지 않으므로 바우처 금액에 맞춰 주문하고 부족분은 카드로 냅니다. 스노클 전이므로 너무 많이 먹지 않습니다. 좌표는 리조트 센터 부근의 추정값(OSM에 등재 없음)이라 정확도가 낮습니다.","bu":"Fire \u0026 Stone Restaurant (아시안 요리, 11:30-14:30)나 The Coffee Lounge (가벼운 식사, 07:00-21:00)에서도 같은 바우처를 쓸 수 있습니다.","url":"https://www.tangalooma.com/location-transport/moreton-island-resort-ferry-schedule","one":"리조트 비치 카페에서 점심","m":1,"q":"Beach Cafe, Tangalooma Island Resort, Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025"},{"id":"s7","k":"탕가투어스 (난파선 스노클 집합)","n":"TangaTours (Snorkel the Wrecks check-in)","kind":"activity","lat":-27.1798,"lng":153.3721,"adr":"Beside Fire \u0026 Stone, Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025","a":"12:40","l":"13:15","ea":29921920,"el":29921955,"tz":600,"hrs":"TangaTours 08:30-17:00. 스노클 투어 13:00 출발(10월 가이드 기준, 11월은 확인 필요)","cost":null,"bk":"일일투어에 포함. 단독 구매 시 성인 A$69(공식 활동 페이지의 2026-03-31까지 가격이라 변동 가능, VIP 1시간45분 A$149는 13세 이상)","wt":"체크인은 투어 시작 15분 전(12:45)이므로 12:40까지 집합해 웻슈트, 마스크, 핀, 스노클, 구명조끼, 풀 누들을 받고 안전 교육을 듣습니다. 투어 전체는 90분(안전 교육과 해변에서 난파선까지 보트 이동 포함)이고 그중 물에 들어가는 시간은 약 30~35분입니다. 만 6세 이상이라 성인 3명은 문제가 없습니다. 수영에 자신이 없으면 풀 누들과 구명조끼를 꼭 쓰세요. 난파선 해역은 조류가 강하므로 개인적으로 헤엄쳐 가지 말고 공식 투어로만 갑니다. 초보자는 Intro to Snorkel(A$35, 30분, 공식 페이지상 09:15와 12:30, 최소 2명)을 추가할 수 있지만 12:30이면 점심과 겹치므로 점심을 앞당겨야 합니다(시간은 현장 확인).","bu":"파도나 바람 때문에 취소되면 데저트 사파리 + 샌드 토보건(13:15 출발 예상, A$57, 90분)이 가능한지 Tours Desk(일요일 08:00-16:00, 전화 07 3410 6920)에 문의합니다. 그것도 안 되면 비치와 수영장에서 쉬고, 리조트에 환불 여부를 문의합니다.","url":"https://www.tangalooma.com/activities-tours/snorkel-shipwrecks","one":"집합 후 장비 받고 안전 교육","m":1,"q":"TangaTours, Beside Fire \u0026 Stone, Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025"},{"id":"s8","k":"탕갈루마 난파선 (스노클링 지점)","n":"Tangalooma Wrecks","kind":"sight","lat":-27.16304,"lng":153.36826,"adr":"Tangalooma Wrecks, Moreton Island QLD 4025 (선착장에서 북쪽 약 2km, 보트로 이동)","a":"13:25","l":"14:05","ea":29921965,"el":29922005,"tz":600,"hrs":"가이드 투어로만 입장. 물속 약 30~35분","cost":null,"bk":"투어에 포함","wt":"1960년대에 침몰시킨 15척의 선박 주변에서 물고기 200여 종, 거북이, 가오리, 워비공 상어를 구경합니다. 방수 카메라가 있으면 좋습니다. 가이드 지시를 따르고 난파선 철판에 닿지 않도록 합니다.","bu":"시야가 나쁘거나 취소되면 Marine Discovery Cruise(A$69, 약 1.5시간)는 10월 가이드상 12:30 출발이라 이미 지났을 가능성이 큽니다. TangaTours에서 대체 가능한 투어를 문의합니다.","url":"","one":"난파선 사이에서 스노클링","m":1,"q":"Tangalooma Wrecks, Tangalooma Wrecks, Moreton Island QLD 4025"},{"id":"s9","k":"탕갈루마 해변과 리조트 수영장 (휴식)","n":"Tangalooma beach and resort pool","kind":"sight","lat":-27.179,"lng":153.3724,"adr":"Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025","a":"14:30","l":"15:20","ea":29922030,"el":29922080,"tz":600,"hrs":"수영장 07:00-22:00. 매점(Resort Shop) 일요일 08:00-17:00","cost":null,"bk":"불필요(투어 포함 리조트 이용권)","wt":"샤워와 옷 갈아입기를 먼저 합니다. 이후 수영장이나 해변에서 쉬고, Resort Shop이나 Coffee Lounge에서 아이스크림과 음료를 삽니다. 선착장 근처 수영은 배가 드나들어 금지입니다. 타올은 리셉션에서 보증금을 내고 빌릴 수 있습니다. 무료 프로그램인 Eco Centre(13:00-16:00)와 펠리컨 먹이주기도 볼 수 있습니다. 승선권은 출발 30분 전(15:30)까지 티켓 헛에서 받아야 하므로 15:20에는 정리를 시작합니다.","bu":"비가 오면 Eco Centre(Deep Blue 1 아래)와 Resort Shop 구경, Coffee Lounge에서 휴식합니다.","url":"","one":"샤워하고 옷 갈아입고 휴식","m":1,"q":"Tangalooma beach and resort pool, Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025"},{"id":"s10","k":"탕갈루마 선착장 (복귀 승선)","n":"Tangalooma Wharf (departure)","kind":"pier","lat":-27.1810 ,"board":"","alight":"","dep":"19:45","arr":"19:57","dur":12,"cost":null,"notes":"Elizabeth St에서 George St 호텔까지 약 850~900m","de":29922345,"ae":29922357}],"bookings":[{"t":"Tangalooma Snorkel the Wrecks Day Cruise Classic 3명 (10:00 출발, 16:00 복귀): 성인 A$179 x 3, 필수 예약, 출발 48시간 이내 변경·환불 불가. https://www.tangalooma.com/snorkel-the-wrecks-day-cruise 또는 1300 652 250","act":1},{"t":"STA 시내 셔틀 왕복 3명 (Royal on the Park 08:35 픽업, Holt St 17:30 출발): 1인 A$25 x 2, 선불 필수, 일일투어 예약과 함께 추가. 1300 652 250 또는 STA 1300 782 118","act":1},{"t":"Corbett \u0026 Claude 18:45 저녁 3명 (권장): (07) 3130 6436 또는 https://corbettandclaude.com.au/book/","act":1},{"t":"선택: Desert Safari Tour + Sand Tobogganing (성인 A$57) 또는 07:30 배 변경은 예약 때 문의","act":1},{"t":"출발 24시간 전(11/21)까지 탕갈루마에 예약 재확인 필요","act":1}],"tips":["[예약 마감 순서] 1) 탕갈루마 Snorkel the Wrecks Day Cruise Classic(10:00 출발, 성인 A$179 x 3 = A$537)을 먼저 예약합니다. 2) 같은 예약에 STA 시내 셔틀(왕복 1인 A$50)을 추가합니다. 출발 48시간 이내에는 변경과 환불이 불가하므로(11/20 오전 10시 이후) 일정과 날씨를 확인하고 11/20 아침 전에 확정하세요. 대표번호 1300 652 250(국내), 해외 +61 7 3637 2000, 한국어 사이트가 있습니다.","[샌드 토보건을 같이 하고 싶다면 대안] 07:30 배(체크인 06:30)를 타면 도착 08:45, 스노클 09:30(체크인 09:15), 점심 11:15, 데저트 사파리 + 샌드 토보건 13:15(성인 A$57, 90분), 16:00 배로 복귀가 가능합니다. 단, 07:30 배에는 셔틀이 없어서 06:00경 호텔에서 Uber/택시(추정 A$35~50)를 타야 하고, 대중교통은 이 시간에 부두까지 가지 않습니다. 추가 비용은 약 A$57 + 택시비 분담입니다. 활동 시간은 10월 가이드 기준이라 11월에는 달라질 수 있으니 예약 때 확인하세요.","[대안] 10:00 배에서 스노클링 대신 토보건만 하고 싶으면 일일투어 Desert Safari Day Cruise Classic(성인 A$165, 2027-01-31까지 가격)을 선택합니다. 13:15경 출발하는 투어에 탑승합니다. 스노클링과 토보건은 같은 시간대(13:00~13:15)라서 한 배편으로 둘 다 할 수 없습니다.","[교통] 홀트 스트리트 워프에는 대중교통 버스와 기차가 없습니다(탕갈루마 공식 안내). 아침과 저녁 STA 셔틀이 유일한 대중교통형 수단입니다. 그레이트 서던 호텔은 공식 픽업 지점이 아니므로 Royal on the Park(152 Alice St)까지 걸어서 약 8~10분 갑니다. 08:25까지 도착하세요. 셔틀은 가방 1개(56x36x23cm 이하)만 가능하고 음식과 음료는 금지입니다.","[신뢰도 주의] 셔틀 시간과 페리 시간은 공식 페이지에서 확인했습니다. 도착 예상 시간(09:00, 18:30)은 추정이고, 스노클 시간(13:00)은 10월 가이드 기준이라 확정이 아닙니다. 11/22 주간 What's On 가이드는 출발 직전에 나오므로 도착 직후 TangaTours에서 꼭 확인하세요. STA 예약 페이지(Rezdy)는 Cloudflare 때문에 직접 확인하지 못했습니다.","[준비물] 예약에 쓴 신용카드(승선 때 예약자 카드 일치 확인), 수영복, 타올, 선크림, 모자, 선글라스, 방수 카메라, 멀미약, 물. 리조트 투숙객이 아닌 일일 손님은 수영장과 식당 이용권이 패키지에 포함됩니다.","[비용] 1인 약 A$298. 구성은 크루즈 패키지 A$179, 셔틀 왕복 A$50, 아침 약 A$29(에그 베네딕트 A$24 + 커피), 점심 추가 A$5(바우처 A$25 사용), 저녁 A$35입니다. 3명이면 약 A$894입니다. 선택 사항인 데저트 사파리는 별도 A$57입니다.","[안전] 난파선 주변 조류가 강해 공식 가이드 투어로만 스노클링하세요. 선착장 근처에서는 수영 금지입니다. 이 일정은 16:00 배로 돌아오므로 돌고래 밤 먹이주기를 보지 않습니다. 보려면 늦은 배(11월 15일 이후 약 19:30~20:30 출발)를 타야 하고 도착이 21시 전후가 되며, 심야 STA 셔틀 시간(20:15)과 맞지 않을 수 있어 추천하지 않습니다.","[승선 시간] 탕갈루마에서 돌아오는 16:00 배는 티켓 헛에서 출발 30분 전(15:30)까지 승선권을 받아야 합니다.","[비자와 항공권] 이 날 일정과 직접 관련은 없습니다. 11/24 BNE 11:05 출발 비행기를 위해 11/23 밤에 짐을 싸 두세요."],"rain":"가벼운 비는 크루즈와 스노클링이 그대로 진행되는 경우가 많습니다(수영복을 입으니 상관 없음). 이 경우 갈아입을 옷과 우비를 챙기고, 비 오는 동안은 Beach Cafe나 Coffee Lounge, Eco Centre(13:00-16:00)에서 쉽니다. 강풍, 높은 파도, 뇌우로 탕갈루마가 크루즈를 취소하면 11/21 저녁이나 11/22 아침에 연락이 오며 환불 규정은 예약 때 확인하세요(출발 48시간 이내 고객 변경은 불가하지만 리조트 측 취소의 환불 조건은 공식 확인이 필요합니다). 그날 대체 일정은 오전 Museum of Brisbane(브리즈번 시청 3층, King George Square, 일요일 10:00-17:00, 무료, 호텔에서 걸어서 약 10분)을 보고 점심은 Jimmy's on the Mall에서 합니다. 오후에는 Queensland Museum Kurilpa(South Bank, 일요일 09:30-17:00, 일반 입장 무료)를 보고 저녁은 같은 Corbett \u0026 Claude에서 먹습니다.","tzchg":0},{"date":"2026-11-23","key":"1123","wd":"월","ck":"bne","city":"Brisbane","short":"브리즈번 하루","sub":"마운트쿠타 전망대 · 식물원, 시내 쇼핑, 캥거루 포인트 절벽 일몰","sun":"일출 04:46 · 일몰 18:23","cost":130,"hotel":"그레이트 서던 호텔 브리즈번","hotel_city":"브리즈번","summary":"오전: 471번 버스(08:49 킹조지스퀘어 정류장 통과, 월요일 평일 시간표를 TransLink GTFS로 재확인)로 마운트쿠타 정상 전망대(09:19~10:10) -\u003e 보타닉 가든스 마운트쿠타(10:15~12:15) -\u003e 12:15 버스로 시내 복귀. 오후: Maru 한식 점심 -\u003e 퀸스트리트 몰 쇼핑(상점은 월요일 대체로 17:00 마감) -\u003e 시티 보타닉 가든 -\u003e 캥거루 포인트 그린 브리지(약 460m)로 강 건너 절벽 공원. 저녁: 절벽 위 Joey's에서 일몰(18:23) 감상 후 다리를 걸어 호텔 복귀, 내일(11/24 BNE 11:05 출발) 짐 싸기와 온라인 체크인. 전 구간 대중교통+도보, 대중교통은 회당 A$0.50 균일요금(TransLink 공식 페이지 확인).","weather":"브리즈번(AEST, UTC+10, 서머타임 없음). 11월 일반적으로 최저 약 20도/최고 약 29도, 오후 소나기·뇌우 가능, 자외선 매우 강함(일반 기후 정보이며 당일 예보 확인 필요, 날씨 출처 미검증).","stops":[{"id":"s1","k":"그레이트 서던 호텔 브리즈 인.","오전 일정을 3시간 이상 정상·식물원에 쓰는 대신 버스가 시간당 1대 수준이니, 각 버스 시간(08:49, 10:10, 12:15)을 일정의 기준점으로 삼는다. 471번 중 행선지가 Stuartholme College인 차는 정상에 가지 않는다.","요금: TransLink는 버스·기차·페리 회당 균일 A$0.50(공식 페이지 확인, 종료일은 공식 페이지에 명시 없음). go card, 컨택트리스 Visa/Mastercard 가능, American Express는 안내에 없음. 승하차 모두 터치하고 터치오프를 안 하면 기본요금 A$2.50이 부과될 수 있음(120일 이내 조정 요청 가능). 카드 1장은 1명분만 결제하므로 3명이 각자 카드/기기를 사용.","정상·식물원 모두 그늘이 적고 11월 자외선이 강하다. 선크림, 모자, 물 필수. 식물원에서는 야생동물에게 음식을 주지 말 것. The Summit 레스토랑은 11:00 개점이라 오전에는 카페(워크인)만 이용 가능.","퀸 스트리트 몰 매장은 월요일 대체로 17:00 마감. 쇼핑은 15:25까지로 계획되어 있음.","일몰 18:23, 일몰 후 약 25분이 가장 예쁜 시간대(시민박명 18:48). Joey's 테이블에서도 시내 쪽 전망이 보이지만 절벽 가장자리에서 보면 더 좋다.","Joey's는 월요일이라도 예약 권장. 일몰 시간대 좌석은 먼저 마감될 수 있다.","저녁 귀가 시 다리는 야간에도 이용 가능하나 조명 여부는 공식 페이지에 없으니 주변이 어두울 수 있음. 일행과 함께 이동하고 21:00 이후는 피하기.","저녁 숙소 복귀 후: 내일 BNE 11:05 출발이므로 국제선은 보통 출발 3시간 전 도착(약 08:00). 호텔 체크아웃 10:00보다 일찍 출발하게 되니 짐은 오늘 밤 정리. 온라인 체크인은 항공사별 시작 시점을 앱에서 확인."],"rain":"오전(비/구름): 정상 전망대는 20~25분만 보고 카페 실내에서 휴식 후 10:10 버스. 식물원은 열대 돔·방문자센터·가든 카페 실내 위주로 보고 11:15 버스(시내 11:41)로 일찍 복귀. 아예 비가 심하면 10:10 버스를 그대로 타고 시내(Adelaide St 10:41)로 돌아와 시청 3층 Museum of Brisbane(월 10:00~17:00, 무료)을 본 뒤 12:40경 Maru 점심. 오후: 퀸 스트리트 몰 아케이드/쇼핑센터 실내 쇼핑 연장, 시티 보타닉 가든은 취소하고 Museum of Brisbane으로 대체. 저녁: 폭우·뇌우면 다리 도보와 절벽 일몰은 취소하고 시내 Maru Grill House(월 17:00~22:00)에서 저녁, 호텔 복귀. 소나기가 짧게 지나갈 때는 다리의 그늘 덮개 구간과 Joey's에서 대기 후 이동(예약 변경 가능 여부 전화 확인).","tzchg":0},{"date":"2026-11-24","key":"1124","wd":"화","ck":"bne","city":"Brisbane","short":"귀국일","sub":"이른 아침 + Airtrain + 공항 수속 · TRS, 11:05 JQ53 인천행","sun":"일출 04:45 · 일몰 18:23","cost":63,"hotel":"그레이트 서던 호텔 브리즈번","hotel_city":"브리즈번","summary":"11:05 BNE 출발 인천행 귀국일. 06:05 호텔 체크아웃 후 가까운 카페 Frankie \u0026 George에서 이른 아침을 먹고, Central역에서 07:15경 Airtrain을 타 07:38경 국제선역 도착(출발 약 3시간 25분 전). 체크인 -\u003e 보안/출국심사 -\u003e Level 3 TRS 데스크(탑승 90분 전인 09:35 이전 도착) -\u003e 면세점 -\u003e 게이트 순서입니다. 하루 1인 예상 비용 약 A$63(Airtrain 정상요금 기준, 그룹요금 적용 시 약 A$57).","weather":"11월 하순 브리즈번은 초여름. 아침 기온 약 20도, 낮 약 29도, 오후 소나기 가능. 일정은 대부분 실내.","stops":[
