로 앞(육교/통로 연결, 약 70m). 엘리베이터로 출발층 이동.","de":29924500,"ae":29924505},{"i":5,"j":6,"mode":"flight","line":"젯스타 JQ53","board":"BNE","alight":"ICN T1","dep":"11:05","arr":"19:55","dur":590,"cost":null,"notes":"비행 약 9시간 50분.","de":29924705,"ae":29925295}],"bookings":[{"t":"Airtrain e-티켓 사전 구매(선택, $17 그룹요금 현행 여부 확인) https://www.airtrain.com.au","act":1},{"t":"TRS 앱/웹 사전 청구(선택) - ABF Tourist Refund Scheme","act":1},{"t":"항공사 온라인 체크인(가능 시)","act":1}],"tips":["공항 도착 권장 시각은 출발 약 3시간 전(08:05 이전). 이 일정은 07:45에 터미널 도착(3시간 20분 전)이라 TRS와 수속에 여유가 충분함.","Airtrain 공식 사이트에서 07시대 정확한 출발 분은 확인하지 못했습니다. 확인된 것은 평일 첫차 04:31(Central), 막차 21:31, 피크 15분/비피크 30분 간격, 소요 약 20분뿐입니다. 전날 Airtrain/TransLink 앱에서 확인하세요.","Airtrain 요금: 정상 A$23.30(TransLink, 2026-04-27 시행 확인). 온라인 $17 그룹요금은 안내 기준일이 2025-02라 현행 여부 확인 필요(성인 2인 이상 구매·전 구간 동행 조건). 14세 이하는 무료.","TRS 대상: 같은 매장 GST 포함 A$300 이상, 출국 60일 이내 구입, 원본 세금계산서와 물품 지참. 주류는 와인 일부만 가능(22% 미만 등, 공식 페이지 미확인), 담배 제외. 데스크 운영 시간은 공지되지 않으며 항공편에 맞춰 운영됨.","체크인 수하물에 TRS 물품을 넣었다면 체크인 전에 Level 1 ABF 사무실에서 먼저 확인받아야 합니다.","11/24 출발 시각은 퀸즈랜드 시간(AEST, UTC+10)입니다. 서머타임(UTC+11)이 적용되는 시드니보다 시계가 1시간 빠르지 않고 1시간 이릅니다(시드니가 1시간 앞섬). 시드니 시간 기준으로 착각하지 마세요.","Frankie \u0026 George 주소가 325 vs 366 George St로 목록마다 달라 영업시간·위치를 전날 구글맵으로 재확인하고, 닫혀 있으면 근처 Coffee Iconic(340 George St)으로 이동하세요.","호텔 아침 식사 대신 이른 시간에 먹는 계획이므로, 부족하면 공항에서 간단히 보충하세요."],"rain":"비가 오면 호텔에서 카페까지(8분) 우산 사용 또는 우버/택시로 Central역까지 직행(약 A$8~12, 5분). Central역 승강장과 공항은 실내라 영향이 적습니다. 카페를 건너뛰고 공항에서 아침을 먹는 대안도 가능합니다.","tzchg":0}],"hotels":[{"city":"시드니","name":"YEHS Hotel Sydney QVB","name_ko":"예스 호텔 시드니 QVB","from":"2026-11-16","to":"2026-11-19","checkin":"15:00","checkout":"10:00","address":"143 York St, Sydney NSW 2000","lat":-33.872424,"lng":151.206266,"room":"Premium Family Room (킹 1 + 싱글 1, 방 2개)","station":"Town Hall역 도보 2분","link":"https://www.trip.com/w/68zLavWCpW2","tz":"Australia/Sydney"},{"city":"골드코스트","name":"Mantra on View Hotel","name_ko":"만트라 온 뷰 호텔","from":"2026-11-19","to":"2026-11-21","checkin":"14:00","checkout":"10:00","address":"22 View Ave, Surfers Paradise QLD 4217","lat":-27.99782,"lng":153.4292,"room":"City View Twin (더블 2개)","station":"G:link Cypress Avenue 도보 2분","link":"https://www.trip.com/w/tZod2gqCpW2","tz":"Australia/Brisbane","note":"SK패밀리 1+1을 쓰면 하나투어 재예약 시 2박 실결제 약 21.9만원 (다른 사이트 약 38.3만원). 대안 디 아일랜드 골드코스트 약 36.9만원."},{"city":"브리즈번","name":"Great Southern Hotel Brisbane","name_ko":"그레이트 서던 호텔 브리즈번","from":"2026-11-21","to":"2026-11-24","checkin":"14:00","checkout":"10:00","address":"103 George St, Brisbane City QLD 4000","lat":-27.47284,"lng":153.02539,"room":"Family Room (최대 4명)","station":"Central역 도보 약 15분, 버스 정류장 1분","link":"https://www.trip.com/w/xJffLz1EpW2","tz":"Australia/Brisbane"}],"benefit":{"title":"SK패밀리 해외호텔 1+1","recommend":"골드코스트 2박(11/19~21)에 사용. 정확히 2박이라 '2박 연박 시 1박 무료' 조건에 맞음. 3박 예약에도 되는지는 미확인.","rules":["무료 1박은 1박 요금 중 미화 300달러까지만 차감. 결제는 달러, 결제일 하나은행 현찰 살 때 환율.","체크인 2주 전까지 예약 → 골드코스트는 11/5(목)까지. skf.hanatour.com에서 예약 후 1599-1144(ARS 2번, 평일 09~18시)로 전화해야 할인 적용.","결제일 기준 전월 카드 실적 20만원 이상(대형마트·주유소·자동이체 제외).","예약자와 대표 투숙객 모두 카드 소유자 본인 이름이어야 함. 카드 주인이 3명 중 한 명으로 직접 체크인해야 하고, 이름이 다르면 현지에서 투숙이 거절될 수 있음.","객실 1개, 연 1회. 이월 불가."],"card_name_answer":"네, 같아야 합니다. 혜택 안내 원문: '예약자 / 대표투숙객 모두 카드소유주 본인이름으로 입력해주셔야 합니다', '회원 고객님 본인이름의 체크인 객실만 무료서비스 가능합니다', '예약회원과 투숙회원이 상이할 경우 현지 호텔에서 투숙이 거절될 수 있습니다'."},"maps":{"mymaps_embed":"https://www.google.com/maps/d/embed?mid=1m5eYq4DCxGXuk0AhnnX1-uMjYCm5WwA\u0026ehbc=2E312F","mymaps_view":"https://www.google.com/maps/d/viewer?mid=1m5eYq4DCxGXuk0AhnnX1-uMjYCm5WwA","lists":[{"name":"시드니","count":22,"url":"https://maps.app.goo.gl/32ofEdFWpE5dQUHx7"},{"name":"골드코스트","count":11,"url":"https://maps.app.goo.gl/sgaJt6vqEENoo5CV8"},{"name":"브리즈번","count":21,"url":"https://maps.app.goo.gl/skP2EAwmWWBBF2zp8"}],"why_no_api":"구글 지도 API는 결제 카드가 등록된 키가 필요하고, 공개 페이지에 키를 넣으면 남이 요금을 발생시킬 수 있어 쓰지 않음. 대신 키가 필요 없는 구글 내 지도와 저장 목록을 사용."},"emergency":[{"label":"호주 긴급(경찰·구급·소방)","value":"000","note":"어떤 긴급 상황이든 가장 먼저 걸어요."},{"label":"주시드니 대한민국 총영사관","value":"+61 2 9210 0200","note":"평일 09:00–17:00 (호주 시간). 업무시간 밖 긴급 연락처는 출발 전에 외교부 공식 안내에서 확인해 저장해 두세요."}],"inquiry":[{"label":"SK패밀리 여행센터 (호텔 1+1 예약 문의)","value":"1599-1144","note":"평일 09~18시 · ARS 2번. 긴급 전화가 아니에요. 1599 번호는 해외에서 안 걸릴 수 있어서, 예약 뒤 한국에서 미리 전화하세요. 해외에서 급하면 skf.hanatour.com 안내를 확인하세요."}],"transport":[{"city":"시드니","text":"컨택리스 카드로 탭(1인 1카드). 월~목 하루 상한 AUD 19.30, 금~일 AUD 9.65. 공항역 이용료 AUD 18.61 별도."},{"city":"골드코스트·브리즈번","text":"컨택리스 카드 또는 go card. 버스·기차·G:link·페리 1회 50센트. 공항 Airtrain은 별도 요금(약 AUD 23.30)."}],"baggage_fact":"가족 확인: 이번 여행 모든 항공편 위탁수하물은 1인 15kg으로 예약되어 있어요. 3명 모두 가방을 15kg 이하(여유 있게 13~14kg)로 싸세요.","baggage":{"per_flight":[{"flight":"TW501 T'way(현 트리니티항공) ICN 21:40 → SYD, 11/15","rule_15kg":"예약된 위탁수하물은 1인 15kg입니다(가족 확인). 무게를 넘기면 공항에서 추가 요금이 붙으니, 더 필요하면 출발 25시간 전까지 항공사 앱에서 미리 추가하는 편이 쌉니다. 기내 반입은 휴대가방 1개 + 개인 소지품 1개, 합계 10kg 이내입니다.","carry_on":"제3자(seatmaps.com) 기준: 일반석·스마트석·이벤트석 모두 기내 수하물 1개 + 개인물품 1개, 총 무게 10kg 이하. 공식 확인 필요.","excess_fee":"공식 가격 미확인. 공항 추가 요금과 사전 구매 가격 차이는 예약 후 앱/고객센터에서 확인 필요.","pooling":"미확인. 1인 기준으로 가정하고 예약 시 확인 권장."},{"flight":"JQ53 Jetstar 국제선 BNE 11:05 → ICN, 11/24","rule_15kg":"예약된 위탁수하물은 1인 15kg입니다(가족 확인). 쇼핑으로 늘어나면 공항보다 젯스타 예약관리(Manage booking)에서 미리 무게를 늘리는 편이 훨씬 쌉니다. 기내 반입은 2개 합계 7kg입니다.","carry_on":"미확인. 운임별 기내 수하물 허용량을 예약 화면에서 확인 필요.","excess_fee":"Jetstar 공항 초과 요금 원문(호주 사이트)은 접속 실패로 직접 확인 못함. 검색 결과 기준 Jetstar 베트남/스리랑카 페이지에 국제선 kg당 AUD 30(사전 구매 한도 초과분 또는 공항에서 구매한 첫 15kg 초과분). 제3자 자료는 kg당 AUD 50, 15kg 공항 구매 AUD 70 또는 AUD 175로 서로 달라 불확실. Jetstar는 공항 요금이 사전 구매보다 비싸다고 명시(검색 요약). 사전 구매 권장.","pooling":"미확인. 사전 구매는 인원별로 하는 방식으로 보이나 확인 필요."},{"flight":"SYD → OOL(Gold Coast) 국내선, 11/19 (예약 전 후보 비교)","rule_15kg":"Jetstar JQ410: 15kg 옵션 있음. 검색 요약 기준 공항 구매 첫 15kg AUD 55, 사전 구매는 더 저렴. 제3자 Cabinzero는 AUD 45로 적고 있어 구버전일 가능성. 15kg 사전 구매 가능.\nQantas QF594: 15kg 옵션 없음. 공식 Qantas 페이지(확인 완료) 기준 국내선 이코노미는 1개 최대 23kg 포함, 인당 1개로 보임. 가족 기준으로는 Qantas가 무게 면에서 유리.\nVirgin VA525: 15kg 옵션 확인 안 됨. Lite 운임은 위탁 수하물 0개, Choice는 기본 1개 23kg(검색 요약, 공식 페이지 직접 확인 못함). 노선 운항 여부도 미확인.","carry_on":"Jetstar: 미확인. Qantas: 미확인. Virgin 이코노미(검색 요약): 8kg 1개 + 개인물품 1개, 또는 14kg 이내 2개(개별 8kg 이하).","excess_fee":"Jetstar 국내선: 공항에서 첫 15kg AUD 55, 초과 kg당 AUD 20(검색 요약, Jetstar 공식 페이지 인용). Qantas 국내선: 2024년 4월 기사 기준 공항 추가 1개 AUD 130, 온라인 사전 구매 AUD 65(오래된 자료라 최신 확인 필요). Virgin: 미확인.","pooling":"Jetstar: 인원별 구매로 보임(미확인). Qantas: 인당 23kg 1개로 보임. Virgin: 미확인."}],"packing_tips_ko":["확인 한계: T'way(트리니티항공) 공식 수하물 페이지와 Jetstar 호주 공식 페이지는 접속 실패 또는 404/403이라 직접 확인하지 못했고, 아래 수치 일부는 제3자 자료 또는 검색 요약입니다. 예약 전에 각 항공사 공식 사이트에서 운임명과 허용량을 다시 확인하세요.","짐 무게 기준을 15kg가 아니라 13~14kg로 잡고 저울로 미리 재세요. 1~2kg 여유는 기념품용입니다.","15kg는 항공사마다 '인당' 기준이 다르므로 가족 3명 모두 같은 운임 종류로 예약하세요. 한 명이 Lite/Event 운임이면 그 사람 짐은 0kg일 수 있습니다.","국내선(SYD→OOL)을 Qantas로 잡으면 인당 23kg가 기본 포함이라 15kg 가정보다 여유가 큽니다. Jetstar로 가면 15kg를 미리 사는 편이 공항보다 저렴할 가능성이 큽니다(사전 구매 가격은 예약 화면 확인).","일정상 국제선 출발지가 브리즈번(BNE)이고 국내선 도착지가 골드코스트(OOL)이므로, 24일 아침 출발 전 OOL→BNE 이동 시간과 짐 운반 방법을 미리 계획하세요(이동 수단과 시간은 미확인).","기내 반입 가방에는 여권, 현금·카드, 약, 충전기, 보조배터리를 넣으세요. 보조배터리는 위탁 수하물 반입이 금지되어 있다는 Qantas 공식 안내가 있습니다.","호주 입국 시 음식, 씨앗, 식물·나무로 만든 기념품, 육가공품, 꿀 등은 반드시 신고하세요. 신고하지 않고 적발되면 벌금(infringement notice)이나 비자 취소 위험이 있습니다(벌금 금액은 자료마다 다르고 최신 확인 필요). 신고하면 공항 내 폐기함에서 처리할 수 있습니다.","호주 입국 전에 기내에서 남은 간식과 과일은 먹고 버리세요. 불확실하면 가져가지 않는 것이 안전합니다. 현행 조건은 BICON(bicon.agriculture.gov.au)에서 확인하세요.","등산화, 캠핑·하이킹 장비는 흙과 씨앗을 털어 깨끗하게 준비하세요(검역 검사 대상이 될 수 있음).","기념품은 귀국 시 한국 세관 규정도 별도로 확인하세요(주류·식품 등 제한 가능, 한도 미확인).","11월 시드니는 봄철이라 일교차가 있을 수 있어 얇은 겉옷 한 벌을 기내에서 입고 가면 무게를 줄일 수 있습니다(기후는 일반 정보로 공식 확인 아님).","3인 기준 10일이면 옷은 3일치 정도 빨래 전제로 준비하고, 압축 파우치로 각자 가방 무게를 균등하게 나누세요."],"sources":["https://www.qantas.com/au/en/travel-info/baggage/checked-baggage.html (직접 fetch, Qantas 국내선 23kg 및 보조배터리 안내)","https://www.trinityairways.com/ (직접 fetch, 트리니티항공 리다이렉트 확인; 수하물 페이지 미확인)","https://www.twayair.com/html/en/service/baggage.html (curl 404; 리다이렉트 확인)","https://www.trinityairways.com/app/main?langCode=en-US\u0026regionCode=GU (curl 403)","https://www.jetstar.com/au/en/help/is-checked-baggage-allowance-included-in-my-fare (검색 결과 URL; 직접 fetch 실패)","https://www.jetstar.com/au/en/help/excess-baggage-charges-at-the-airport (검색 요약 인용; 직접 fetch 실패, curl 연결 실패)","https://www.jetstar.com/vn/en/help/excess-baggage-charges-at-the-airport (검색 요약 인용, 국제선 kg당 AUD 30)","https://www.jetstar.com/sg/en/help/articles/excess-baggage-charges-at-the-airport (검색 결과 URL, 요약 참고)","https://cabinzero.com/collections/jetstar-baggage-allowance (제3자, 국내선 AUD 45, 구버전 가능성)","https://www.sendmybag.com/en-au/airlines/jetstar-baggage-allowance/ (제3자, 참고)","https://www.virginaustralia.com/ae/en/travel-info/baggage/checked-baggage/ (검색 요약 인용; 직접 fetch 타임아웃)","https://www.executivetraveller.com/qantas-hikes-excess-baggage-charges-on-domestic-flights (검색 결과, 2024 기사, 구버전 가능성)","https://www.webjet.com.au/flights/baggage-allowance/ (제3자, Virgin 기내 수하물 요약)","https://www.expedia.com/TWay-Air-Flights.cTW.Travel-Guide-Airlines (제3자, T'way Standard 15kg 요약)","https://kupi.com/en/explore/airlines/t-way-air (제3자, Event 운임 미포함 가능성)","https://seatmaps.com/ko/airlines/tw-trinity-airways/ (제3자, 기내 수하물 10kg 요약)","https://www.agriculture.gov.au/biosecurity/biosecurity-matters/international-travel (검색 요약 인용; 직접 fetch 연결 실패)","https://www.sbs.com.au/language/english/en/article/entering-australia-what-you-can-and-cannot-bring/o2p7rjgha (검색 결과, 보조 참고)"]},"flights":{"outbound":{"likely_flights":["TW501 트리니티항공(구 티웨이항공 T'way Air): ICN 21:40 → SYD 10:15(+1일), 2026-10-25부터 매일 운항, A330-300. 시각이 정확히 일치하므로 사실상 이 편으로 판단 (신뢰도 중상: 항공 스케줄 전문 매체 AeroRoutes 2026-08-03자 기사 기준이며 항공사 공식 시간표를 직접 확인하지는 못함. 예약확인서의 편명과 시각으로 최종 확인 필요)","참고(시각이 달라 해당 아님): 대한항공 KE401 ICN 08:00 → SYD 20:05, 아시아나 OZ601 ICN 20:00 → SYD 08:20(+1, A380)"],"aircraft_duration":"에어버스 A330-300. 비행시간 약 10시간 35분 (한국 21:40 = 시드니 23:40 AEDT 이므로 현지 10:15 도착). 11/15(일) 출발, 11/16(월) 도착.","terminal_icn":"인천공항 제1여객터미널(T1) 예상. 근거: 티웨이/트리니티 온라인체크인 안내에 T1 A카운터(프리미엄 체크인)가 명시되어 있고, 2026-01 아시아나가 T2로 이전하면서 T1은 LCC 중심으로 재편됨. 일반 카운터 위치는 당일 FIDS 전광판으로 확인. 체크인 마감은 국제선 출발 60분 전으로 추정(신뢰도 낮음, 예약확인서 확인) → 21:40 출발이므로 늦어도 18:40까지 공항 도착 권장. 온라인 체크인은 출발 24시간~1시간 전, 셀프백드롭(T1 3층)은 05:00~21:00 출발 1시간 전까지(신뢰도 중간).","terminal_syd":"시드니공항(Kingsford Smith) 국제선 터미널 T1. 입국심사 후 지하철 International Airport역에서 Opal 컨택리스 카드로 탑승 가능(공항역 접근요금 별도). 호텔 YEHS QVB 체크인은 15:00이므로 10:15 착륙 후 호텔에 짐 보관 요청 필요.","notes":"[수하물 중요] 티웨이/트리니티는 호주 노선 무료 위탁수하물이 '탑승일 2026-10-25부터' 변경됨 (한 조사에서 twayair.com 수하물 페이지를 읽고 확인했으나, 다른 확인에서는 같은 페이지가 열리지 않아 재확인 필요). 11/15 탑승분은 신규 기준 적용: 이벤트운임 15kg, 스마트/일반운임 23kg, 비즈니스 40kg (1인 기준, 동반 가족끼리 무게 합산 가능, 1개당 32kg 이하, 세 변의 합 203cm 이하). 기내반입은 이벤트/스마트/일반 운임 기준 휴대가방 1개 + 개인소지품 1개, 총 10kg 이내(휴대가방 세 변 합 115cm 이내). 3명이 이벤트운임이면 위탁이 1인 15kg뿐이므로 필요 시 출발 25시간 전까지 사전 추가구매(공항 현장보다 저렴). 어떤 운임인지 예약확인서에서 확인할 것. 호주는 식품(김치, 라면 속 건조육, 육포, 인삼제품 등) 검역이 엄격하므로 위탁·휴대 모두 주의. ETA는 출발 전 반드시 승인받아 둘 것(체크인 때 항공사가 확인)."},"inbound":{"likely_flights":["JQ53 젯스타(Jetstar Airways): BNE 약 11:05~11:10 → ICN 19:55, 보잉 787-8, 화/목/토 운항. 2026-03-31 이후 스케줄 기준 출발 11:10이고 비행시간 약 9시간 50분. 사용자가 알려준 11:05와 5분 차이가 있어 신뢰도 중간. 11/24는 화요일이라 운항요일과 일치. 예약확인서의 편명과 시각을 최우선으로 확인","참고(시각이 달라 해당 아님): 대한항공 KE408 BNE 08:40 → ICN 17:35~18:05, 주 4~5회"],"terminal_bne":"브리즈번공항 국제선 터미널(International Terminal). 국내선 터미널과 분리됨. 호텔(Great Southern Hotel, 103 George St)에서 Airtrain으로 약 20분. 07:45경 공항 도착(출발 약 3시간 20분 전)을 목표로 호텔은 06:05에 출발해 Central역 07:15 Airtrain을 타는 계획.","terminal_icn":"인천공항 제1여객터미널(T1) 도착 예상 (젯스타 JQ53 도착 터미널이 T1이라고 비행추적 사이트에 기재되어 있으나 공식 확인은 못함, 신뢰도 중간). 19:55 도착이라 입국 후 대중교통(공항철도·리무진) 막차 걱정은 거의 없음.","notes":"[수하물 중요] 젯스타 국제선 'Starter' 운임은 위탁수하물이 포함되지 않음(젯스타 공식 도움말). 기내반입은 2027-02-02 이전 출발편 기준 2개 합계 7kg. 위탁(첫 20kg)은 공항 현장 구매 시 국제선 약 AUD 170으로 매우 비싸므로 예약관리(Manage booking)에서 사전 구매 필수. 쇼핑/선물이 늘어날 가정이면 위탁 용량을 넉넉히 사전 구매할 것. 체크인 마감은 국제선 출발 60분 전 전후로 추정(공식 확인 못함, 신뢰도 낮음) → 3시간 전 도착 권장. 온라인 체크인 가능. 출국 시 TRS(세금환급) 창구를 이용하려면 추가 시간 필요. Airtrain은 퀸즐랜드 50센트 요금 대상이 아님."},"domestic_options":[{"airline":"젯스타 (Jetstar)","flight":"JQ410","dep":"13:20 SYD (AEDT)","arr":"13:40 OOL (AEST, 퀸즐랜드 현지시각 / 비행 1시간 20분)","terminal":"시드니 국내선 T2 → Gold Coast Airport(OOL)","fare_note":"가장 저렴한 후보. Starter 운임은 위탁수하물 불포함이라 3인 위탁가방 추가 필요. 대략 1인 AUD 70~150 + 위탁 AUD 35~70(온라인 사전구매) 수준으로 추정(신뢰도 낮음, 실제 요금은 Jetstar 사이트에서 확인). 3인 합계 약 AUD 320~660 추정","bag_note":"기내 2개 합계 7kg(Starter), 위탁은 별도 구매. 체크아웃 10:00 후 짐 보관하고 이동하기에 시간 여유 적당. 시각은 flightmapper 2026-10-04 이후 스케줄 기준(신뢰도 중간, 날짜별 변동 가능)"},{"airline":"콴타스 (Qantas)","flight":"QF594","dep":"13:40 SYD","arr":"14:05 OOL (현지)","terminal":"시드니 국내선 T3","fare_note":"위탁 포함 운임(Economy Red e-Deal 등 23kg) 선택 시 1인 AUD 170~300 정도 추정(신뢰도 낮음) → 3인 약 AUD 500~900. 호텔 체크인(14:00) 직후 도착","bag_note":"위탁 23kg 포함 운임이 많음(운임 종류별 확인). 매일 운항으로 표시되나 날짜별 확인 필요(신뢰도 중간)"},{"airline":"버진 오스트레일리아 (Virgin Australia)","flight":"VA525","dep":"13:50 SYD","arr":"14:10 OOL (현지)","terminal":"시드니 국내선 T2","fare_note":"Choice 운임은 위탁 23kg 포함이 일반적. 1인 AUD 150~260 추정(신뢰도 낮음). 젯스타에 위탁을 추가하면 비슷해지는 경우가 많음. 3인 약 AUD 450~780","bag_note":"10월 25일 이후 매일 13:50 출발로 flightmapper에 기재(신뢰도 중간). 같은 날 대안: VA509 08:20, VA511 09:20, VA515 10:20은 체크아웃 10:00에 비해 너무 이르거나 촉박해 비추천"},{"airline":"콴타스 (Qantas)","flight":"QF596","dep":"15:45 SYD","arr":"16:10 OOL (현지)","terminal":"시드니 국내선 T3","fare_note":"오후 늦게 이동하는 여유 옵션. 요금대는 QF594와 비슷하다고 추정(신뢰도 낮음)","bag_note":"10월 25일부터 운항으로 표시(신뢰도 중간). 시드니에서 점심·쇼핑 후 이동하고 싶을 때 적합. 호텔 체크인 14:00은 문제없고 저녁 일정은 짧아짐"},{"airline":"젯스타/버진 (저녁편 참고)","flight":"JQ416 17:35 / VA541 18:20","dep":"17:35 또는 18:20 SYD","arr":"17:55 또는 18:40 OOL (현지)","terminal":"시드니 T2","fare_note":"가장 저렴한 시간대가 많음. 단 시드니 반나절 일정이 늘고 골드코스트 첫날 저녁이 거의 없어짐","bag_note":"공항 이동은 Opal 컨택리스. 시드니 도심(Town Hall/Museum 등) → Domestic Airport역 약 15~20분, 역 접근요금 성인 AUD 18.61(주간 한도 37.75)이 운임과 별도로 부과됨. OOL → 서퍼스 파라다이스는 777번 버스 → Broadbeach South에서 G:link 환승(요금 50센트 정책 대상, 소요 약 40~60분, 신뢰도 중간)"}],"visa_eta":["1. 대상 여부: 한국(South Korea) 여권은 호주 ETA(전자여행허가, subclass 601) 대상 국적에 포함됨. 호주 내무부(Home Affairs) 공식 ETA 페이지(2026-10-12 갱신)에서 직접 확인함. 비자 스티커나 별도 서류는 없고 여권에 전자적으로 연결됨.","2. 신청 방법: 공식 'Australian ETA' 앱(App Store/Google Play, 무료 다운로드)만 사용. 3명 각자 신청해야 하며 호주 밖에서 신청해야 함. 여권 정보 페이지 촬영 + 여권 IC칩(NFC) 스캔 + 셀카 + 건강·범죄경력 질문에 영어 응답 + 카드 결제. 공식 외 사이트(대행업체)는 수수료가 더 붙으니 주의.","3. 수수료: 앱 사용 서비스 요금 AUD 20(1인), 그 외 비용 없음 (공식 페이지 확인). 3인 합계 AUD 60. 결제 후 환불되지 않는다는 제3자 설명이 있으나 공식 확인은 못함.","4. 처리 시간: 대부분 즉시 결과가 나옴. 질문 답변이 부정확하거나 추가 확인이 필요하면 더 걸릴 수 있음. '2~4시간, 최대 48시간' 같은 상업 사이트 설명과 '2026년 신규 건강 신고' 주장은 공식 페이지에서 확인되지 않음(신뢰도 낮음). 공식은 'ETA 승인 전에 확정 못 하는 여행 준비는 하지 말라'고만 안내. 오늘(10/22) 기준 출발 24일 전이므로 지금 바로 신청 권장.","5. 유효기간: 승인일부터 12개월 또는 여권 만료일 중 짧은 쪽. 복수 입국 가능, 1회 입국당 최대 3개월 체류. 11/15~11/24 일정 충분히 커버. 신청에 쓴 여권으로만 입국해야 하고 여권을 갱신하면 ETA는 무효가 되어 재신청 필요. 여권 잔여 유효기간 6개월 이상 확보 권장(항공사 기준).","6. 제외/주의: 어느 나라에서든 형사 유죄 기록(범죄경력)이 있으면 ETA 대신 방문비자(subclass 600) 신청 필요(공식). 근무·유학은 ETA로 불가(관광·가족방문·일부 사업 방문만).","7. 신청 후: 앱의 'Visa check' 또는 VEVO에서 상태 확인, 승인 화면 캡처 + 가능하면 PDF/메일 보관. 3명 모두 승인됐는지 출발 전날 다시 확인.","8. 2026년 변경: 이번 조사에서 한국 여권 대상 ETA 요금·절차의 2026 공식 변경은 확인되지 않음(AUD 20, 앱 전용)."],"arrival_entry":["입국카드: 2026-10 현재 호주 내무부 ETA 페이지(갱신 2026-10-12)와 ABF 입국 안내 모두 '호주에 도착하는 모든 승객은 Incoming Passenger Card(종이 입국카드)를 작성'하라고 안내. 디지털 'Australia Travel Declaration(ATD)'은 Qantas 앱 이용 + 일부 Qantas 편(시드니·브리즈번·멜버른 도착)에서 시범 운영 중이며 선택 사항, 서울발 트리니티 TW501에는 해당하지 않을 가능성이 큼 → 기내에서 종이 입국카드를 받아 영문 작성(여권번호, 체류주소 YEHS Hotel Sydney QVB 143 York St, 항공편명 TW501). 호주 정부는 2027년 말까지 모든 국제공항으로 ATD 확대 및 종이카드 단계적 폐지 예정.","SmartGate: ABF는 호주 도착 시 '여권 소지자, 만 7세 이상, 키 1.1m 초과'이면 SmartGate 이용 가능하다고 안내(전자여권 기준 자동 게이트, 얼굴인식). 한국 e-여권 성인 3명은 이용 대상일 가능성이 높으나 국적별 최신 허용 목록은 직접 확인 못함(신뢰도 중간). 게이트가 거부되면 유인 심사대로 이동하면 되며 입국카드는 어느 경우든 작성.","검역(식품): DAFF 기준 식품, 식물류, 동물 제품은 입국카드에 반드시 신고(또는 공항 검역 폐기함에 투입). 신고하면 반입 불가 품목이어도 처벌받지 않음. 고의 미신고·허위신고 시 과태료 최대 AUD 7,280(DAFF 현행 FAQ), 비자 취소·입국 거부·최대 3년 재입국 제한 가능. 한국 식품(김치, 라면 건더기 수프의 육류 성분, 육포, 인삼·한약재, 과일, 씨앗, 나무 제품) 반드시 신고. 모르면 신고가 원칙. 신발·캠핑·등산 장비의 흙·씨앗도 점검.","현금: 현금·여행자수표 합계 AUD 10,000(외화 환산 포함) 이상은 입국카드에 신고(AUSTRAC 일반 기준, 공식 페이지는 이번에 직접 열람 못함, 신뢰도 중간). 한국 출국 시에도 미화 10,000달러 초과 반출은 신고 필요(관세청).","여권·비자 확인: 여권 유효기간, ETA 승인 완료, 숙소 주소(첫날 YEHS Hotel Sydney QVB), 귀국 항공권(11/24 BNE→ICN) 캡처본을 준비. 체류 목적(관광)과 일정·소지금 질문에 대비."],"money_phone_insurance":["결제: 시드니와 브리즈번 모두 Visa/Mastercard 등 컨택리스 카드·애플페이/구글페이가 Opal/go card와 같은 요금으로 사용 가능(Transport for NSW 공식 안내). 3명 모두 각자 다른 카드·기기로 탭해야 한도가 개인별로 적용되므로 같은 카드를 돌려 쓰지 말 것. 해외결제 수수료·DCC(원화 결제) 거부 설정 확인 권장. 소액 현금은 거의 불필요(호주는 카드 사회).","시드니 요금 상한(Transport for NSW 공식, 성인): 월~목 하루 AUD 19.30, 금·토·일·공휴일 하루 AUD 9.65, 주간 AUD 50. 11/19(목)은 월~목 상한 적용, 11/20(금)부터 금요일 상한. 지하철/열차·버스·페리·경전철 모두 포함하되 시드니공항 역 접근요금은 이 상한에 포함되지 않음.","시드니공항 역 접근요금(2026-10 공식 페이지): 성인 AUD 18.61(Opal 카드·컨택리스 동일), 주간 한도 AUD 37.75(월~일 기준 Opal 주간). 공항역 승하차 때마다 열차 운임에 별도 부과. 11/16 입국 시와 11/19 국내선 이동 시 사용하면 같은 주(월~일)에 합산되어 한도 AUD 37.75 안에서 정산됨.","퀸즐랜드 50센트 요금: Translink 공식 페이지(2026-10 열람)에서 퀸즐랜드 전역 버스·열차(Airtrain 제외)·페리·트램(G:link 포함)을 1회 50센트 균일요금으로 안내 중. 단 Airtrain(브리즈번공항 연결선)은 제외. Airtrain 성인 편도는 도심-공항 AUD 23.30부터(Translink 안내, 2026-04-27 시행, 신뢰도 중간, 공식 airtrain.com.au에서 재확인). Airtrain은 컨택리스·go card 사용 가능. 14세 이하 어린이는 성인 동반 무료라는 안내가 있으나 이번 일행은 성인 3명이라 해당 없음.","eSIM/통신: 아이폰·갤럭시의 eSIM 지원 여부 먼저 확인. 출국 전에 Airalo(Optus망)·Ubigi·Nomad 등으로 설치 가능, 10일 20GB급 약 AUD 25~30 수준으로 추정(신뢰도 낮음, 실시간 가격 확인). 골드코스트·브리즈번 도심은 Optus/Telstra 모두 무난, 외곽·산악이면 Telstra망 계열이 안전. 로밍(SKT/KT/LGU+ 일일 로밍 패스)도 대안이며 가족 3명이 개별 구매하기보다 한 대 핫스팟 공유가 경제적일 수 있음.","콘센트: 호주 전압 230V/50Hz, 플러그 타입 I(납작한 V자 3핀 또는 2핀). 한국 220V 기기는 전압은 호환되나 한국식 C타입 플러그는 맞지 않아 호주용(타입 I) 어댑터 필요. 스마트폰·노트북 충전기는 대개 100-240V 겸용이라 어댑터만 챙기면 됨. 다리미·드라이어 등은 전압 확인.","여행자보험: 호주 공식 ETA 안내도 의료 보험 가입을 권고(한국과의 의료 상호협정 없음). 의료비·휴대품·항공 지연 담보 포함해 3명 모두 가입 권장. 외래 진료비가 매우 비싸므로 해외 의료비 한도 높게. 서핑·스카이다이빙·바다 액티비티 예정이면 약관의 면책 항목 확인.","교통카드 팁: 시드니는 Opal 카드 구입 없이 컨택리스로 충분, 브리즈번·골드코스트는 go card 또는 컨택리스(50센트 균일요금). 공항 위탁수하물과 국내선 이동 시 환승·시간 여유를 두고 계획."],"return_korea":["호주 TRS(세금환급제도, 공식 ABF 안내 2026-01-08 갱신): 동일 사업자(ABN)에서 구매 합계가 GST 포함 AUD 300 이상이어야 함(다른 매장 합산 불가, 같은 매장 여러 날 구매 합산 가능). 출국일 기준 60일 이내 호주에서 구매한 상품. 영문 종이 세금계산서 원본 필요(사진·사본 불가). AUD 1,000 이상 계산서는 여권과 동일한 구매자 이름이 있어야 함. 물건은 기내 휴대로 가져갈 준비(요청 시 제시), 전자 영수증은 공항 가기 전에 출력. 브리즈번(BNE)에 TRS 창구가 있음. 다른 사람의 물건을 대신 들고 청구하는 행위는 사기 위험이 있으니 절대 금지. 문의: 호주 내 1300 555 043, 해외에서 +61 2 6245 5499.","환급 절차 요령: 11/24 출발 3시간 전 도착 시 TRS 창구에 먼저 들러 청구(출국심사 전 위탁수하물 처리 순서와 위치는 BNE 안내 확인). 위탁수하물에 넣어야 하는 큰 물건은 TRS 확인을 먼저 받은 뒤 부치도록 시간 확보.","한국 면세범위(관세청 안내 페이지 직접 확인): 해외에서 취득한 물품 합계 미화 800달러 이하 면세(농축수산물은 품목당 5kg, 총 40kg, 해외취득가격 10만원 이내 포함). 별도로 주류 2L 이하이며 합계 미화 400달러 이하, 필터담배 200개비(전자담배 니코틴액 20ml), 향수 100ml. 만 19세 미만은 주류·담배 면세 없음. 한도 초과분은 자진신고 시 관세의 30% 경감, 미신고 적발 시 가산세(납부세액의 40%, 2년 내 2회 이상 60%).","귀국 검역: 동식물·과일·육류·가공식품은 동물·식물 검역 대상이므로 반입 전 신고 필요(호주산 쇠고기·육포류, 과일, 꿀, 씨앗 등 제한 가능). 선물용 호주 식품은 한국 반입 규정 확인 후 구매. 출국 시 호주 반출 불가 품목(야생동식물 제품 등)도 주의.","귀국 서류: 한국 입국 시 별도 입국카드는 한국 국민에겐 불필요. 면세 초과분이 있으면 입국장 '자진신고' 통로 이용, 휴대품 신고서 작성. 미화 10,000달러 초과 현금 반입도 신고."]},"facts":{"outbound":{"code":"TW501","airline":"트리니티항공(구 티웨이)","from":"ICN T1","dep":"21:40","to":"SYD T1","arr":"10:15 (+1일)","date":"11/15(일) → 11/16(월)","note":"18:40까지 인천공항 T1 도착"},"inbound":{"code":"JQ53","airline":"젯스타","from":"BNE 국제선","dep":"11:05","to":"ICN T1","arr":"19:55","date":"11/24(화)","note":"07:45경 국제선 터미널 도착 (출발 약 3시간 20분 전)"}},"lists":{"deadlines":[{"id":"pre-eta","due":"2026-10-25","title":"호주 ETA 신청 (3명 각자)","note":"Australian ETA 앱, 1인 A$20. 승인 화면을 캡처해 두세요."},{"id":"dl-yehs","due":"2026-10-29","title":"YEHS 호텔 무료 취소 기한","note":"시드니 3박 일정이 확정이면 그대로 두고, 바꿀 거면 이날까지."},{"id":"dl-bm","due":"2026-10-31","title":"블루마운틴 가이드 투어 예약","note":"먼저 카카오톡 gohojutour로 3명 출발 가능 여부 확인. 10% 쿠폰은 10/31까지."},{"id":"pre-domestic","due":"2026-10-31","title":"11/19 시드니 → 골드코스트 국내선 예약","note":"위탁수하물 포함 총액으로 비교. 체크아웃 10:00 이후 13~15시대 편."},{"id":"dl-hana","due":"2026-11-05","title":"하나투어 1+1 예약 + 1599-1144 전화","note":"골드코스트 2박. 예약만 하고 전화를 안 하면 할인이 적용되지 않아요."}],"prep":[{"id":"pre-eta","tag":"오늘~10/25","t":"3명 각자 공식 Australian ETA 앱 설치 후 ETA 신청(1인 AUD 20) → 승인 화면 캡처, 여권 유효기간 확인","full":"","note":0},{"id":"pre-fare-check","tag":"10/25 이전","t":"예약확인서에서 TW501(11/15)와 JQ53(11/24)의 운임 종류와 위탁수하물 문 근사치라 +-2분 오차 가능, AEDT(UTC+11)]\n- Katoomba: 일몰 19:41, 시민박명 종료 20:09, 항해박명 종료 20:42, 천문박명 종료(완전한 어둠) 21:18.\n- Blackheath: 일몰 19:41, 시민박명 종료 20:08, 항해박명 종료 20:42, 천문박명 종료 21:17.\n- 참고로 시드니 CBD는 일몰 19:38, 천문박명 종료 21:15 정도입니다.\n- 달: 11/17은 상현달 무렵(월령 약 7.5일, 조도 약 50%)으로 추정되며 자정 무렵에 집니다. 은하수는 달빛 때문에 다소 약해질 수 있습니다(근사 계산이라 불확실).\n\n[이동시간]\n- 블루마운틴(카툼바)에서 시드니 CBD까지는 약 100~102km이고, 차로 약 1시간 20~35분입니다(Rome2Rio 추정). 한인 투어(My Sydney)는 \"숙소 복귀 1시간 30분\"으로 안내합니다. 투어 차량이 숙소별로 내려주는 시간을 고려하면 90~100분으로 보는 편이 안전합니다.\n\n[왜 불가능한가]\n- 20:00에 시드니에 도착하려면 18:20 전후에 블루마운틴을 출발해야 합니다. 일몰(19:41)보다 약 80분 이른 시각입니다.\n- 별은 항해박명이 끝나는 20:42 이후부터 제대로 보이기 시작하고, 완전히 어두워지는 21:18 이후가 본격적인 관측 시간입니다. 21:00~22:00에 관측하고 출발하면 시드니 도착은 약 22:30~23:30입니다.\n- 실제 상품도 같은 결과입니다. 이번에 확인한 11월(서머타임) 일몰/별보기 상품은 12:00~14:30에 출발하고 22:00~23:30에 돌아옵니다. Autopia의 일몰 투어도 여름에는 12:00 출발, 22:30 복귀입니다(겨울에만 10:00 출발, 20:30 복귀).\n- 별보기를 빼고 일몰까지만 봐도 21:15 이전 복귀는 어렵습니다.\n- Scenic World는 공식 안내상 평일(화요일) 10:00~16:00 운영입니다. 다음을 모두 하려면 10~11시 출발이 맞고, 이 경우 복귀는 22시 이후가 됩니다. 일정은 낮의 Scenic World, 일몰의 Three Sisters, 밤의 별보기 순입니다.\n\n[현실적인 선택지]\n1) 10:00~10:30 출발 + 별보기까지 하면 복귀는 약 22:30~23:00입니다. 이 시각은 추정치입니다.\n2) 20시 전후 복귀를 지키려면 별보기와 일몰을 포기한 낮 투어가 됩니다. 이 경우 복귀는 약 17~18시입니다.\n\n(11월 정확한 출발/복귀 시각은 대부분 예약 후 바우처에서만 확정되므로 예약 직후 업체에 재확인이 필요합니다.)","recommendation":"추천: [고호주] 시드니 올인원 블루마운틴 \u0026 별보기 + 페더데일/시닉월드 (Waug 139468)입니다. 다만 이 상품은 복귀가 약 22:30 전후라서 20시 복귀 조건은 지키지 못합니다.\n\n이유는 다음과 같습니다.\n- 가족이 원한 조건 중 10:30 출발, 한국어 가이드, 소그룹, 세자매봉, 시닉월드, 별보기, 숙소 드랍을 이 상품이 가장 많이 충족합니다.\n- 집결지 Hyatt Regency Sydney(161 Sussex St)는 YEHS 호텔에서 도보 10분 남짓(추정)입니다.\n- 평일(화요일) 시닉월드는 16:00에 닫습니다(공식 안내). 이 상품은 오전 출발이라 시닉월드를 낮에 먼저 타고 일몰과 별보기로 이어가는 순서가 가능합니다.\n- 이전에 본 My Sydney 상품은 최소 4명이라 3명 가족에게는 취소 위험이 있거나 단독투어로 올려야 합니다.\n\n복귀 시간과 별보기 사이의 트레이드오프는 다음과 같습니다.\n- 별을 제대로 보려면 완전한 어둠이 오는 21:18 이후가 필요하고, 그 뒤 시드니까지 약 1시간 30분이 걸립니다. 따라서 복귀는 22:30~23:30입니다. 20시에 도착하려면 18:20쯤 블루마운틴을 떠나야 하는데, 이때는 일몰(19:41) 전이라 일몰도 별도 못 봅니다.\n- 선택은 둘 중 하나입니다. 낮 투어(세자매봉+시닉월드)를 17~18시에 마치거나, 별보기까지 하고 22시 후반에 복귀하는 것입니다.\n- 별보기는 구름에 좌우됩니다. 후기상 구름이 끼면 별 대신 시티 야경으로 바뀌고, 그러면 복귀가 더 늦어질 수 있습니다. 11/17에는 상현달(약 50%)이 떠 있어 은하수는 약해질 수 있습니다.\n\n대안은 다음과 같습니다.\n1) 별보기를 포기하고 20시 전후를 지키려면 GYG 낮 투어(Waug 159364)나 Autopia 겨울형 일정을 쓰면 됩니다. 단 Autopia는 11월이 서머타임 일정(12:00 출발, 22:30 복귀)이라 이 용도로는 맞지 않습니다.\n2) 별보기와 일몰만 원하면 지그재그(124942, 14:30 출발)나 놀러와시드니(123865, 14:00 출발)입니다. 오전에는 시내를 보고 오후에 합류하는 방식입니다. 시닉월드는 없습니다.\n3) 시닉월드까지 넣고 늦은 귀가가 괜찮으면 My Sydney를 단독투어로 하는 방법이 있습니다. 가격이 크게 오릅니다.\n\n예약 전에 확인해야 할 것은 다음과 같습니다.\n- 화요일(11/17) 운영 여부와 최소 출발 인원.\n- 3명 예약 가능 여부.\n- 바우처상의 11월 정확한 출발과 복귀 시각.\n- 숙소(YEHS QVB, 143 York St) 직접 드랍 가능 여부.\n- Waug 상품의 정확한 1인 가격(페이지 표시 가격이 비정상적으로 낮아 신뢰하기 어렵습니다).\n\n확인하지 못한 것은 다음과 같습니다.\n- Klook과 KKday 상품은 DataDome 봇 차단(HTTP 403)으로 직접 읽지 못했습니다. 브라우저 도구 사용이 금지되어 우회하지 않았고, 검색 결과 요약만 확인했습니다.\n- Trip.com 상세 페이지는 본문이 비어 있었습니다.\n- Waug의 상세 코스는 접힌 영역이라 읽지 못했습니다.\n- 집결지 좌표는 주소 기반 근사값입니다.","options":[{"name":"[고호주] 시드니 올인원 블루마운틴 \u0026 별보기 + 페더데일/시닉월드/부시워킹 (소그룹, 숙소 드랍 포함)","operator":"고호주(와그 WAUG 판매)","url":"https://www.waug.com/ko/activities/139468","depart_time_nov":"10:30 정시 출발 (바우처 기준 미팅은 10:20). 와그 페이지에 계절 구분 없이 단일 시각으로 표기되어 있어 11월에도 같은 시각일 가능성이 높으나 확정은 아님.","return_time_nov":"공식 복귀 시각 미표기. 페이지의 '12시간 이용' 표기로 추산하면 약 22:30 (추정, 불확실).","meeting_point":"Hyatt Regency Sydney 호텔 앞, 161 Sussex St, Sydney NSW 2000 (달링하버 쪽). YEHS QVB(143 York St)에서 도보 약 10~12분(추정).","price_per_adult_krw_or_aud":"와그 표시가 ₩28,429~ (정가 ₩31,588)로 표기되나 다른 상품 대비 지나치게 낮아 1인 총액이 아닐 가능성이 있음(불확실). 예약 단계에서 최종 금액 확인 필요.","min_pax":"페이지에 최소인원 표기 없음('1명'으로 표기). 소그룹. 3명 예약 가능 여부는 예약 시 확인 필요.","pros_cons_ko":"장점: 가족 요구(10시대 출발, 시닉월드, 세자매봉, 별보기, 숙소 드랍)를 가장 많이 충족하고 출발 시각이 10:30으로 가장 이름. 호텔(타운홀) 근처 집결. 한국어 가이드, 소그룹. 단점: 복귀가 약 22:30 전후로 20시보다 2시간 이상 늦음(추정). 낮에 페더데일과 시닉월드까지 넣어 하루가 빡빡하고 12시간 소요. 가격과 최소인원이 페이지에서 불명확하며 평일 시닉월드 마감(16:00) 때문에 순서가 고정될 가능성이 큼. 일정 미확인 항목이 많아 예약 전 업체 문의가 필요.","includes_stargazing":true,"includes_scenic_world":"포함 (시닉월드 입장권, 3종 기구 이용)"},{"name":"[고호주] 소그룹 블루마운틴 시닉월드 트레킹 + 선셋 + 별보기 (숙소 근처 드랍)","operator":"고호주(와그 WAUG 판매)","url":"https://www.waug.com/ko/activities/140228","depart_time_nov":"12:00 (미팅 10분 전 대기). 와그 페이지에 계절별 구분 없이 12:00 단일 표기.","return_time_nov":"공식 복귀 시각 미표기. 페이지는 '9시간 이용'으로 표기하나 12시 출발이면 일몰(19:41)과 별보기를 포함하면 22시 전후일 가능성이 높음(추정, 9시간 표기와 모순되어 불확실).","meeting_point":"Hyatt Regency Sydney 앞, 161 Sussex St, Sydney NSW 2000","price_per_adult_krw_or_aud":"₩228,451~ (정가 ₩253,835, 와그 표시. 옵션별로 달라질 수 있음)","min_pax":"표기 없음('1명'). 소그룹(최대 인원 미표기).","pros_cons_ko":"장점: 시닉월드 4종 포함에 별보기까지 되고 추가비용이 없다는 소그룹 상품이며 후기 평점이 5.0(13건)입니다. 출발이 12시라 오전에 시내 일정을 넣을 수 있습니다. 단점: 10시 출발 요구와 맞지 않고 복귀가 22시 전후로 늦으며, 리뷰 수가 적습니다. 평일 시닉월드가 16:00에 닫으므로 시닉월드는 늦어도 14시대에는 타야 해서 12시 출발이면 일정이 촉박할 수 있습니다.","includes_stargazing":true,"includes_scenic_world":"포함 (시닉월드 입장권 4종 체험)"},{"name":"[마이시드니] 블루마운틴 올데이 그랜드캐년 트레킹 \u0026 별밤투어 (가족이 이전에 본 상품)","operator":"My Sydney (마이리얼트립 판매)","url":"https://experiences.myrealtrip.com/products/4593701","depart_time_nov":"11월 시각은 상품 페이지에 명시 없음. 12~2월은 12:00 출발로 명시. 같은 업체의 와그 상품 페이지에는 미팅 시각이 시즌별로 07:50~11:30 범위로 안내되어 있음(일몰 시각에 따라 달라짐).","return_time_nov":"12~2월 기준 23:30 전후 복귀로 명시. 11월은 미표기(출발이 더 이르면 약간 앞당겨질 수 있으나 22시 이후일 가능성이 높음, 추정).","meeting_point":"Rydges World Square 호텔 앞, 389 Pitt St, Sydney NSW 2000. YEHS QVB에서 도보 약 12분(추정). 타운홀역 인근.","price_per_adult_krw_or_aud":"소그룹 ₩248,326~ (정가 ₩256,006). 같은 업체 단독투어(별도 상품 4897266)는 ₩930,930~로 표기되나 1~11인 기준 총액인지 1인당인지 불확실.","min_pax":"4명 (4명 미만이면 취소될 수 있음, 최대 11명). 3명 가족이면 단독투어 옵션 필요.","pros_cons_ko":"장점: 이미 가족이 보던 상품이라 정보가 많고 후기 평점이 높습니다. 일몰 포인트와 별보기가 확실하며 호텔 앞 집결입니다. 단점: 최소 4명이라 3명 가족은 인원 부족으로 취소 위험이 있거나 단독투어로 올려야 해서 가격이 크게 오릅니다. 트레킹 중심이라 시닉월드가 빠지고 세자매봉(에코포인트)은 임시 폐쇄 대체지로 대체됨. 복귀가 23:30 전후로 가장 늦은 편입니다. 일정이 길고(13시간) 체력 부담이 큽니다.","includes_stargazing":true,"includes_scenic_world":"미포함 (코스는 그랜드캐니언 트레킹 6.5km 약 3.5시간 중심. 시닉월드는 다른 상품)"},{"name":"[지그재그투어] 다이렉트 선셋 별보기 코스 (블루마운틴 석양 + 별빛 투어)","operator":"지그재그투어 (와그 WAUG 판매)","url":"https://www.waug.com/ko/activities/124942","depart_time_nov":"11월 14:30 (월별 표에 명시: 11월 14:30, 12월 14:30)","return_time_nov":"공식 복귀 시각 미표기('7시간 이용'으로만 표기). 후기에는 날씨가 나빠 야경 투어로 바꿨더니 23시가 넘었다는 내용이 있음(다른 상품 후기, 간접 근거). 약 22~23시 복귀로 추정(불확실).","meeting_point":"SEA LIFE Sydney Aquarium 입구 오른쪽 도로변, 1-5 Wheat Rd, Sydney NSW 2000 (달링하버). YEHS QVB에서 도보 약 15분(추정).","price_per_adult_krw_or_aud":"가격 미확인 (페이지에서 확정 가격을 추출하지 못함)","min_pax":"미표기","pros_cons_ko":"장점: 한인 업체가 만든 '다이렉트' 선셋과 별보기 위주 코스로 이동 낭비가 적고 사진 서비스 후기가 많습니다. 단점: 14:30 출발이라 10시 출발 희망과 맞지 않아 오전에는 시내 일정을 넣어야 합니다. 시닉월드가 없고 복귀가 늦으며, 구름이 끼면 별 대신 야경으로 대체됩니다.","includes_stargazing":true,"includes_scenic_world":"미포함"},{"name":"Blue Mountains Sunset Tour (영어, 중형 코치)","operator":"Autopia Tours","url":"https://autopiatours.com.au/travel-blog/touring-around-sydneys-blue-mountains/","depart_time_nov":"11월은 서머타임 기간(2026-10-04~2027-04-03)이라 12:00 출발 (겨울은 10:00). 주 마이팅 포인트 기준 12:00, Rydges는 12:05, Hilton은 12:10.","return_time_nov":"여름 22:30 (겨울 20:30). 표기상 10시간 30분 소요.","meeting_point":"Mercure Central Sydney, 818-820 George St (Little Regent St 쪽 입구), 12:00 / 가까운 대안: Hilton Sydney, 255 Pitt St (12:10) 또는 Rydges World Square, 389 Pitt St (12:05). YEHS QVB 기준으로 Hilton이 가장 가까움(도보 약 6~8분, 추정).","price_per_adult_krw_or_aud":"AUD 180 (할인가 AUD 153 표기, 프로모션 코드 HD15AT). 환율 변동에 따라 원화 금액 달라짐.","min_pax":"최소 6명, 최대 27명 (인원 초과 시 차량 추가)","pros_cons_ko":"장점: 화요일 운영이 공식적으로 확인되고 가격이 명확합니다(AUD 180). 세자매봉과 일몰은 확실하며 호텔 근처(Hilton 255 Pitt St) 픽업이 가능합니다. 단점: 별보기가 없고 한국어 가이드가 아니며(영어), 11월은 12:00 출발에 22:30 복귀로 요구 조건(10:00~20:00)에 가장 가까운 겨울 일정이 아닙니다. 27명 규모의 코치형이라 소그룹이 아닙니다.","includes_stargazing":false,"includes_scenic_world":"미포함 (국립공원 입장료 포함. 점심/저녁 미포함)"},{"name":"Sydney: Blue Mountains Day Tour with Scenic World Ticket (낮 투어)","operator":"GetYourGuide 판매, 와그 경유","url":"https://www.waug.com/ko/activities/159364","depart_time_nov":"미표기. 바우처에 안내되며 계절에 따라 달라짐. 총 9시간.","return_time_nov":"미표기. 9시간 소요 기준으로 17~18시대 복귀 가능성이 높음(추정). 별보기 없음.","meeting_point":"Mercure Sydney 또는 Furama Darling Harbour 중 예약 시 선택 (정확한 주소는 상품 페이지에 없음. Mercure Sydney는 818-820 George St로 다 러미예요."],["TRS · ABF","TRS는 호주에서 쓴 물건의 세금(GST)을 출국할 때 돌려받는 제도, ABF는 호주 국경수비대(공항 세관)예요."],["Airtrain","브리즈번 시내와 공항을 잇는 공항 열차예요."],["AEDT · AEST · KST","시드니 여름시간(한국보다 2시간 빠름), 퀸즐랜드 시간(1시간 빠름), 한국 시간이에요."],["SmartGate","호주 공항의 자동 입국심사 기계예요."],["ETA (서브클래스 601)","호주에 들어가기 전에 앱으로 받는 전자여행허가예요. 사람마다 따로 신청해요."]],"aliases":{"pre00":"pre-eta","pre01":"pre-fare-check","pre02":"pre-jq53-bag","pre03":"pre-domestic","pre04":"pre-insurance","pre05":"pre-esim","pre06":"pre-plug","pre07":"pre-eta-recheck","pre08":"pre-depart-day","pre09":"pre-arrive-syd","pre10":"pre-opal","pre11":"pre-1119","pre12":"pre-1121","pre13":"pre-1124","pre14":"pre-trs","pre15":"pre-customs-kr","pre16":"pre-note","bk-5cf876a4":"bk-opera-tour","bk-ce948057":"bk-syd-luggage","bk-77da090e":"bk-contactless-card","bk-cb90c0b9":"bk-bm-alt-tour","bk-a708bc3d":"bk-mrwong","bk-ebddc8a1":"bk-snorkel-gear","bk-df16b46e":"bk-qf594","bk-b9f17e0a":"bk-skypoint","bk-4a83df2a":"bk-baritalia","bk-4bc41769":"bk-currumbin","bk-78cd0dae":"bk-koala","bk-03e3a3bb":"bk-tropic","bk-94639fd3":"bk-justin-lane","bk-be7f9a82":"bk-stanley","bk-4e7a0303":"bk-bne-early","bk-ccc5f5ef":"bk-gyoza","bk-eebd1237":"bk-goma","bk-defb5c01":"bk-tangalooma","bk-a256371a":"bk-sta-shuttle","bk-0cace191":"bk-corbett","bk-a34bb760":"bk-desert-safari","bk-5cfc3c28":"bk-tangalooma-reconfirm","bk-dda7ba03":"bk-joeys","bk-d0129e55":"bk-maru","bk-1858ab87":"bk-checkin-1123","bk-10e16b68":"bk-airtrain","bk-1a60a257":"bk-trs-claim","bk-065927c2":"bk-checkin-1124"},"t0":29912260,"t1":29925295,"built":"2026-10-22"}</script>

const OFF_KR = 540, OFF_SYD = 660, OFF_QLD = 600;
const $ = (s, r) => (r || document).querySelector(s);

/* ---------- storage (never throws; falls back to memory) ---------- */
let storageOK = true;

/* ---------- safe DOM builder: data only ever enters via text nodes / vetted URLs ---------- */
function safeUrl(u) { return /^(https?:\/\/|tel:)/i.test(String(u)) ? String(u) : '#'; }

const URL_RE = /(https?:\/\/(?:[^\s<>"')]|\([^\s<>"')]*\))+)/g;

  String(text == null ? '' : text).split(URL_RE).forEach((part, i) => {
    if (i % 2 === 1) {

      if (m) { tail = m[0]; u = u.slice(0, -tail.length); }

function sentences(text) {

/* One list entry: short text as is; long text shows its tag + first sentence, the rest folded under "자세히 보기" */
function longItem(text) {
  const t = String(text || '').trim();
  if (t.length <= 120) return rich(t);

/* ---------- time ---------- */
const pad = n => (n < 10 ? '0' + n : '' + n);

const ymd = (emin, off) => { const d = new Date((emin + off) * 60000); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
const dayNum = ds => { const p = ds.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]) / 86400000; };
const mdLabel = ds => Number(ds.slice(5, 7)) + '/' + Number(ds.slice(8, 10));
function fmtMin(m) {
  m = Math.max(0, Math.round(m));
  if (m < 60) return m + '분';
  const hh = Math.floor(m / 60), mm = m % 60;
  return hh + '시간' + (mm ? ' ' + mm + '분' : '');
}
function naiveOffset(ds, minute) {
  if (ds <= '2026-11-15') return OFF_KR;
  if (ds < '2026-11-19') return OFF_SYD;
  if (ds === '2026-11-19') return minute < 14 * 60 ? OFF_SYD : OFF_QLD;
  if (ds === '2026-11-24') return minute >= 12 * 60 ? OFF_KR : OFF_QLD;
  if (ds < '2026-11-24') return OFF_QLD;
  return OFF_KR;
}
/* ?now=2026-11-17T12:00 (trip-local wall clock, zone guessed by naiveOffset) or with an explicit offset: Z, +11, +11:00, +1100 */
let SIM_NOTE = '';
function parseSim() {
  const m = /[?&]now=([^&]+)/.exec(location.search);
  if (!m) return null;
  let s; try { s = decodeURIComponent(m[1]); } catch (e) { s = ''; }
  const r = /^(\d{4})-(\d\d)-(\d\d)[T ](\d\d):(\d\d)(?::\d\d)?(Z|[+-]\d\d(?::?\d\d)?)?$/.exec(s);
  if (!r) { SIM_NOTE = '?now= 형식이 맞지 않아 무시했어요'; return null; }
  const wall = Date.UTC(+r[1], +r[2] - 1, +r[3], +r[4], +r[5]) / 60000;
  if (r[6]) {
    if (r[6] === 'Z') return wall;
    const sign = r[6][0] === '-' ? -1 : 1, digits = r[6].slice(1).replace(':', '');
    return wall - sign * (+digits.slice(0, 2) * 60 + (digits.length > 2 ? +digits.slice(2) : 0));
  }
  SIM_NOTE = '시간대를 추측했어요';
  return wall - naiveOffset(r[1] + '-' + r[2] + '-' + r[3], +r[4] * 60 + +r[5]);
}
const SIM = parseSim();
const nowMin = () => (SIM !== null ? SIM : Math.floor(Date.now() / 60000));
function locAt(now) {

}
function phaseAt(now) { return now < D.t0 ? 'pre' : now >= D.t1 ? 'post' : 'during'; }
const CITY_NAME = { kr: '한국', air: '비행 중', syd: '시드니', gc: '골드코스트', bne: '브리즈번' };
const CITY_COLOR = { kr: 'fly', air: 'fly', syd: 'syd', gc: 'gc', bne: 'bne' };
function tzTag(off) { return off === OFF_SYD ? 'AEDT' : off === OFF_QLD ? 'AEST' : 'KST'; }
function tzPlace(off) { return off === OFF_SYD ? '시드니 시각' : off === OFF_QLD ? '퀸즐랜드 시각' : '한국 시각'; }

/* ---------- state: checks, detail toggles, font ---------- */
/* checks saved under an older id (index/hash based) move to the stable id once */
function migrateChecks(ck) {
  const out = Object.assign({}, ck);
  let changed = false;
  Object.keys(D.aliases || {}).forEach(old => {
    if (old in out) {
      if (out[D.aliases[old]] === undefined) out[D.aliases[old]] = out[old];
      delete out[old]; changed = true;
    }

}
let CK = (() => { const m = migrateChecks(lsJSON(KEY_CHECKS, {})); if (m.changed) lsSet(KEY_CHECKS, JSON.stringify(m.ck)); return m.ck; })();
const isChecked = id => CK[id] === true;
/* re-read storage first so a second open window (Safari + home-screen app) does not overwrite the other's checks */
function setCheck(id, v) { CK = Object.assign({}, lsJSON(KEY_CHECKS, CK), { [id]: v }); lsSet(KEY_CHECKS, JSON.stringify(CK)); }

/* ---------- helpers ---------- */

function copyText(text) {

  for (let i = 0; i < n; i++) if (EV[i].a <= now) prev = i;

  if (p.di !== q.di) return Object.assign({ kind: 'rest' }, base);

let mapFrameReady = false;

function routeUrl(day) {
  let pts = day.stops.filter(s => s.kind !== 'station' && s.lat < 0);
  pts = pts.filter((p, i) => i === 0 || p.lat.toFixed(4) !== pts[i - 1].lat.toFixed(4) || p.lng.toFixed(4) !== pts[i - 1].lng.toFixed(4));
  if (pts.length > 10) {
    const n = pts.length;
    pts = Array.from({ length: 10 }, (_, i) => pts[Math.round(i * (n - 1) / 9)]);
  }
  return { url: 'https://www.google.com/maps/dir/' + pts.map(p => p.lat + ',' + p.lng).join('/'), count: pts.length };
}

function mountMapFrame(box, force) {
  if (mapFrameReady) return;
  if (navigator.onLine === false && !force) {
    box.replaceChildren(h('div', { class: 'warnbox' }, '지금은 인터넷이 없어서 지도가 열리지 않아요. 일정 탭의 주소 카드나 지도 버튼을 쓰세요.'),
      h('button', { class: 'btn block', type: 'button', style: 'margin-top:.6rem', onclick: () => mountMapFrame(box, true) }, '그래도 불러오기'));
    return;
  }
  mapFrameReady = true;
  let loaded = false;
  const frame = h('iframe', {
    class: 'mapframe', src: D.maps.mymaps_embed, title: '가족여행 구글 내 지도',
    referrerpolicy: 'no-referrer-when-downgrade', allowfullscreen: true,
  });
  frame.addEventListener('load', () => { loaded = true; });
  box.replaceChildren(frame, h('p', { class: 'note' }, '지도 안은 손가락으로 움직여요. 화면을 내리려면 지도 밖을 밀어 주세요.'));
  /* an iframe gives no error event, so if it has not loaded after 8s offer a retry and the full-screen link */
  setTimeout(() => {
    if (loaded || !box.isConnected) return;
    mapFrameReady = false;
    box.replaceChildren(h('div', { class: 'warnbox' }, '지도가 아직 열리지 않았어요. 인터넷이 약하면 아래 "전체 화면으로 열기"를 누르거나 다시 불러오세요.'),
      h('button', { class: 'btn block', type: 'button', style: 'margin-top:.6rem', onclick: () => mountMapFrame(box, true) }, '다시 불러오기'));
  }, 8000);
}

function refreshProgress() {
  $$('[data-ids]').forEach(sec => {

}

/* ---------- 정보 tab ---------- */
function acc(id, title, children, open) {
  const d = h('details', { class: 'acc', 'data-acc': id }, h('summary', null, title), h('div', { class: 'in' }, children));

}
function kv(label, value) { return value ? h('p', null, h('b', null, label + ' '), rich(value)) : null; }

const BAG_RULE_TITLE = '수하물 규정 (운임별 확인 필요)';

  ];

function telRow(e) {

function glossaryBody() {

let infoBuilt = false;

  const pane = $('#pane-info');
  if (!infoBuilt) {
    const F = D.flights;
    pane.replaceChildren(

      ]),

      acc('benefit', '🎁 호텔 1+1 (SK패밀리)', benefitBody(), true),
      acc('visa', '🛂 비자 · 입국', [h('div', { class: 'sub' }, 'ETA(전자여행허가)'), tipList(F.visa_eta), h('div', { class: 'sub' }, '입국 심사 · 검역'), tipList(F.arrival_entry)]),
      acc('money', '💳 돈 · 교통 · 통신', moneyBody()),

    );
    infoBuilt = true;
  }
  if (openId) {
    $$('details.acc', pane).forEach(d => { if (d.getAttribute('data-acc') === openId) d.setAttribute('open', ''); });
    const t = $('details[data-acc="' + openId + '"]', pane);
    if (t && t.scrollIntoView) t.scrollIntoView({ block: 'start' });

/* ---------- top bar, tabs, routing ---------- */
let activeTab = 'today';
const TABS = ['today', 'sched', 'map', 'prep', 'info'];
const FS_LABEL = ['보통', '크게', '아주 크게'];
let fsLevel = Math.min(2, Math.max(0, parseInt(lsGet(KEY_FS) || '0', 10) || 0));
const scrollPos = {};

function applyFs() {
  document.documentElement.setAttribute('data-fs', String(fsLevel));
  const b = $('#fsbtn'); if (b) b.setAttribute('aria-label', '글자 크기 바꾸기 (지금 ' + FS_LABEL[fsLevel] + ')');
}

/* The header nodes are created once and only their text changes, so the font button is never replaced under a finger. */
let topNodes = null;
function buildTop() {
  const t = {
    dot: h('span', { class: 'cdot' }), name: h('b', { class: 'num' }), other: h('small', { class: 'num' }),
    dday: h('span', { class: 'dday num' }),
    fs: h('button', { class: 'fsbtn', id: 'fsbtn', type: 'button', onclick: () => { fsLevel = (fsLevel + 1) % 3; lsSet(KEY_FS, String(fsLevel)); applyFs(); } }, '가'),
  };
  $('#top').replaceChildren(h('div', { class: 'loc' }, t.dot, h('div', { class: 'lt' }, t.name, t.other)), t.dday, t.fs);
  return t;
}
function setText(n, v) { if (n.textContent !== v) n.textContent = v; }

function renderTop() {
  if (!topNodes) topNodes = buildTop();
  const now = nowMin(), L = locAt(now), ph = phaseAt(now);
  const showKey = ph === 'pre' ? 'kr' : L.key;
  const local = hm(now, L.off);
  const other = (showKey === 'kr' || showKey === 'air')
    ? '시드니 ' + hm(now, OFF_SYD) + ' ' + tzTag(OFF_SYD)
    : tzTag(L.off) + ' · 한국 ' + hm(now, OFF_KR);
  let right;
  if (ph === 'pre') {
    const dd = dayNum('2026-11-15') - dayNum(ymd(now, OFF_KR));
    right = dd <= 0 ? 'D-DAY' : 'D-' + dd;
  } else if (ph === 'during') {
    const n = Math.min(DAYS.length, Math.max(1, dayNum(ymd(now, L.off)) - dayNum('2026-11-15') + 1));
    right = 'Day ' + n + '/' + DAYS.length;
  } else right = '여행 끝';
  if (topNodes.dot.getAttribute('data-c') !== CITY_COLOR[showKey]) topNodes.dot.setAttribute('data-c', CITY_COLOR[showKey]);
  setText(topNodes.name, CITY_NAME[showKey] + ' ' + local);
  setText(topNodes.other, other);
  setText(topNodes.dday, right);
  applyFs();
  let sim = $('#simbadge');
  const note = SIM !== null ? '테스트 시각 ' + ymd(SIM, L.off).slice(5) + ' ' + local + (SIM_NOTE ? ' (' + SIM_NOTE + ')' : '') : SIM_NOTE;
  if (note) {
    if (!sim) { sim = h('div', { class: 'simbadge', id: 'simbadge' }); document.body.appendChild(sim); }
    setText(sim, note);
  }
}

/* A failing render must not take the tab bar or the other panes down with it. */
function failPane(tab, e) {
  console.error(e);
  const p = $('#pane-' + tab);
  if (p) {
    paneSig[p.id] = null;
    p.replaceChildren(h('div', { class: 'warnbox', role: 'alert' }, '화면을 불러오지 못했어요. 아래 탭을 눌러 다른 화면을 보거나, 페이지를 새로 고쳐 보세요.'));
  }
}
function guard(tab, fn) { try { fn(); } catch (e) { failPane(tab, e); } }

function go(tab, opts) {
  const o = opts || {};
  if (TABS.indexOf(tab) < 0) tab = 'today';
  scrollPos[activeTab] = window.scrollY;
  activeTab = tab;
  TABS.forEach(t => {
    const sel = t === tab;
    $('#tab-' + t).setAttribute('aria-selected', sel ? 'true' : 'false');
    $('#tab-' + t).setAttribute('tabindex', sel ? '0' : '-1');
    $('#pane-' + t).hidden = !sel;
  });
  if (tab === 'sched' && o.day) selDay = o.day;
  guard(tab, () => {
    if (tab === 'today') renderToday();
    else if (tab === 'sched') renderSched();
    else if (tab === 'map') { if (!$('#mapbox')) renderMap(); mountMapFrame($('#mapbox')); }
    else if (tab === 'prep') renderPrep();
    else if (tab === 'info') renderInfo(o.open);
  });
  const hash = tab === 'sched' ? '#/sched/' + selDay : '#/' + tab;
  try {
    if (o.replace || location.hash === hash) history.replaceState(null, '', hash);
    else history.pushState(null, '', hash);  /* tab changes get their own history entry so the back swipe returns to the previous tab */
  } catch (e) { /* file:// or sandboxed */ }
  if (!o.open) window.scrollTo(0, o.day ? 0 : (scrollPos[tab] || 0));
}

function routeFromHash() {
  const hsh = location.hash || '';
  let m;
  if ((m = /^#\/sched\/(\d{4})$/.exec(hsh)) && DAYS.some(d => d.key === m[1])) return ['sched', { day: m[1] }];
  if ((m = /^#\/(today|sched|map|prep|info)$/.exec(hsh))) return [m[1], {}];
  if ((m = /^#d(\d{4})$/.exec(hsh)) && DAYS.some(d => d.key === m[1])) return ['sched', { day: m[1] }];
  if (hsh === '#map') return ['map', {}];
  return ['today', {}];
}

function tick() {
  guard('today', () => { renderTop(); updateBadges(); });
  if (activeTab === 'today' && !document.hidden) guard('today', renderToday);
}

function init() {
  /* listeners first: if the first render throws, tabs, hash routing and the clock still work */
  $$('.tabbar button').forEach(b => {
    b.addEventListener('click', () => go(b.getAttribute('data-tab')));
    b.addEventListener('keydown', e => {
      const i = TABS.indexOf(b.getAttribute('data-tab'));
      let nx = null;
      if (e.key === 'ArrowRight') nx = TABS[(i + 1) % TABS.length];
      else if (e.key === 'ArrowLeft') nx = TABS[(i + TABS.length - 1) % TABS.length];
      else if (e.key === 'Home') nx = TABS[0];
      else if (e.key === 'End') nx = TABS[TABS.length - 1];
      if (nx) { e.preventDefault(); go(nx); $('#tab-' + nx).focus(); }
    });
  });
  window.addEventListener('hashchange', () => { const x = routeFromHash(); go(x[0], Object.assign({ replace: true }, x[1])); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  window.addEventListener('storage', e => {
    if (e.key !== KEY_CHECKS) return;
    CK = migrateChecks(lsJSON(KEY_CHECKS, {})).ck;
    guard('prep', () => { if (prepBuilt) refreshProgress(); updateBadges(); });
    if (activeTab === 'today') guard('today', renderToday);
  });
  setInterval(tick, 30000);
  guard('today', () => { renderTop(); updateBadges(); });
  const r = routeFromHash();
  go(r[0], Object.assign({ replace: true }, r[1]));
  if (!storageOK) toast('이 기기에서는 체크가 저장되지 않아요');
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('offline cache unavailable', e));
  }
}
init();

} catch (e) { console.error(e); var p = document.getElementById('pane-today'); if (p) { p.textContent = '화면을 불러오지 못했어요. 페이지를 새로 고쳐 보세요.'; } }
})();
