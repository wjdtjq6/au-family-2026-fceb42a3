<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B5E8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="호주여행">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="format-detection" content="telephone=no">
<title>호주 가족여행 2026 · 11/15–11/24</title>
<style>
:root{
  --bg:#F6EFE2;--card:#FFFFFF;--card2:#FBF7EE;--ink:#14202B;--muted:#4B5966;--line:#E3D9C4;--chip:#EFE7D6;
  --ocean:#0B5E8A;--sun:#E08A1E;--sunink:#9A5A0C;--gum:#2F7D5B;--gumink:#25664A;--night:#1B2A4A;--red:#B93A0B;
  --warn-bg:#FFF1C9;--warn-ink:#5F4400;--ok-bg:#DDF1E6;--shadow:0 1px 0 rgba(20,32,43,.06),0 6px 18px rgba(20,32,43,.07);
  --c-syd:#0B5E8A;--c-gc:#E08A1E;--c-bne:#2F7D5B;--c-fly:#1B2A4A;
  --i-syd:#0B5E8A;--i-gc:#9A5A0C;--i-bne:#25664A;--i-fly:#1B2A4A;
  --r:16px;--tab:64px;--top:56px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1B26;--card:#172636;--card2:#1B2D3F;--ink:#F2F5F7;--muted:#B6C2CC;--line:#2A3C4D;--chip:#223548;
    --ocean:#6DB8E3;--sun:#F2B15C;--sunink:#F2B15C;--gum:#7CCBA0;--gumink:#7CCBA0;--night:#AFC3E8;--red:#FF9B73;
    --warn-bg:#3A3015;--warn-ink:#FFE7A3;--ok-bg:#183A2B;--shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --c-syd:#3F9BCB;--c-gc:#E69A3A;--c-bne:#4FAE82;--c-fly:#7C8FBF;
    --i-syd:#6DB8E3;--i-gc:#F2B15C;--i-bne:#7CCBA0;--i-fly:#AFC3E8;
  }
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--top) + env(safe-area-inset-top) + 12px)}
html[data-fs="1"]{font-size:20px}
html[data-fs="2"]{font-size:22px}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  line-height:1.5;letter-spacing:-.01em;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 28px)}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--ocean);text-decoration-thickness:1.5px;text-underline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ocean);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-999px;top:0;background:var(--card);padding:.6rem 1rem;z-index:99}
.skip:focus{left:8px;top:8px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pane{overflow-wrap:anywhere}
.copybuf{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:.5rem;
  padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));background:var(--card);border-bottom:1px solid var(--line);
  box-sizing:content-box}
.top .loc{flex:1;min-width:0;display:flex;align-items:center;gap:.55rem}
.cdot{flex:none;width:.8rem;height:.8rem;border-radius:50%;background:var(--cc,var(--c-fly))}
.top .lt{min-width:0;line-height:1.2}
.top .lt b{display:block;font-size:1.02rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .lt small{display:block;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dday{flex:none;font-weight:800;font-size:1rem;background:var(--night);color:#fff;border-radius:999px;padding:.25rem .7rem;white-space:nowrap}
@media (prefers-color-scheme:dark){.dday{background:#2B4468}}
.fsbtn{flex:none;min-width:48px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-weight:800;font-size:1.1rem}
.simbadge{position:fixed;top:calc(var(--top) + env(safe-area-inset-top) + 4px);right:8px;z-index:31;background:#B93A0B;color:#fff;font-size:.8rem;padding:.1rem .6rem;border-radius:999px}

/* ---------- panes ---------- */
.pane{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.pane[hidden]{display:none}
.pane>*+*{margin-top:14px}
.h2{font-size:1.2rem;font-weight:800;margin:6px 2px -4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.card>*+*{margin-top:.6rem}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.note{font-size:.92rem;color:var(--muted)}
.stack>*+*{margin-top:.6rem}
.row-flex{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;padding:.5rem 1rem;border-radius:12px;
  border:1.5px solid var(--ocean);background:var(--card);color:var(--ocean);font-weight:700;text-decoration:none;font-size:1rem;text-align:center}
.btn.pri{background:var(--ocean);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#0F1B26}}
.btn.lg{min-height:52px;font-size:1.02rem}
.btn.ghost{border-color:var(--line);color:var(--ink);background:var(--card2)}
.btn.sm{min-height:44px;padding:.3rem .8rem;font-size:.95rem}
.btn.block{display:flex;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:.5rem}
.btns>.btn{flex:1 1 7rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;background:var(--chip);padding:.2rem .7rem;font-size:.9rem;font-weight:600}
.chip.red{background:#FBE0D6;color:#7C2606}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.ok{background:var(--ok-bg);color:#14513A}
.chip.navy{background:var(--night);color:#fff}
@media (prefers-color-scheme:dark){.chip.red{background:#4A2113;color:#FFC9B3}.chip.ok{color:#BDEBD2}.chip.navy{background:#2B4468}}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.pill{display:inline-block;flex:none;white-space:nowrap;border-radius:999px;padding:.15rem .8rem;font-weight:800;font-size:.95rem;color:#fff;background:var(--night)}
.pill.now{background:#1F7A4F}.pill.next{background:#0B5E8A}.pill.transit{background:#5A6672}.pill.flight{background:#1B2A4A}.pill.rest{background:#5A4A8A}.pill.pre{background:#0B5E8A}
@media (prefers-color-scheme:dark){.pill.now{background:#2E8F61}.pill.next{background:#2778A5}}

/* ---------- ticket (now/next, hero) ---------- */
.ticket{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:20px 16px 16px;overflow:hidden}
.ticket::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--cc,var(--c-fly))}
.ticket .tk-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.ticket .tk-time{font-size:1.5rem;font-weight:800;line-height:1.15;margin-top:.55rem}
.ticket .tk-name{font-size:1.35rem;font-weight:800;line-height:1.25;margin-top:.25rem}
.ticket .tk-one{font-size:1.05rem;margin-top:.3rem}
.ticket .tk-big{font-size:2.6rem;font-weight:800;line-height:1.05;margin-top:.4rem}
.perf{position:relative;border-top:2px dashed var(--line);margin:14px -16px 12px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-12px}.perf::after{right:-12px}
.bar{height:10px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:.7rem}
.bar>i{display:block;height:100%;background:var(--cc,var(--ocean));border-radius:999px;width:0}
.tk-next{display:flex;gap:.6rem;align-items:flex-start;font-size:1rem}
.tk-next b{font-weight:800}
.tz{font-size:.85rem;color:var(--muted);font-weight:600}

/* ---------- deadline rows ---------- */
.dl{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem 0;border-top:1px solid var(--line)}
.dl:first-of-type{border-top:0}
.dl .due{flex:none;min-width:4.2rem;text-align:center;border-radius:12px;padding:.35rem .3rem;font-weight:800;font-size:1.05rem;background:var(--chip)}
.dl .due small{display:block;font-size:.8rem;font-weight:600;color:var(--muted)}
.dl .due.hot{background:#FBE0D6;color:#7C2606}.dl .due.hot small{color:#7C2606}
@media (prefers-color-scheme:dark){.dl .due.hot{background:#4A2113;color:#FFC9B3}.dl .due.hot small{color:#FFC9B3}}
.dl .tt{font-weight:800;font-size:1.05rem;line-height:1.3}
.dl .nn{font-size:.95rem;color:var(--muted);margin-top:.15rem}
.dl .dlbody{flex:1;min-width:0}
.dl .dlhit{flex:none;display:flex;align-items:center;justify-content:center;width:48px;height:48px;margin:-.4rem -.4rem -.4rem 0;cursor:pointer}

/* ---------- checkboxes ---------- */
.ckw{border-top:1px solid var(--line)}
.ckw:first-child{border-top:0}
.ck{display:flex;gap:.8rem;align-items:flex-start;min-height:56px;padding:.6rem 0;cursor:pointer}
.ckx{padding:0 0 .5rem calc(32px + .8rem)}
.ck input{flex:none;width:32px;height:32px;margin:0;accent-color:var(--ocean);cursor:pointer}
.ck .tx{flex:1;min-width:0;font-size:1rem;line-height:1.45}
.ck input:checked+.tx{opacity:.55;text-decoration:line-through;text-decoration-thickness:1.5px}
.ck .tag{display:inline-block;font-size:.85rem;font-weight:700;background:var(--chip);border-radius:999px;padding:0 .6rem;margin-right:.4rem}
.more{margin-top:.3rem}
.more summary{font-size:.92rem;color:var(--ocean);font-weight:700;min-height:44px;display:flex;align-items:center}
.more p{font-size:.92rem;color:var(--muted)}
.more>div>p+p{margin-top:.4rem}
.prog{display:flex;align-items:center;gap:.7rem}
.prog .bar{flex:1;margin:0;height:12px}
.prog b{font-size:.95rem;min-width:3.2rem;text-align:right}
.datechip{display:inline-flex;align-items:center;min-height:44px;border:0;background:var(--chip);border-radius:999px;padding:0 .7rem;font-weight:700;font-size:.9rem;color:var(--ink);margin-right:.3rem}

/* ---------- accordion / details ---------- */
details.acc,details.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
details.acc>summary,details.fold>summary{list-style:none;display:flex;align-items:center;gap:.6rem;min-height:56px;padding:.5rem 16px;font-weight:800;font-size:1.05rem;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details.acc>summary::after,details.fold>summary::after{content:"";margin-left:auto;flex:none;width:.6rem;height:.6rem;border-right:3px solid var(--muted);border-bottom:3px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .18s}
details[open].acc>summary::after,details[open].fold>summary::after{transform:rotate(-135deg) translateY(-2px)}
details.acc>.in,details.fold>.in{padding:2px 16px 16px}
details.acc>.in>*+*,details.fold>.in>*+*{margin-top:.7rem}
.cnt{font-size:.9rem;font-weight:700;background:var(--chip);border-radius:999px;padding:0 .6rem}
.bul{display:grid;gap:.55rem}
.bul>li{position:relative;padding-left:1.1rem;font-size:1rem;line-height:1.5}
.bul>li::before{content:"";position:absolute;left:.1rem;top:.6em;width:.45rem;height:.45rem;border-radius:50%;background:var(--cc,var(--ocean))}
.sub{font-size:.95rem;font-weight:800;color:var(--muted);margin-top:.8rem}

/* ---------- schedule: band, chips, header ---------- */
.band{display:flex;height:30px;border-radius:10px;overflow:hidden;font-size:.82rem;font-weight:800;color:#fff;gap:2px}
.band>span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 4px;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.band .syd{background:#0B5E8A;flex:3}.band .gc{background:#A55F00;flex:2}.band .bne{background:#2F7D5B;flex:3}.band .fly{background:#1B2A4A;flex:1}
.chips-row{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 8px;margin:0 -4px;-webkit-overflow-scrolling:touch}
.dchip{flex:none;scroll-snap-align:center;width:60px;min-height:68px;border-radius:14px;border:2px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0;position:relative}
.dchip small{font-size:.8rem;color:var(--muted);font-weight:600}
.dchip b{font-size:1.1rem;font-weight:800;line-height:1.1}
.dchip i{width:.55rem;height:.55rem;border-radius:50%;background:var(--cc)}
.dchip em{position:absolute;top:-9px;font-style:normal;font-size:.72rem;font-weight:800;background:var(--red);color:#fff;border-radius:999px;padding:0 .45rem}
.dchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dchip[aria-pressed="true"] small{color:var(--bg)}
.dchip.today{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.dayhead{position:relative;border-radius:var(--r);padding:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.dayhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--cc)}
.dayhead.move::before{background:linear-gradient(var(--cc0),var(--cc))}
.dayhead>*+*{margin-top:.5rem}
.dayhead h2{font-size:1.4rem;line-height:1.25;font-weight:800;padding-left:6px}
.dayhead .st{font-size:1rem;color:var(--muted);padding-left:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dayhead .chips{padding-left:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{min-height:46px;border:0;background:transparent;font-weight:800;font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- timeline ---------- */
.tl{--cc:var(--c-fly)}
.tl>li{display:grid;grid-template-columns:3.7rem 2rem minmax(0,1fr);column-gap:.55rem;position:relative}
.tl .rr{position:relative;display:flex;justify-content:center}
.tl .rr::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--cc);opacity:.4}
.tl>li:first-child .rr::before{top:1.3rem}
.tl>li:last-child .rr::before{bottom:calc(100% - 1.3rem)}
.tl .dot{position:relative;z-index:1;margin-top:.55rem;width:2rem;height:2rem;border-radius:50%;background:var(--card);border:2.5px solid var(--cc);display:grid;place-items:center;font-size:.95rem;line-height:1}
.tl .rt{padding-top:.6rem;text-align:right;line-height:1.15}
.tl .rt b{display:block;font-size:1.2rem;font-weight:800}
.tl .rt small{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.tl .rb{padding:.5rem 0 .75rem;min-width:0}
.tl .nm{font-size:1.1rem;font-weight:800;line-height:1.3}
.tl .one{font-size:1rem;line-height:1.4;margin-top:.1rem}
.tl .bd{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.4rem}
.tl .acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.tl>li.row.past{opacity:.55}
.tl>li.row.cur .rb{background:var(--card2);border-left:6px solid var(--cc);margin-left:-6px;padding-left:.6rem;border-radius:10px}
.tl>li.row.cur .dot{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cc) 55%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.tl>li.row.cur .dot{animation:none}*{transition:none!important}}
.tl>li.conn .rr::before{background:none;opacity:1;border-left:3px dotted var(--cc)}
.tl>li.conn .rb{padding:.1rem 0 .3rem}
.cchip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.15rem .5rem;background:var(--chip);border-radius:14px;padding:.3rem .8rem;font-size:.92rem;font-weight:600;line-height:1.35}
.cchip.long{background:var(--ink);color:var(--bg)}
.cconn{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.cconn .btn{min-height:44px}
.legd{font-size:.92rem;color:var(--muted);margin-top:.35rem}
.dl2{display:grid;gap:.45rem;margin-top:.5rem;font-size:.95rem}
.dl2>div{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:.5rem}
.dl2 dt{font-weight:800;color:var(--muted)}
.dl2 dd{margin:0;line-height:1.45}

/* ---------- tour card ---------- */
.tour{border:2px solid var(--c-syd);background:var(--card)}
.tour h3{font-size:1.2rem;font-weight:800;line-height:1.3}
.tour .big{font-size:1.5rem;font-weight:800;line-height:1.2}
.tour .meet{background:var(--card2);border-radius:12px;padding:12px;border:1px dashed var(--line)}
.warnbox{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-weight:600;font-size:1rem}
.warnbox b{font-weight:800}
.trade{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;text-align:center}
.trade>div{background:var(--card2);border-radius:12px;padding:.5rem .2rem;border:1px solid var(--line)}
.trade b{display:block;font-size:1.15rem}
.trade small{font-size:.82rem;color:var(--muted)}
.opt{border-top:1px solid var(--line);padding-top:.7rem}
.opt h4{font-size:1rem;font-weight:800}

/* ---------- map ---------- */
.mapframe{width:100%;height:70vh;height:70dvh;min-height:360px;border:0;border-radius:var(--r);background:var(--chip);display:block}
.lists{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.lists a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72px;border-radius:14px;color:#fff;text-decoration:none;font-weight:800;font-size:1.02rem;text-align:center;padding:.4rem}
.lists a small{font-size:.85rem;font-weight:600;opacity:.95}
.lists .syd{background:#0B5E8A}.lists .gc{background:#A55F00}.lists .bne{background:#2F7D5B}
.routes{display:grid;gap:.5rem}
.routes a{display:flex;align-items:center;gap:.8rem;min-height:56px;padding:.4rem .9rem;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;border-left:8px solid var(--cc)}
.routes a small{display:block;font-weight:500;color:var(--muted);font-size:.88rem}
.routes a span.d{font-weight:800;font-size:1.05rem;min-width:3.6rem}

/* ---------- info ---------- */
.fcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card2)}
.fcard .route{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.3rem 0}
.fcard .route b{font-size:1.6rem;font-weight:800;line-height:1}
.fcard .route small{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.fcard .route .ar{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 6px,transparent 6px 12px);position:relative;margin:0 .3rem}
.fcard .route .ar::after{content:"";position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:9px solid var(--muted)}
.bag{display:inline-flex;align-items:center;gap:.4rem;background:var(--night);color:#fff;border-radius:999px;padding:.25rem .9rem;font-weight:800;font-size:.98rem}
@media (prefers-color-scheme:dark){.bag{background:#2B4468}}
.answer{background:var(--ok-bg);border:2px solid var(--gum);border-radius:14px;padding:14px}
.answer .q{font-weight:800;font-size:1.05rem}
.answer .a{font-size:1.05rem;margin-top:.4rem;line-height:1.55}
.hotel{border-left:8px solid var(--cc)}
.hotel h3{font-size:1.1rem;font-weight:800}
.tel{display:flex;align-items:center;justify-content:space-between;gap:.6rem;min-height:60px;padding:.5rem 1rem;border-radius:14px;background:var(--card2);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tel b{font-size:1.15rem;color:var(--ocean)}
.tel span{font-weight:700}

/* ---------- tab bar, toast ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--card);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-shadow:0 -4px 18px rgba(20,32,43,.08)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{position:relative;min-height:var(--tab);border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:.82rem;font-weight:800;color:var(--muted);padding:6px 0}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--ocean)}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:6px;width:56px;height:30px;border-radius:999px;background:color-mix(in srgb,var(--ocean) 16%,transparent);z-index:0}
.tabbar svg,.tabbar span{position:relative;z-index:1}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:20px;height:20px;border-radius:999px;background:var(--red);color:#fff;font-style:normal;font-size:.75rem;
  font-weight:800;display:grid;place-items:center;padding:0 5px;z-index:2}
.tabbar .badge[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);opacity:0;z-index:60;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:.6rem 1.2rem;border-radius:999px;font-weight:700;transition:opacity .2s,transform .2s;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act.on{pointer-events:auto}
.toastbtn{margin-left:.8rem;min-height:44px;padding:0 .8rem;border:0;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:800}

@media print{
  .top,.tabbar,#toast,.btns,.seg,.chips-row,.band,.fsbtn{display:none!important}
  .pane[hidden]{display:block!important}
  details>*{display:block!important}
  body{background:#fff;color:#000;padding:0}
  .card,.dayhead,.ticket,details.acc,details.fold{box-shadow:none;break-inside:avoid}
}

/* city color hooks (set via data-c / data-c0 so no inline styles are needed) */
[data-c="syd"]{--cc:var(--c-syd);--ci:var(--i-syd)}
[data-c="gc"]{--cc:var(--c-gc);--ci:var(--i-gc)}
[data-c="bne"]{--cc:var(--c-bne);--ci:var(--i-bne)}
[data-c="fly"]{--cc:var(--c-fly);--ci:var(--i-fly)}
[data-c0="syd"]{--cc0:var(--c-syd)}[data-c0="gc"]{--cc0:var(--c-gc)}[data-c0="bne"]{--cc0:var(--c-bne)}[data-c0="fly"]{--cc0:var(--c-fly)}
.ci{color:var(--ci,inherit)}
.dl .dlcb{flex:none;width:32px;height:32px;margin:0;accent-color:var(--ocean);cursor:pointer}
.tel span{display:block}
.tel small{display:block;font-weight:500;color:var(--muted);font-size:.85rem;margin-top:.15rem}
.gloss{display:grid;gap:.6rem}
.gloss dt{font-weight:800}
.gloss dd{margin:0;color:var(--muted);font-size:.95rem}
.pane p a,.bul a,.tx a,.dl2 a{padding:.3em 0}

/* ---------- weather ---------- */
.wxrows{display:grid;gap:.5rem}
.wxrow{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;align-items:center;gap:.6rem;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem}
.wxi{font-size:1.6rem;line-height:1;text-align:center}
.wxb b{display:block;font-weight:800;line-height:1.25}
.wxb span{display:block;font-size:.92rem;color:var(--muted)}
.wxn{text-align:right;line-height:1.2}
.wxn b{display:block;font-size:1.15rem;font-weight:800}
.wxn small{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.advice{border-radius:12px;padding:12px 14px;font-size:1rem;line-height:1.5;background:var(--card2);border:1px solid var(--line)}
.advice>*+*{margin-top:.4rem}
.advice>b{display:block;font-weight:800;font-size:1.08rem}
.advice.ok{background:var(--ok-bg);border-color:var(--gum)}
.advice.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.advice .basis{opacity:.85}
.wxnext{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:.55rem .8rem;min-height:48px}
.wxnext b{display:block;font-weight:800;font-size:.95rem}
.wxnext span{display:block;font-size:.92rem;color:var(--muted);font-weight:600}
.dchip .wxm{font-size:.78rem;font-weight:700;line-height:1.15;white-space:nowrap}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.dchip{width:66px;min-height:84px}
.livenote{font-size:.92rem;font-weight:700;color:var(--ci,var(--ocean));padding-left:6px}

</style>

:["코클베이 워프의 Nick's Seafood · I'm Angus Steakhouse · Adria는 저녁 17:00~22:00입니다(Nick's 그룹 공식 사이트, 11/16 확인). 가격은 확인하지 못했어요.","달링 스퀘어 쪽으로 가려면 XOPP(광둥식 해산물, 매일 저녁 17:00~22:00, 공식 확인)와 Nakano Darling(이자카야, 월~목 17:00~23:00, 달링하버 공식 확인)이 있습니다. 호텔에서 약 1km · 14분, 거기서 코클베이까지 12분입니다(지도 경로 계산).","달링하버 서쪽 하버사이드 쇼핑몰은 철거 공사 중이고 피어몬트 브리지는 보수 중입니다(달링하버 공식 공지). 물가를 한 바퀴 다 돌기보다 다리와 동쪽 코클베이 쪽만 걷는 편이 좋아요.","새 수산시장의 생선 가게 카운터는 월~목 16:00에 닫습니다(공식 매장 안내). 그래서 수산시장은 수요일 낮 일정으로 옮겼어요.","내일 샌드위치: 호텔에서 3분인 Woolworths Town Hall(George St와 Park St 모퉁이, 자정쯤까지로 알려짐, 제3자 자료)에서 오늘 밤 사 두거나 내일 07:30에 들르세요. 영업이 공식 확인된 곳은 Coles World Square(644 George St 지하, 06:00~자정)이고 걸어서 약 12분입니다."],"rain":"식당은 실내라 그대로 갑니다. 비가 굵어지면 식사 후 산책을 접고 호텔로 바로 돌아오세요(도보 8~10분). 가는 길도 600m라 우산이면 충분합니다.","tzchg":0,"tour":0,"advice":{"level":"warn","title":"우산과 겉옷을 챙기세요 · 바람이 셉니다","body":"저녁 내내 소나기가 오락가락하고 남풍이 시속 30km 안팎이라 체감 15도예요. 바람은 22시쯤 잦아듭니다.\n비가 굵어지면 달링하버는 피어몬트 브리지만 건너고 바로 호텔로 돌아오세요(도보 8~10분).","basis":"BOM 시드니 시간별 예보(11/16 17:17 발표): 18~21시 기온 18~19도, 체감 15도, 비 확률 30~40%, 남풍 28~33km/h"},"alts":[],"live":"11/16 18:30 수정 · 저녁은 달링하버 코클베이 워프, 수산시장은 수요일로"},{"date":"2026-11-17","key":"1117","wd":"화","ck":"syd","city":"Sydney / Blue Mountains (Katoomba)","short":"블루마운틴 (기차 자유여행)","sub":"08:25 센트럴역 기차 → 시닉월드 → 세자매봉 → 카툼바 저녁 → 20:17 센트럴 도착","sun":"일출 05:46 · 일몰 19:41 (카툼바)","cost":125,"hotel":"예스 호텔 시드니 QVB","hotel_city":"시드니","summary":"예보가 좋아 화요일에 블루마운틴에 갑니다(카툼바 비 확률 5%). 예약이 필요 없는 기차 자유여행으로 짰고, 아침에 날씨를 보고 가도 됩니다. 07:25 호텔을 나서 바로 옆 Woolworths에서 점심 샌드위치와 물을 사고, 타운홀역에서 센트럴역으로 한 정거장 간 뒤 08:25 블루마운틴행 기차를 탑니다(전날 밤 사 두면 07:40 출발). 카툼바에 10:24에 도착해 686번 버스로 시닉월드에 먼저 갑니다(화요일은 16:00에 닫음). 탈것을 타고 싸 온 샌드위치로 점심을 먹은 뒤 버스로 에코 포인트에 가서 세자매봉을 보고, 카툼바 스트리트에서 쉬다가 한식으로 이른 저녁을 먹습니다. 18:16 기차로 돌아오면 센트럴역 20:17, 호텔 20:35입니다. 일몰까지 보거나 일찍 돌아오는 방법은 '다른 선택지'에 있습니다.","weather":"화요일 카툼바는 6~20도, 비 확률 5%, 구름 조금, 바람 약함(시속 7~15km)입니다. 시간별로는 09시 10도 → 11시 15도 → 14시 20도 → 17시 19도 → 19시 16도(체감 13도) → 21시 13도입니다. 새벽 습도가 100%라 이른 아침엔 계곡에 안개가 낄 수 있지만 10시엔 71%로 내려갑니다. 자외선  조회, 11/17 화요일 기준))","cost":null,"bk":"불필요 (예약 없는 일반 열차, 컨택리스 카드 탭)","wt":"전광판에서 'Blue Mountains Line · Lithgow'행 승강장을 확인하세요(조사 시점엔 7번, 대합실 쪽). 교외선 승강장에서 걸어서 6~10분 걸리니 여유 있게 움직입니다. 커피는 역 안에서 살 수 있을 텐데 매장과 영업시간은 확인하지 못했어요. 기차는 2시간이고 화장실이 있습니다.","bu":"놓치면 다음은 08:55(카툼바 10:48), 09:09(카툼바 11:08)입니다. 07:55편은 Springwood 종착이라 타지 마세요.","url":"","one":"전광판에서 Lithgow행 승강장 확인 · 08:25 출발","m":1,"q":"Central Station, Central Station, Eddy Ave, Haymarket NSW 2000"},{"id":"s4","k":"카툼바역 (하차 · 686번 버스)","n":"Katoomba Station","kind":"station","lat":-33.7118546,"lng":150.3112294,"adr":"Katoomba Station, Goldsmith Pl, Katoomba NSW 2780","a":"10:24","l":"10:40","ea":29914524,"el":29914540,"tz":660,"hrs":"","cost":null,"bk":"","wt":"역을 나와 Katoomba St의 Carrington Hotel 앞 정류장(약 130m)에서 686번 버스를 탑니다. 기사에게 'Scenic World'로 가는지 확인하세요. 오전 배차는 확인하지 못해 출발 시각은 추정입니다. 정류장 시간표를 보고, 30분 가까이 기다려야 하면 택시를 타거나 걸어가세요(약 2.6km · 34분, 지도 경로 계산).","bu":"","url":"","one":"","m":0,"q":"Katoomba Station, Katoomba Station, Goldsmith Pl, Katoomba NSW 2780"},{"id":"s5","k":"시닉월드 (스카이웨이·시닉 레일웨이·케이블웨이 + 보드워크)","n":"Scenic World Blue Mountains","kind":"activity","lat":-33.7289504,"lng":150.3012638,"adr":"Violet St \u0026 Cliff Dr, Katoomba NSW 2780","a":"11:05","l":"14:10","ea":29914565,"el":29914750,"tz":660,"hrs":"화요일 10:00~16:00. 마지막 탑승은 위쪽 역 15:40쯤, 계곡 15:50쯤 (시닉월드 공식 사이트, 11/16 확인)","cost":64,"bk":"예약 불필요(평일엔 보통 현장 구매가 되지만 매진되면 못 삽니다). 온라인 예매가 더 싸고 안전해요. Unlimited Discovery Pass 성인 A$64부터.","wt":"추천 순서는 스카이웨이로 폭포 위를 건넜다 오기 → 레일웨이로 계곡에 내려가기 → 보드워크 산책 → 케이블웨이로 올라오기입니다. 탑승은 약 10분 간격이에요. 싸 온 샌드위치는 시닉월드 안에서는 'Skyway Park'의 피크닉 테이블에서만 먹을 수 있습니다(공식 FAQ. 카페와 식당 자리는 거기서 산 음식만 됩니다). 위치는 직원에게 물어보세요. 음료는 시닉월드 카페(08:00부터 폐장까지)에서 살 수 있어요. 월요일에 비가 와서 계곡 보드워크가 미끄러울 수 있어요. 탈것별 당일 운행 여부는 확인하지 못했으니 매표소에서 확인하세요.","bu":"탈것이 점검으로 멈추면 에코 포인트로 먼저 가서 세자매봉 산책을 길게 하세요.","url":"https://www.scenicworld.com.au/","one":"스카이웨이 · 레일웨이 · 케이블웨이 + 보드워크, 샌드위치 점심","m":1,"q":"Scenic World Blue Mountains, Violet St \u0026 Cliff Dr, Katoomba NSW 2780"},{"id":"s6","k":"에코 포인트 전망대 (세자매봉)","n":"Echo Point Lookout (Three Sisters)","kind":"sight","lat":-33.7327197,"lng":150.3120221,"adr":"Echo Point Rd, Katoomba NSW 2780","a":"14:25","l":"15:45","ea":29914765,"el":29914845,"tz":660,"hrs":"전망대는 항상 열려 있어요. 안내소는 매일 09:00~16:00.","cost":0,"bk":"","wt":"전망대에서 세자매봉과 제미슨 밸리를 봅니다. 여유가 되면 Three Sisters Walk로 첫 번째 봉우리 쪽까지 다녀오세요(짧은 산책로지만 끝부분에 가파른 계단이 있다고 알려져 있어요. 거리는 확인하지 않았으니 현장 표지를 따르세요). 국립공원 경보(11/16)에 에코 포인트 · 세자매봉 산책로 · 자이언트 스테어웨이 폐쇄는 없습니다. 비 온 뒤라 계단이 미끄러울 수 있어요. 샌드위치를 시닉월드에서 못 먹었으면 여기 전망대 주변 벤치에서 먹어도 됩니다(근처 Silver Mist Reserve도 피크닉 장소로 알려져 있어요, 미확인).","bu":"안개가 짙으면 카툼바 시내 구경(카페 등)으로 대체하고 일몰 시간에 맞춰 전망대로 복귀.","url":"","one":"세자매봉 전망대 · 봉우리 쪽 짧은 산책","m":1,"q":"Echo Point Lookout, Echo Point Rd, Katoomba NSW 2780"},{"id":"s7","k":"카툼바 스트리트 (산책 · 카페)","n":"Katoomba Street","kind":"shop","lat":-33.7155,"lng":150.3117,"adr":"Katoomba St, Katoomba NSW 2780 (좌표는 근사치)","a":"15:55","l":"16:55","ea":29914855,"el":29914915,"tz":660,"hrs":"","cost":6,"bk":"","wt":"역에서 남쪽으로 내려가는 상점가입니다. 화요일에 쉬는 곳이 많아요(Basil Nut, Black Cockatoo Bakery, Cafe Lurline 등은 휴무로 조사됨). 카페는 오후 2~3시에 닫는 곳이 많으니 문 연 곳에서 쉬세요.","bu":"","url":"","one":"언덕길 상점가 구경하며 쉬기","m":1,"q":"Katoomba Street, Katoomba St, Katoomba NSW 2780"},{"id":"s8","k":"산위에 한식당 (이른 저녁)","n":"Sanwiye Korean Cafe/Restaurant (177 Katoomba St) - 예시","kind":"restaurant","lat":-33.7163092,"lng":150.3110074,"adr":"2/177 Katoomba St, Katoomba NSW 2780","a":"17:00","l":"17:55","ea":29914920,"el":29914975,"tz":660,"hrs":"화요일 11:30~16:00, 17:00~20:00 (식당 정보 사이트 기준. 다른 자료는 11:00~21:30. 전화 +61 405 402 130으로 확인 권장)","cost":28,"bk":"불필요 (워크인)","wt":"비빔밥 · 불고기 · 김치찌개 같은 한식으로 저녁을 먹습니다. 화요일 영업으로 조사됐지만 자료마다 시간이 달라 가기 전에 전화로 확인하세요.","bu":"문을 닫았으면 역 바로 앞 Tibet Kitchen(10 Katoomba St, 화요일 07:30~20:00, 식당 정보 사이트 기준)으로 가세요.","url":"","one":"한식으로 이른 저녁 (화요일 17:00부터) · 17:55엔 일어나기","m":1,"q":"Sanwiye Korean Cafe/Restaurant, 2/177 Katoomba St, Katoomba NSW 2780"},{"id":"s9","k":"카툼바역 (18:16 센트럴행 기차)","n":"Katoomba Stati  탈 때 기사에게 물어보세요. 에코 포인트에서 나오는 마지막 버스는 18:50으로 조회됐습니다.","Prince Henry Cliff Walk 일부와 Majestic Lookout은 낙석으로 닫혀 있습니다(2027년 4월 재검토). 경보 좌표가 루라 쪽이라 에코 포인트~시닉월드 구간은 열려 있을 것으로 보이지만 추정이니 현장 표지를 따르세요.","카툼바는 화요일에 쉬는 식당이 많습니다. 산위에 한식당은 화요일 영업으로 조사됐지만 자료마다 시간이 달라 전화 확인을 권합니다."],"rain":"비 확률은 5%입니다. 아침에 예보가 바뀌어 비나 짙은 안개가 예상되면 수요일(카툼바 9~21도, 비 5%)과 날짜를 바꾸세요. 기차는 예약이 없어 당일 아침에 정해도 됩니다. 현지에서 큰비가 오면 시닉월드 보드워크나 레일웨이가 닫힐 수 있습니다(시닉월드 안내).","tzchg":0,"tour":0,"advice":{"level":"ok","title":"가도 됩니다: 카툼바 비 확률 5%, 대체로 맑음","body":"카툼바는 6~20도예요. 도착하는 10시 반쯤 13도, 낮 2시 20도, 저녁 6시 18도(체감 14도)라 겉옷이 꼭 필요합니다.\n바람은 약하고 자외선 지수는 10(매우 높음)이라 선크림과 모자를 챙기세요.\n월요일 내내 비와 소나기가 온 뒤라 계단과 계곡 보드워크가 미끄러울 수 있어요. 이른 아침 계곡 안개는 도착할 때쯤 걷힐 가능성이 높습니다(습도 예보로 본 추정).\n기차는 예약이 없으니 아침에 예보가 나빠지면 수요일과 날짜를 바꾸면 됩니다(수요일 카툼바도 9~21도 · 비 5%).","basis":"BOM 카툼바 예보(11/16 17:35 발표) 6~20도 · 비 5%, BOM 시간별 예보(17:17 발표) 습도 06시 100% → 10시 71% · 풍속 7~15km/h, NSW 국립공원 경보(11/16) 에코 포인트 · 세자매봉 폐쇄 없음, Transport NSW 11/17 선로 공사 없음"},"alts":[{"name":"A. 에코 포인트에서 일몰까지 보기 (호텔 22:40쯤)","plan":"17:00 저녁을 먹고 686G 버스로 에코 포인트에 다시 가서 일몰(19:41)을 본 뒤 20:16 기차를 탑니다(센트럴 22:17). 에코 포인트에서 나오는 마지막 버스는 18:50으로 조회돼 일몰 뒤엔 버스가 없을 수 있어요. 역까지 걸어서 33분(2.2km)이거나 택시를 불러야 합니다.","why":"별보기까지는 기차로 어렵습니다. 완전히 어두워지는 21:18(천문박명 종료, 출발 전 조사한 계산값) 이후까지 있으면 22:16 기차(센트럴 00:23)를 타야 하고, 화요일 밤은 반달(40~50% 밝기)이 01:40까지 떠 있어 별이 덜 보여요."},{"name":"B. 일찍 돌아오기 (호텔 18:40쯤)","plan":"에코 포인트를 15:45에 나와 686번 버스로 역에 가서 16:16 기차를 탑니다(센트럴 18:17). 저녁은 시드니 시내에서 먹어요. 더 이른 15:46 기차(센트럴 17:47)를 타려면 에코 포인트에서 15:20쯤 나와야 합니다.","why":"도착 이튿날이라 피곤하면 이쪽이 편합니다."},{"name":"C. 날씨가 나빠지면 수요일과 바꾸기","plan":"수요일 카툼바 예보도 9~21도 · 비 5%입니다. 화요일 아침 예보가 나빠지면 수요일 일정(수산시장 · 공원 바비큐 · 맨리)과 통째로 맞바꾸세요. 수산시장 생선 가게 카운터는 화요일에도 07:00~16:00입니다. 수요일 기차 시각은 따로 확인하지 않았으니 전날 구글 지도나 Transport NSW 앱에서 보세요.","why":"기차 자유여행은 예약이 없어 당일 아침에 결정해도 됩니다."},{"name":"D. 가이드 투어를 이미 예약한 경우","plan":"고호주 한국어 투어를 예약해 확정을 받았다면 위 기차 일정 대신 투어를 따르세요. 10:20 하얏트 리젠시 시드니(161 Sussex St) 앞 집결, 10:30 출발, 복귀 약 22:55(추정)입니다(출발 전 조사값이니 예약 확정서의 집결 시각을 우선하세요). 확정된 투어는 날씨와 관계없이 진행됩니다.","why":"예약 여부를 몰라서 예약이 필요 없는 기차 일정을 기본으로 넣었습니다."}],"live":"11/16 수정 · 예보가 좋아 기차 자유여행으로 다시 짬 (투어 예약분은 '다른 선택지' 참고)"},{"date":"2026-11-18","key":"1118","wd":"수","ck":"syd","city":"Sydney (Glebe, Manly)","short":"수산시장 + 공원 바비큐","sub":"Woolworths에서 고기 → 수산시장 해산물 → 웬트워스 파크 바비큐 → 오후 맨리 페리 → 서큘러키 해질녘","sun":"일출 05:42 · 일몰 19:38","cost":170,"hotel":"예스 호텔 시드니 QVB","hotel_city":"시드니","summary":"수산시장에서 어머니 해산물을 사고, 고기는 따로 사서 수산시장 바로 남쪽 웬트워스 파크의 무료 공용 바비큐에서 점심을 먹는 날입니다. 새 수산시장에는 정육점이 없어서 09:00에 호텔 옆 Woolworths에서 고기와 바비큐 용품을 먼저 삽니다. 택시로 수산시장에 가서 구경하고 해산물을 산 뒤, 10~13분 걸어 공원에서 구워 먹습니다. 호텔에서 쉬었다가 오후에는 페리로 맨리에 다녀오며 맑은 하늘의 오페라하우스와 하버브리지를 보고, 미스터 웡에서 저녁을 먹은 뒤 서큘러키에서 일몰(19:38)을 봅니다. 바비큐가 안 될 때의 대안은 '다른 선택지'에 있습니다.","weather":"수요일 시드니는 15~25도, 비 확률 5%, 구름 조금이고 화재 위험 등급은 '보통(Moderate)'입니다. 시내는 오전에 바람이 약하고(시속 7~11km), 정오부터 동풍 15km, 16시 이후 북동풍 26~31km(돌풍 40km 안팎)로 강해집니다(BOM 시간별 예보). 바다 위는 이른 오후부터 동~북동풍 15~20노트(시속 28~37km)로 더 세니 페리에서는 겉옷을 입으세요(BOM 연안 예보). 자외선 지수는 10(매우 높음, BOM 일일 예보)입니다. 전면 화기 금지(Total Fire Ban) 여부는 전날 오후에 발표되므로 화요일 저녁에 rfs.nsw.gov.au에서 확인하세요. 출처: 호주 기상청(BOM) 시드니 예보(11/16 17:35 발표)와 연안 예보(11/16 16:05 발표).","stops":[{"id":"s1","k":"YEHS 호텔 시드니 QVB (출발)","n":"YEHS Hotel Sydney QVB","kind":"hotel","lat":-33.872424,"lng":151.206266,"adr":"143 York St, Sydney NSW 2000","a":"09:00","l":"09:00","ea":29915880,"el":29915880,"tz":660,"hrs":"","cost":null,"bk":"","wt":"","bu":"","url":"","one":"느긋하게 출발 · 모자와 선크림","m":1,"q":"YEHS Hotel Sydney QVB, 143 York St, Sydney NSW 2000"},{"id":"s2","k":"울워스 타운홀 (고기 · 바비큐 용품 사기)","n":"Woolworths Town Hall","kind":"shop","lat":-33.873292,"lng":151.2073887,"adr":"Cnr George St \u0026 Park St, Sydney NSW 2000","a":"09:03","l":"09:35","ea":29915883,"el":29915915,"tz":660,"hrs":"평일 06:00~자정으로 알려져 있어요(제3자 자료. 공식 페이지는 열리지 않아 확인하지 못했습니다).","cost":20,"bk":"불필요","wt":"새 수산시장에는 정육점이 없어서 고기는 여기서 삽니다. 살 것: 구이용 고기(스테이크나 양념 포장육), 집게, 식용유(스프레이나 작은 병), 소금 · 후추, 일회용 접시 · 포크 · 컵, 키친타월 · 물티슈, 쓰레기 봉투, 물과 음료(술 제외), 그리고 고기를 담을 보냉백과 얼음. 알루미늄 포일은 해산물을 구울 때 있으면 편합니다. 매장에 무엇이 있는지는 확인하지 못했으니 없는 것은 수산시장 안 The General Store(주방용품, 07:00~18:00)에서 찾아보세요.","bu":"수산시장 근처에서 사려면 Woolworths Metro Pyrmont(수산시장에서 약 0.8km · 11분, 07:00~23:00은 지도 자료라 미확인)가 있습니다. 작은 매장이라 포장육 위주예요.","url":"","one":"고기 · 집게 · 기름 · 접시 · 보냉백 사기","m":1,"q":"Woolworths Town Hall, Cnr George St \u0026 Park St, Sydney NSW 2000"},{"id":"s3","k":"시드니 수산시장 (구경 · 어머니 해산물 사기)","n":"Sydney Fish Market","kind":"shop","lat":-33.8743796,"lng":151.1906679,"adr":"1 Bridge Rd, Glebe NSW 2037","a":"09:55","l":"11:15","ea":29915935,"el":29916015,"tz":660,"hrs":"건물 매일 07:00~22:00. 생선 가게 카운터는 수요일 07:00~16:00 (수산시장 공식 매장 안내(11/16 확인))","cost":35,"bk":"불필요","wt":"바로 먹을 수 있는 것을 사려면 Peter's(굴 바, 가리비 구이, 사시미, 조리된 해산물), Nicholas Seafood(랍스터 · 킹크랩 · 전복 · 사시미), Christie's(조리 해산물, 마감은 자료마다 21:00 또는 22:00)가 있습니다. 공원에서 구워 먹을 것은 Claudio's(바로 조리할 수 있게 손질한 품목), Musumeci, GetFish(새우, 사시미용 필레)에서 사고 얼음을 넣어 달라고 하세요. 가격과 양념 꼬치 같은 품목은 확인하지 못했습니다.","bu":"바비큐가 어려우면 여기 물가 좌석에서 먹으면 됩니다. Get Sashimi(11:00~21:00), Peter's, Christie's는 그 자리에서 먹을 수 있어요.","url":"https://www.sydneyfishmarket.com.au/","one":"생선 가게 구경하고 해산물 한 가지 사기","m":1,"q":"Sydney Fish Market, 1 Bridge Rd, Glebe NSW 2037"},{"id":"s4","k":"웬트워스 파크 공용 바비큐 (점심)","n":"Wentworth Park (public barbecues)","kind":"restaurant","lat":-33.8758,"lng":151.1954,"adr":"Wentworth Park Rd, Glebe NSW 2037 (좌표는 지도에 표시된 북동쪽 바비큐, 근사치)","a":"11:27","l":"13:10","ea":29916027,"el":29916130,"tz":660,"hrs":"무료, 예약 없음, 먼저 온 순서 (시드니 시 Wentworth Park 페이지(11/16 원문 확인)). 운영 시간과 바비큐 대수는 공식 페이지에 없어요.","cost":0,"bk":"불필요 (예약 없음, 선착순)","wt":"지도에는 공원 북동쪽(수산시장에서 가장 가까운 쪽)과 거기서 남쪽으로 약 350m 지점에 전기 바비큐가 표시돼 있습니다(OpenStreetMap, 마지막 확인 2025년 6월). 지금 작동하는지는 확인하지 못했으니 도착하면 먼저 켜 보세요. 공용 전기 바비큐는 보통 버튼을 누르면 철판이 달궈지고 일정 시간이 지나면 꺼져서 다시 누르는 방식입니다(이 공원 기기의 방식은 미확인). 철판에 기름을 살짝 두르고 굽고, 다 쓰면 키친타월로 닦고 쓰레기는 가져갑니다. 화장실은 운동장 옆에 있고 식수대가 있어요. 개는 바비큐 구역에 못 들어옵니다. 술은 가져가지 마세요.","bu":"바비큐가 고장이거나 자리가 없으면 수산시장으로 돌아가 물가 좌석에서 먹거나, Pirrama Park(수산시장에서 북쪽으로 약 18분, 바비큐 · 화장실 · 카페)로 가세요.","url":"https://www.cityofsydney.nsw.gov.au/parks/wentworth-park","one":"무료 바비큐에 고기와 해산물 구워 점심","m":1,"q":"Wentworth Park, Wentworth Park Rd, Glebe NSW 2037"},{"id":"s5","k":"YEHS 호텔 (짐 두고 휴식)","n":"YEHS Hotel Sydney QVB","kind":"hotel","lat":-33.872424,"lng":151.206266,"adr":"143 York St, Sydney NSW 2000","a":"13:30","l":"14:45","ea":29916150,"el":29916225,"tz":660,"hrs":"","cost":null,"bk":"","wt":"","bu":"","url":"","one":"집게와 보냉백 두고 쉬었다가 14:45 출발","m":1,"q":"YEHS Hotel Sydney QVB, 143 York St, Sydney NSW 2000"},{"id":"s6","k":"서큘러키 3번 부두 (맨리행 페리)","n":"Circular Quay Wharf 3 (Manly ferry)","kind":"pier","lat":-33.8614,"lng":151.2115,"adr":"Circular Quay, Sydney NSW 2000 (3번 부두는 맨리 페리 전용)","a":"15:08","l":"15:20","ea":29916248,"el":29916260,"tz":660,"hrs":"F1 맨리 페리는 대략 20~30분 간격입니다(공식 시간표 확인 실패). 부두 번호는 전광판에서 확인하세요(보통 3번).","cost":null,"bk":"불필요 (Opal 또는 컨택트리스 카드 탭)","wt":"Opal 카드나 컨택트리스 카드를 한 사람당 하나씩 준비해 개찰구에서 탭온 합니다. 올라갈 때 윗층 야외석 오른쪽에 앉으면 오페라하우스와 하버브리지가 잘 보입니다.","bu":"F1이 지연되거나 결항되면 Manly Fast Ferry(별도 운영사, 약 20분 소요, 다른 부두에서 출발)를 이용합니다. Opal 사용 여부는 운영사 페이지에서 확인하세요.","url":"https://transportnsw.info/routes/details/sydney-ferries-network/manly/F1","one":"","m":0,"q":"Circular Quay Wharf 3, Circular Quay, Sydney NSW 2000"},{"id":"s7","k":"맨리 워프 (도착)","n":"Manly Wharf","kind":"pier","lat":-33.7999,"lng":151.2846,"adr":"East Esplanade, Manly NSW 2095","a":"15:50","l":"15:55","ea":29916290,"el":29916295,"tz":660,"hrs":"페리 운항 시간 내 상시","cost":null,"bk":"불필요","wt":"하선 후 탭오프 합니다.","bu":"","url":"","one":"","m":0,"q":"Manly Wharf, East Esplanade, Manly NSW 2095"},{"id":"s8","k":"더 코르소와 맨리 비치","n":"The Corso and Manly Beach","kind":"sight","lat":-33.7977,"lng":151.2873,"adr":"The Corso, Manly NSW 2095","a":"16:01","l":"17:00","ea":29916301,"el":29916360,"tz":660,"hrs":"야외, 상시","cost":null,"bk":"불필요","wt":"기념품 가게와 카페가 있는 보행자 거리 코르소를 걸어 맨리 비치까지 갑니다. 파도와 서퍼를 보고 사진을 찍습니다.","bu":"","url":"","one":"코르소 거리 걸어 맨리 비치 산책","m":1,"q":"The Corso and Manly Beach, The Corso, Manly NSW 2095"},{"id":"s9","k":"맨리 워프 (귀환 페리 승선)","n":"Manly Wharf (return ferry)","kind":"pier","lat":-33.7999,"lng":151.2846,"adr":"East Esplanade, Manly NSW 2095","a":"17:06","l":"17:15","ea":29916366,"el":29916375,"tz":660,"hrs":"F1 심야까지 운항 (공식 시간표 미확인)","cost":null,"bk":"불필요","wt":"탭온 후 윗층 야외석에 앉습니다. 오후엔 북동풍이 강하니 겉옷을 입으세요. 서큘러키에 가까워지면 왼쪽으로 오페라하우스, 앞쪽으로 하버브리지가 보입니다.","bu":"놓치면 다음 편(약 20~30분 뒤)을 탑니다.","url":"","one":"","m":0,"q":"Manly Wharf, East Esplanade, Manly NSW 2095"},{"id":"s10","k":"서큘러키 3번 부두 (도착)","n":"Circular Quay Wharf 3","kind":"pier","lat":-33.8614,"lng":151.2115,"adr":"Circular Quay, Sydney NSW 2000","a":"17:45","l":"17:48","ea":29916405,"el":29916408,"tz":660,"hrs":"페리 운항 시간 내","cost":null,"bk":"불필요","wt":"하선 후 탭오프 하고 저녁 식당으로 걸어갑니다.","bu":"","url":"","one":"","m":0,"q":"Circular Quay Wharf 3, Circular Quay, Sydney NSW 2000"},{"id":"s11","k":"미스터 웡 (광둥식 저녁)","n":"Mr Wong","kind":"restaurant","lat":-33.8641,"lng":151.2083,"adr":"3 Bridge Lane, Sydney NSW 2000","a":"18:00","l":"19:15","ea":29916420,"el":29916495,"tz":660,"hrs":"수요일 저녁 17:30부터(제3자 자료 기준: OpenTable 목록, Gourmet Traveller). 마감은 자료마다 22:00~23:00으로 다릅니다.","cost":75,"bk":"예약 불필요(워크인). 6명 미만은 저녁 예약을 받지 않는다는 자료가 있어요(공식 페이지 확인 실패). 18시엔 대기가 있을 수 있습니다.","wt":"점심을 바비큐로 든든히 먹었으니 딤섬과 요리 두세 가지만 가볍게 나눠 먹어도 됩니다. 1인 A$75는 넉넉히 먹을 때의 추정이에요.","bu":"대기가 길면 서큘러키의 Cafe Sydney(커스텀스 하우스 옥상, 화~목 12:00~22:00, 제3자 자료)나 호텔 근처 Chat Thai(헤이마켓)로 가세요.","url":"https://merivale.com/venues/mrwong","one":"광둥식 저녁 · 예약 없이 줄 서기","m":1,"q":"Mr Wong, 3 Bridge Lane, Sydney NSW 2000"},{"id":"s12","k":"서큘러키 · 오페라하우스 해질녘","n":"Sydney Opera House","kind":"sight","lat":-33.8572,"lng":151.2151,"adr":"Bennelong Point, Sydney NSW 2000","a":"19:31","l":"20:10","ea":29916511,"el":29916550,"tz":660,"hrs":"야외는 항상 열려 있어요.","cost":0,"bk":"","wt":"첫날 비로 못 본 하버 일몰과 야경을 봅니다. 일몰은 19:38이고 20:05쯤 어둑해져요. 저녁엔 북동풍이 시속 30km 안팎(돌풍 40km)이라 겉옷이 필요합니다.","bu":"","url":"","one":"일몰 19:38 · 하버브리지와 오페라하우스 야경","m":1,"q":"Sydney Opera House, Bennelong Point, Sydney NSW 2000"},{"id ","de":29916295,"ae":29916301},{"i":7,"j":8,"mode":"walk","line":"","board":"","alight":"","dep":"17:00","arr":"17:06","dur":6,"cost":null,"notes":"","de":29916360,"ae":29916366},{"i":8,"j":9,"mode":"ferry","line":"Manly Ferry F1","board":"Manly Wharf","alight":"Circular Quay Wharf 3","dep":"17:15","arr":"17:45","dur":30,"cost":null,"notes":"F1 맨리 페리는 대략 20~30분 간격, 약 30분 걸립니다. 이 표의 출발 시각은 추정이에요(공식 시간표 페이지가 열리지 않아 확인 실패). 부두 전광판이나 구글 지도에서 실제 시각을 보고 맞추세요. Manly Fast Ferry는 18~20분. 요금은 편도 약 A$9로 알려져 있고(추정) 하루 상한에 포함됩니다.","de":29916375,"ae":29916405},{"i":9,"j":10,"mode":"walk","line":"","board":"","alight":"","dep":"17:48","arr":"18:00","dur":12,"cost":null,"notes":"","de":29916408,"ae":29916420},{"i":10,"j":11,"mode":"walk","line":"","board":"","alight":"","dep":"19:15","arr":"19:31","dur":16,"cost":null,"notes":"약 1.2km(지도 경로 계산).","de":29916495,"ae":29916511},{"i":11,"j":12,"mode":"walk","line":"","board":"","alight":"","dep":"20:10","arr":"20:40","dur":30,"cost":null,"notes":"약 2.2km(지도 경로 계산). 서큘러키역에서 기차로 타운홀역까지 2정거장 타도 됩니다.","de":29916550,"ae":29916580}],"bookings":[{"t":"고기 · 집게 · 기름 · 접시는 Woolworths에서 먼저 (수산시장엔 정육점 없음)","act":1},{"t":"화요일 저녁에 전면 화기 금지(Total Fire Ban) 여부 확인","act":1},{"t":"술은 가져가지 않기 (음주 금지 구역 목록에 있음, 최종 채택 미확인)","act":1},{"t":"선크림 · 모자 (자외선 지수 10), 오후 페리용 겉옷","act":1}],"tips":["바비큐 준비물: 집게, 식용유, 소금 · 후추, 접시 · 포크 · 컵, 키친타월 · 물티슈, 쓰레기 봉투, 물. 지도 자료로는 전기 철판식으로 보여 석쇠는 없을 가능성이 높습니다. 쓰고 나서 닦아 두는 것이 예의예요. 음식을 두고 자리를 비우면 갈매기와 따오기가 가져갈 수 있어요.","웬트워스 파크 바비큐는 무료이고 예약이 없습니다(시드니 시 Wentworth Park 페이지(11/16 원문 확인)). 대수, 전기식 여부, 운영 시간은 공식 페이지에 없고, 전기식이라는 것은 지도 자료 기준이에요.","새 수산시장에는 정육점이 없습니다. 공식 매장 안내의 38개 매장을 모두 확인했는데 고기를 파는 곳이 없었어요(시장 FAQ에 정육점 언급이 남아 있지만 옛 문구로 보입니다).","전면 화기 금지(Total Fire Ban) 날에는 공원에 설치된 전기 바비큐만 허용된다고 알려져 있습니다(2차 자료). 수요일은 화재 위험 '보통'이라 금지 가능성은 낮지만, 화요일 저녁 rfs.nsw.gov.au/fdr에서 확인하세요(조사 때 사이트가 열리지 않아 확인하지 못했습니다).","해산물은 가게에서 얼음을 넣어 달라고 하면 됩니다(수산시장 FAQ). 고기는 Woolworths에서 보냉백과 얼음을 같이 사서 넣어 두세요. 장 보고 굽기까지 2시간쯤 걸립니다.","그늘이 적을 수 있어요(지도 자료에 바비큐는 지붕 없음으로 표시). 자외선 지수 10이라 모자와 선크림이 필요합니다.","페리 시각은 확인하지 못했습니다. 부두 전광판이나 구글 지도 길찾기로 실제 출발 시각을 확인하세요. 교통비는 각자 컨택리스 카드로 탭하면 월~목 하루 상한 A$19.30이 적용됩니다(Transport NSW 성인 요금 페이지, 11/16 확인).","내일(11/19)은 10:00 체크아웃입니다. 돌아와서 짐을 싸세요."],"rain":"비 확률은 5%입니다. 비가 오거나 전면 화기 금지가 내려지거나 바비큐가 작동하지 않으면, 수산시장 안에서 먹고(Get Sashimi, Peter's, Christie's, 물가 좌석) 고기는 호텔로 가져가세요. 오후 페리는 비가 와도 대부분 운행하지만 강풍과 높은 파도에서는 결항할 수 있습니다.","tzchg":0,"tour":0,"advice":{"level":"ok","title":"가능합니다: 수산시장 장보기 + 웬트워스 파크 무료 바비큐","body":"수산시장 바로 남쪽 웬트워스 파크에 무료 공용 바비큐가 있고, 예약 없이 먼저 온 사람이 씁니다.\n새 수산시장에는 정육점이 없어요. 고기와 집게 · 기름 · 접시는 호텔 옆 Woolworths에서 먼저 사 가세요.\n날씨는 15~25도, 비 5%, 화재 위험 '보통'이라 바비큐하기 좋습니다. 다만 바비큐가 지금 작동하는지는 원격으로 확인하지 못했어요. 안 되면 수산시장 물가 좌석에서 먹는 대안이 있습니다.\n술은 가져가지 마세요. 웬트워스 파크는 24시간 음주 금지 구역 목록에 올라 있습니다(최종 채택 여부는 미확인).","basis":"시드니 시 Wentworth Park 페이지(11/16 원문 확인) 'Barbecues included · Free to use, no booking required', 수산시장 공식 매장 안내(11/16 확인)에 정육점 없음(38개 매장) · 생선 카운터 수요일 07:00~16:00, BOM 시드니 예보(11/16 17:35 발표) 15~25도 · 비 5% · 화재 위험 Moderate"},"alts":[{"name":"A. 바비큐가 고장이거나 자리가 없을 때","plan":"수산시장으로 돌아가(10~13분) 물가 좌석에서 먹습니다. 해산물은 그 자리에서 먹고 고기는 호텔 냉장고에 넣어 두세요(냉장고 유무는 확인하지 못했습니다). 다른 바비큐는 Pirrama Park(수산시장에서 북쪽으로 약 18분, 바비큐 · 화장실 · 카페)와 Blackwattle Bay Park(약 19분, 지도상 전기 바비큐 2026년 9월 확인)에 있습니다.","why":"웬트워스 파크 바비큐의 현재 작동 여부와 공원 안 Sydney Water 하수 공사 구역 위치는 확인하지 못했습니다. 다른 공원 정보는 시드니 시 공원 페이지와 지도 자료 기준입니다."},{"name":"B. 고기를 수산시장 근처에서 사기","plan":"수산시장을 먼저 보고, Woolworths Metro Pyrmont(약 0.8km · 11분)에서 포장육과 용품을 산 뒤 공원으로 갑니다. 더 좋은 고기는 Broadway 쇼핑센터의 Harris Farm(정육 코너가 있다고 알려짐)인데 약 1.5km 돌아가야 해요.","why":"두 곳 모두 영업시간과 품목은 지도 · 제3자 자료라 확인하지 못했습니다. 그래서 호텔 옆 큰 매장에서 먼저 사는 쪽을 기본으로 했어요."},{"name":"C. 오후에 쉬고 싶을 때","plan":"맨리를 빼고 호텔에서 17:15까지 쉽니다. 17:30쯤 미스터 웡에 가서 저녁을 먹고(문 여는 시간이라 대기가 짧을 것으로 예상합니다), 서큘러키에서 일몰(19:38)을 봅니다.","why":"전날 블루마운틴을 다녀와 피곤할 수 있어서 넣었습니다."}],"live":"11/16 저녁 수정 · 수산시장 장보기와 공원 바비큐 점심을 넣음"},{"date":"2026-11-19","key":"1119","wd":"목","ck":"gc","city":"Sydney → Gold Coast (Surfers Paradise)","short":"시드니 → 골드코스트 )과 숙소 Q1으로 변경"},{"date":"2026-11-20","key":"1120","wd":"금","ck":"gc","city":"Gold Coast","short":"커럼빈 · 벌리 헤드","sub":"커럼빈 야생동물 보호구역 + 벌리 헤드 국립공원 + 벌리 선셋 디너","sun":"일출 04:43 · 일몰 18:20","cost":156,"hotel":"Q1 리조트 앤 스파","hotel_city":"골드코스트","summary":"숙소 Q1 바로 앞 Surfers Paradise 역에서 G:link 경전철로 벌리 헤즈(Burleigh Heads)까지 이동한 뒤 700번 버스로 남쪽 끝 커럼빈 야생동물 보호구역(09:00 오픈)에 갑니다. 오전에 쇼와 키퍼 토크를 보고, 13:00경 버스로 벌리 헤즈 마을로 돌아와 Justin Lane에서 점심을 먹습니다. 오후에는 700번 버스로 한 정거장 남쪽 국립공원 입구(Jellurgal 문화센터 앞)로 이동해 Ocean View Track과 Rainforest Circuit를 거쳐 툼건(Tumgun) 전망대에 오르고, 북쪽 Goodwin Terrace로 내려와 벌리 비치와 The Pav(Burleigh Pavilion)에서 일몰 저녁을 먹은 뒤 G:link로 숙소에 돌아옵니다. 2026-08-09부터 G:link가 Burleigh Heads까지 연장 개통했고, 700번 버스는 Stockland Burleigh Heads~Tweed Heads 구간만 운행하므로 'G:link 직행 + 700번' 조합입니다. Burleigh Heads 역과 700번 버스 시각은 출발 전 Translink 시간표(GTFS, 11/20 금요일 운행표)로 확인했고, Surfers Paradise 역 시각은 거기서 약 5분을 역산한 추정입니다.","weather":"금요일 골드코스트는 18~27도, 비 확률 20%, 구름 조금입니다. 출처: 호주 기상청(BOM) 예보, 11/16 발표. 나흘 뒤 예보라 전날 다시 확인하세요. 자외선이 매우 강하니 선크림과 모자가 필요합니다.","stops":[{"id":"s1","k":"Q1 리조트 앤 스파 (출발)","n":"Q1 Resort \u0026 Spa","kind":"hotel","lat":-28.0063488,"lng":153.4296317,"adr":"9 Hamilton Ave, Surfers Paradise QLD 4217","a":"07:55","l":"07:55","ea":29918755,"el":29918755,"tz":600,"hrs":"","cost":null,"bk":"","wt":"가벼운 아침 식사 후 출발합니다. 물, 선크림, 모자, 접이식 우비를 챙기세요. 저녁 식당 복장 규정을 고려해 샌들이나 슬리퍼 대신 운동화를 신으세요.","bu":"","url":"","one":"가볍게 먹고 07:55 출발","m":1,"q":"Q1 Resort \u0026 Spa, 9 Hamilton Ave, Surfers Paradise QLD 4217"},{"id":"s2","k":"서퍼스 파라다이스 역 (벌리 헤즈 방면)","n":"Surfers Paradise station (G:link)","kind":"station","lat":-28.0061229,"lng":153.4290694,"adr":"Surfers Paradise Blvd, Surfers Paradise QLD 4217","a":"07:57","l":"08:05","ea":29918757,"el":29918765,"tz":600,"hrs":"","cost":null,"bk":"","wt":"컨택리스 카드로 탭하고 'Burleigh Heads' 행 G:link를 탑니다. 전광판으로 방향을 확인하세요.","bu":"","url":"","one":"","m":0,"q":"Surfers Paradise station, Surfers Paradise Blvd, Surfers Paradise QLD 4217"},{"id":"s3","k":"벌리 헤즈 역 (2번 승강장 / 버스 정류장 B  캥거루/웜뱃/코알라는 자유 관람. 로리키트 먹이주기는 08:00과 16:00 두 번이라 이 일정과는 시간이 안 맞습니다. 코알라: 퀸즐랜드는 코알라 안기를 주 차원에서 금지하지 않으며(NSW·빅토리아와 다름), 커럼빈은 공식적으로 '코알라 사진 체험' 콤보(Grazy Arvo With Koalas 등 1인 A$129~, 입장 포함)를 판매합니다. 동물복지 단체는 이런 체험을 비판하므로 선택은 가족이 판단하세요. 점심은 마을에서 먹으니 원내에서는 커피/간식 정도만 드세요. 쇼 시각은 변동될 수 있어 입구 안내판으로 재확인하세요.","bu":"비가 오면 지붕 있는 구역(코알라 너서리, 파충류관, Lost Valley 에비어리) 위주로 관람. 쇼는 우천 시 취소될 수 있음.","url":"https://currumbinsanctuary.com.au","one":"코알라와 동물 쇼 관람 (쇼 시간 확인)","m":1,"q":"Currumbin Wildlife Sanctuary, 28 Tomewin St, Currumbin QLD 4223"},{"id":"s6","k":"커럼빈 보호구역 버스 정류장 (북행)","n":"Currumbin Wildlife Sanctuary bus stop (northbound, stop 300024)","kind":"station","lat":-28.135282,"lng":153.48913,"adr":"Teemangum St, Currumbin QLD 4223","a":"12:55","l":"13:03","ea":29919055,"el":29919063,"tz":600,"hrs":"700번 West Burleigh 행 평일 (GTFS 확인: 12:33, 12:45, 12:51, 13:03, 13:15, 13:21 출발)","cost":null,"bk":"","wt":"반드시 북행(West Burleigh/벌리 헤즈 방면) 정류장에서 탑니다. 남행(300248)과 길 반대편입니다.","bu":"13:03을 놓치면 13:15 / 13:21 편","url":"","one":"","m":0,"q":"Currumbin Wildlife Sanctuary bus stop, Teemangum St, Currumbin QLD 4223"},{"id":"s7","k":"벌리 헤즈 역 (버스 정류장 A)","n":"Burleigh Heads station (bus stop A)","kind":"station","lat":-28.089975,"lng":153.452769,"adr":"Gold Coast Hwy, Burleigh Heads QLD 4220","a":"13:20","l":"13:20","ea":29919080,"el":29919080,"tz":600,"hrs":"버스/G:link 환승 거점","cost":null,"bk":"","wt":"하차 후 Gold Coast Hwy 쪽으로 도보 약 3~4분이면 점심 식당에 도착합니다.","bu":"","url":"","one":"","m":0,"q":"Burleigh Heads station, Gold Coast Hwy, Burleigh Heads QLD 4220"},{"id":"s8","k":"저스틴 레인 (피자·파스타)","n":"Justin Lane Burleigh Heads","kind":"restaurant","lat":-28.0887644,"lng":153.4515423,"adr":"1708-1710 Gold Coast Hwy, Burleigh Heads QLD 4220","a":"13:24","l":"14:20","ea":29919084,"el":29919140,"tz":600,"hrs":"금요일 12:00~late (공식 사이트: 수~일 12pm-late, 월·화는 5pm-late). 워크인 환영, 예약 권장","cost":35,"bk":"불필요(워크인 환영), 단 공식 사이트가 예약을 권장하므로 확실히 하려면 온라인 예약 https://justinlane.com.au/home/","wt":"3명이 사워도우 피자 2판 + 핸드메이드 파스타 1접시 요: 2026-08-09 G:link 벌리 헤즈 연장 개통(공식 프로젝트 페이지 확인), 700번은 Stockland Burleigh Heads~Tweed Heads 구간 운행(GTFS 확인). 구글맵/구버전 안내는 Broadbeach South 환승을 안내할 수 있으니 'G:link 직행 후 700번' 방식을 따르세요. 출발 전날 Translink 앱/Journey Planner로 한 번 더 확인하세요.","시각표는 Translink 공식 GTFS(유효기간 2026-10-22~2026-12-21)의 11/20 금요일 평일 운행에서 직접 대조했습니다(L1, 700번 모든 시각 일치).","요금은 SEQ 전 노선 균일 50센트(영구화, 에어트레인 제외)입니다. 같은 카드로 탭 온/탭 오프 하고, 3명 각자 카드(비접촉 카드 또는 go card)가 필요합니다.","커럼빈 입장권은 공식 'From A$50'(온라인 수수료 1.75%)이지만 2026년 가이드는 성인 A$65로 소개합니다. 예매 화면에서 확정하세요. 결제는 카드(현금 불가 안내).","코알라: 퀸즐랜드는 코알라 안기를 주 차원에서 금지하지 않으며 커럼빈은 코알라 사진 체험 콤보(A$129~)를 판매합니다. 이날 가능 여부와 방식은 예약 사이트에서 확인하세요.","로리키트 무료 먹이주기(08:00/16:00)는 이 동선과 맞지 않습니다.","금요일 밤 참고: 커럼빈 Astra Lumina 야간 산책은 금·토 운영(From A$30)입니다. 이 일정에는 넣지 않았지만 원하면 별도 예약으로 가능합니다.","The Pav는 금요일 저녁 예약이 안 되고 붐빕니다. 복장 규정(smart casual, 슬리퍼·민소매 불가)을 지키고 17:15 전에 입장하세요. 확실한 좌석을 원하면 The Tropic을 예약하세요(07 5240 9869).","국립공원 Ocean View Track은 2025년 9월 산불 피해와 11월 제초 작업으로 폐쇄된 적이 있고, 악천후 전후로 낙석 위험으로 임시 폐쇄될 수 있습니다. 2026년 현황은 확인하지 못했으니 Queensland Parks park alerts를 확인하세요. 출입금지 보울더 필드(Cannon Rock 등)는 들어가지 마세요.","남쪽 입구 좌표는 Jellurgal 문화센터(1711 Gold Coast Hwy)와 버스정류장 300177이 같은 위치임을 확인했습니다. 툼건 전망대 좌표는 지도 데이터(OSM 기반)로 확인했습니다.","11월 퀸즐랜드는 자외선이 매우 강하니 선크림, 모자, 물 필수. 오후에는 소나기/뇌우가 잦은 편이라 접이식 우산이나 우비를 챙기세요."],"rain":"비가 오면: (1) 커럼빈 보호구역은 그대로 가되 코알라 너서리, 파충류관, Lost Valley 에비어리처럼 지붕 있는 구역 위주로 관람하고 야외 쇼는 취소될 수 있으니 입구에서 확인하세요. (2) 오후 벌리 헤드 국립공원 걷기는 비 오는 날 미끄럽고 낙석 위험(Ocean View Track 임시 폐쇄 가능)이 있으니 생략하고, 점심을 Justin Lane에서 느긋하게 먹은 뒤 700번 버스 종점 Stockland Burleigh Heads(쇼핑몰)에서 실내 시간을 보내거나 The Pav/The Tropic 실내석에서 일찍 저녁을 먹습니다(The Tropic은 예약). (3) 일몰 구경은 포기하고 18:50 G:link로 일찍 복귀해도 됩니다. 뇌우 경보 시에는 해변과 전망대는 피하세요.","tzchg":0,"tour":0,"advice":null,"alts":[],"live":"11/16 저녁 수정 · 숙소를 Q1으로 변경 (출발 · 도착 역이 Surfers Paradise)"},{"date":"2026-11-21","key":"1121","wd":"토","ck":"bne","city":"Gold Coast → Brisbane","short":"골드코스트 → 브리즈번","sub":"사우스뱅크 · CityCat · 하워드 스미스 워브스 저녁 · 캥거루 포인트 야경","sun":"일출 04:46 · 일몰 18:21","cost":143,"hote ,"mode":"walk","line":"","board":"","alight":"","dep":"20:51","arr":"21:06","dur":15,"cost":null,"notes":"Eagle St → Margaret St → George St, 약 1.1km(OSM 보행 경로 14-15분). 밝은 큰길 이용.","de":29920971,"ae":29920986}],"bookings":[{"t":"Stanley (Howard Smith Wharves) 토요일 18:00, 3명 - 필수 수준 예약: https://howardsmithwharves.com/eat-drink/stanley-restaurant/ , 전화 (07) 3558 9418","act":1},{"t":"Great Southern Hotel Brisbane - 11/21 12:20경 짐 보관 및 얼리 체크인(AUD 30 가능성) 사전 확인(전화/이메일)","act":1},{"t":"Harajuku Gyoza - 점심 예약은 선택(전화 07 3073 9562)","act":1},{"t":"GOMA Jim Henson 전시 - 이번 일정에서는 선택(비 오는 날 대체용), 시간지정 티켓 사전 예매 필요","act":1}],"tips":["교통요금: Translink 공식 페이지 기준 전 구간 50센트 균일요금(Airtrain 제외, 2024년 시범 후 영구화). go card/컨택트리스 카드 모두 가능. 탑승 시 태그 온, 하차 시 태그 오프를 꼭 하기. 환승은 한 여정으로 합산될 수 있어 하루 교통비는 최대 약 AUD 2.5(상한 추정).","아침 이동의 핵심은 Cypress Avenue 10:09 G:link → Helensvale 10:50 열차 환승(여유 약 8분). 불안하면 09:59 G:link(Helensvale 10:31 도착)로 앞당기면 19분 여유. 놓치면 11:20 열차(Central 12:29)로 약 30분 지연되므로 이 경우 점심을 Harajuku Gyoza 대신 마켓에서 간단히.","Gold Coast선 토요일 운행간격이 30분이므로 열차를 놓치면 영향이 큼. 출발 전날 Translink 앱/사이트에서 트랙워크(선로공사)와 Queensland Rail 노조 쟁의행위(2026년 9월 공지에서 언급) 영향을 한 번 더 확인할 것(공개 GTFS는 계획 시간표 기준이며 실시간 변경 미반영). 11/21 트랙워크 공지는 현재 확인되지 않음.","2026년 8월부터 SEQ 기차/트램 노선에 번호가 병기됨(시간표·정차 패턴 변경 없음). 앱에서 Gold Coast line이 새 번호로 표시될 수 있으니 'Varsity Lakes ↔ Domestic Airport/Brisbane' 방향으로 확인.","퀸즐랜드는 서머타임이 없어 시드니보다 1시간 늦음. 시계/알람을 11/19 이동 후 AEST로 맞출 것.","캐리어는 Great Southern Hotel에 맡기기 전 호텔에 미리 메일/전화로 짐 보관 및 얼리 체크인(제3자 사이트 기준 AUD 30, 보장 안 됨) 가능 여부 확인. Central역에서 호텔까지는 약 1.2km로 캐리어를 끌고 약 18분 소요.","Streets Beach는 수영복·수건을 챙기면 입수 가능(무료, 라이프가드 순찰). 공식 안내에서 Streets Beach와 Boat Pool은 개방, Aquativity는 임시 폐쇄 표시가 있었음.","GOMA는 일반 상설전 입장 무료이나 'Make, Believe, Magic: The Worlds of The Jim Henson Company'(2026-09-12 ~ 2027-04-18)는 유료 시간지정 티켓(가격 미확인, 마지막 입장 16:00). 이번 일정에는 넣지 않았고, 비 오는 날 대체로 고려. 사우스뱅크 퀸즐랜드 박물관은 현재 'Queensland Museum Kurilpa'로 표기.","저녁 Stanley는 토요일이므로 예약 필수에 가까움. 예약이 안 되면 같은 HSW 내 Fellini's Trattoria(워크인, 수-일 12:00-22:00) 또는 Felons Barrel Hall로 즉시 변경.","페리는 강풍/뇌우 시 운휴 가능(2026년 8월 브리즈번 시의회 페리 노조 업무정지 사례 있음 - 11월 공지는 확인되지 않음). 야간 귀환이 막히면 Uber/택시로 HSW → 호텔(약 AUD 15-20 추정, 신뢰도 낮음) 이용.","CityCat 승선 시 진행방향 왼쪽 창가가 시내(CBD) 쪽 풍경(이전 안내의 '오른쪽'은 오류였음).","캥거루 포인트 야경은 번화한 강변 구간(Holman St 터미널~Captain Burke Park)에서만 짧게 머물고 21:00 전에 복귀. 스토리 브리지 조명 색은 날마다 바뀜.","예상 1인 비용: 점심 35 + 마켓 간식 8 + 퍼시벌스 음료 12 + 저녁 85 + 교통 약 2.5 = 약 AUD 143(식비는 추정치, 신뢰도 낮음)."],"rain":"오전 이동은 실내(G:link·열차)라 영향 없음. 오후에 비가 오면 (1) 점심 후 Collective Markets/Streets Beach를 건너뛰고 GOMA(일반 상설전 무료, 개관 10:00-17:00)와 Queensland Museum Kurilpa(9:30-17:00, 일반 입장 무료, SparkLab 유료)로 대체하고 각각 약 60-90분. 두 곳은 사우스뱅크 문화 센터 구역에서 도보 5분 거리이며 호텔로 복귀 시 Victoria Bridge 경유 Queen St Mall 실내 아케이드를 활용. (2) 17:07 CityCat은 강풍·뇌우 시 운휴될 수 있으므로 운행 여부를 Translink 앱에서 확인하고, 불가하면 Uber/택시(약 AUD 15-20)로 HSW 이동 후 Stanley 18:00 저녁(실내석)은 그대로 유지. (3) 야경은 Stanley 식후 HSW 보드워크(지붕 있는 구간)에서 스토리 브리지만 감상하고 캥거루 포인트 이동은 생략, 귀환은 19:27/19:55 페리 또는 택시.","tzchg":0,"tour":0,"advice":null,"alts":[],"live":""},{"date":"2026-11-22","key":"1122","wd":"일","ck":"bne","city":"Brisbane / Moreton Island (Tangalooma)","short":"모턴 아일랜드 당일치기","sub":"탕갈루마 난파선 스노클링","sun":"일출 04:46 · 일몰 18:22","cost":298,"hotel":"그레이트 서던 호텔 브리즈번","hotel_city":"브리즈번","summary":"호텔 근처 지미스 온 더 몰에서 아침을 먹고 Royal on the Park 앞에서 08:35에 탕갈루마 셔틀버스(STA)를 타고(08:35 픽업이 셔틀의 마지막 출발 시간) Holt Street Wharf로 이동합니다. 10:00 카타마란을 타고 75분 걸려 11:15 탕갈루마에 도착하고, 13:00 난파선(Wrecks) 가이드 스노클링(전체 90분, 실제 물속 약 30~35분)을 합니다. 점심은 패키지에 포함된 A$25 바우처로 리조트 식당에서 해결하고 오후에는 해변과 수영장에서 쉽니다. 16:00 배로 돌아와 17:30 셔틀을 타고 시내로 돌아오며(Royal on the Park 도착은 정차 순서에 따라 18:05~18:30 예상), CBD의 Corbett \u0026 Claude에서 피자로 저녁을 먹고 호텔로 걸어 돌아옵니다. 샌드 토보건(모래썰매)은 스노클링과 같은 시간대(13:00~13:15)라 10:00 배로는 둘 다 할 수 없습니다. 둘 다 하려면 07:30 배를 타야 하며 팁에 적어 두었습니다.","weather":"11월 하순 브리즈번은 늦봄입니다. 평균 최고 약 28도, 최저 약 18도이고 오후에 소나기나 뇌우가 올 수 있습니다. 자외선 지수가 매우 높습니다. 이 날짜의 예보는 아직 나오지 않아 계절 평균으로 적었습니다. 탕갈루마 투어는 날씨와 파도에 따라 취소될 수 있습니다. 출발 전날(11/21)에 예보를 보고, 탕갈루마의 예약 재확인(출발 24시간 전까지 확인 안내)을 꼭 하세요. 시간대는 퀸즐랜드 AEST(UTC+10)이며 서머타임이 없습니다(시드니와 1시간 차이).","stops":[{"id":"s1","k":"그레이트 서던 호텔 브리즈번","n":"Great Southern Hotel Brisbane","kind":"hotel","lat":-27.47284,"lng":153.02539,"adr":"103 George St, Brisbane City QLD 4000","a":"07:00","l":"07:10","ea":29921580,"el":29921590,"tz":600,"hrs":"체크인 14:00 / 체크아웃 10:00 (11/24). 이 날은 3박 중 2일차라 짐은 두고 가볍게 출발","cost":null,"bk":"불필요(숙박 예약 완료)","wt":"일어나 수영복을 겉옷 안에 입고 출발합니다. 타올, 선크림, 모자, 선글라스, 물, 멀미약, 예약 때 쓴 신용카드(승선 때 예약자 카드 일치 확인)를 챙깁니다. 셔틀은 가방 1개만 허용되며 크기는 56x36x23cm 이하입니다.","bu":"호텔 조식은 시간이 맞지 않아 이용하지 않습니다.","url":"","one":"수영복 입고 일찍 출발","m":1,"q":"Great Southern Hotel Brisbane, 103 George St, Brisbane City QLD 4000"},{"id":"s2","k":"지미스 온 더 몰 (아침 식사)","n":"Jimmy's on the Mall","kind":"restaurant","lat":-27.46946,"lng":153.02547,"adr":"Queen Street Mall, Brisbane City QLD 4000","a":"07:15","l":"08:10","ea":29921595,"el":29921650,"tz":600,"hrs":"일요일 07:00-24:00. 아침 메뉴는 매일 07:00-11:00 (공식 사이트와 2026년 6월자 아침 메뉴 PDF 확인)","cost":29,"bk":"불필요(07:00 오픈 직후라 예약 없이 가능)","wt":"퀸 스트리트 몰 위의 대형 레스토랑입니다. 아침 메뉴에서 에그 베네딕트(A$24), 클럽 브렉퍼스트(A$28), 아보카도 에그 토스트(A$22) 중에서 고르고 커피(A$5.5~)를 곁들입니다. 배에서 멀미가 올 수 있으니 기름진 음식은 적당히 드세요. 카드 결제는 1.1% 수수료가 붙습니다.","bu":"Cafe Mondial (167 Albert St, Royal Albert Hotel 1층)은 걸어서 약 6분이며 일요일 07:00 오픈은 제3자 정보라 확인이 필요합니다.","url":"https://www.jimmysonthemall.com.au","one":"퀸 스트리트 몰 위 레스토랑에서 아침","m":1,"q":"Jimmy's on the Mall, Queen Street Mall, Brisbane City QLD 4000"},{"id":"s3","k":"로열 온 더 파크 앞 셔틀 탑승 지점","n":"Royal on the Park (STA shuttle pickup)","kind":"station","lat":-27.47283,"lng":153.02912,"adr":"152 Alice St, Brisbane City QLD 4000","a":"08:20","l":"08:35","ea":29921660,"el":29921675,"tz":600,"hrs":"탕갈루마 셔틀 10:00 배 연결편 픽업 08:35 픽업 (셔틀의 마지막 출발 시간)","cost":50,"bk":"필수·선불. 일일투어 예약 후 STA 셔틀 추가: 탕갈루마 1300 652 250 또는 STA 1300 782 118 (24시간). 왕복 1인 A$25x2. https://www.tangalooma.com/resort-info/getting-here/bus-coach-transfers","wt":"탕갈루마 공식 사이트에 적힌 시내 픽업 지점은 Cineplex Southbank 08:00, Roma St 08:10, Marriott Brisbane 08:25, Royal on the Park 08:35입니다. 그레이트 서던 호텔은 지점이 아니고 이곳이 가장 가깝습니다(직선 약 370m, 걸어서 약 8~10분). 08:25까지 도착해 기다리고 버스 기사에게 예약 이름을 말합니다. 버스 안에서는 음식과 음료가 금지입니다.","bu":"셔틀을 놓치면 Uber/택시로 Holt Street Wharf까지 약 15~20분, 3명 기준 약 A$35~50(추정, 신뢰도 낮음). 부두에 대중교통 버스와 기차는 없습니다. 체크인은 출발 1시간 전(09:00) 마감이므로 셔틀이 09:00 무렵 도착하는지 예약 때 STA에 확인하세요.","url":"","one":"","m":0,"q":"Royal on the Park, 152 Alice St, Brisbane City QLD 4000"},{"id":"s4","k":"홀트 스트리트 워프 (탕갈루마 페리 터미널)","n":"Holt Street Wharf (Tangalooma Ferry Terminal)","kind":"pier","lat":-27.43952,"lng":153.10814,"adr":"220 Holt St, Pinkenba QLD 4008","a":"09:00","l":"10:00","ea":29921700,"el":29921760,"tz":600,"hrs":"일요일 포함 매일 운항. 브리즈번 출발 07:30, 10:00, 12:30, 17:30 / 탕갈루마 출발 09:30, 14:30, 16:00, 19:00. 체크인은 출발 최소 1시간 전","cost":179,"bk":"Snorkel the Wrecks Day Cruise Classic(10:00 브리즈번 출발, 16:00 탕갈루마 출발) 예약 필수. 성인 A$179(연료할증 A$10 포함, 2027-01-31까지 가격). 포함 내용은 왕복 페리, 가이드 스노클 투어, 장비 일체, 리조트 이용권, 점심 바우처 A$25. 출발 48시간 이내 변경·환불 불가. https://www.tangalooma.com/snorkel-the-wrecks-day-cruise","wt":"체크인 데스크에서 예약 확인과 신용카드 확인을 하고 탑승권을 받습니다. 10:00 카타마란에 탑승합니다. 이동 중 차, 커피, 소프트드링크 중 1잔이 무료입니다. 승선 전에 멀미약을 먹으세요. 이 부두에는 대중교통 버스와 기차가 없습니다.","bu":"10:00 배가 만석이면 07:30 배(체크인 06:30)를 문의합니다. 이 경우 STA 셔틀이 없어 택시나 Uber로 이동해야 합니다.","url":"https://www.tangalooma.com/location-transport/moreton-island-resort-ferry-schedule","one":"","m":0,"q":"Holt Street Wharf, 220 Holt St, Pinkenba QLD 4008"},{"id":"s5","k":"탕갈루마 선착장 도착","n":"Tangalooma Wharf (jetty)","kind":"pier","lat":-27.18106,"lng":153.37147,"adr":"Tangalooma Island Resort, Moreton Island QLD 4025","a":"11:15","l":"11:25","ea":29921835,"el":29921845,"tz":600,"hrs":"리조트 리셉션 일요일 08:00-17:00","cost":null,"bk":"스노클 투어는 일일투어 패키지에 포함. 도착 후 TangaTours에서 시간만 확정","wt":"선착장에 내려 리조트 센터 쪽으로 걸어갑니다. 먼저 TangaTours 데스크(Fire \u0026 Stone 옆, 매일 08:30-17:00, 전화 07 3410 6927)에서 오늘 스노클 시간(10월 가이드 기준 13:00)을 확인하고 이름을 등록합니다. 시간은 바뀔 수 있습니다.","bu":"스노클 시간이 오전 9:30(이미 지남)뿐이라면 13:00 이후 대체 시간을 문의합니다.","url":"","one":"","m":0,"q":"Tangalooma Wharf, Tangalooma Island Resort, Moreton Island QLD 4025"},{"id":"s6","k":"비치 카페 (리조트 점심)","n":"Beach Cafe, Tangalooma Island Resort","kind":"restaurant","lat":-27.18,"lng":153.3722,"adr":"Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025","a":"11:30","l":"12:30","ea":29921850,"el":29921910,"tz":600,"hrs":"매일 11:30-15:30 / 17:00-21:00 (10월 What's On 가이드 기준)","cost":5,"bk":"불필요","wt":"버거, 피자, 파스타, 샐러드를 파는 곳입니다. 패키지에 포함된 점심 바우처(성인 A$25)를 사용합니다. 거스름돈은 주지 않으므로 바우처 금액에 맞춰 주문하고 부족분은 카드로 냅니다. 스노클 전이므로 너무 많이 먹지 않습니다. 좌표는 리조트 센터 부근의 추정값(OSM에 등재 없음)이라 정확도가 낮습니다.","bu":"Fire \u0026 Stone Restaurant (아시안 요리, 11:30-14:30)나 The Coffee Lounge (가벼운 식사, 07:00-21:00)에서도 같은 바우처를 쓸 수 있습니다.","url":"https://www.tangalooma.com/location-transport/moreton-island-resort-ferry-schedule","one":"리조트 비치 카페에서 점심","m":1,"q":"Beach Cafe, Tangalooma Island Resort, Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025"},{"id":"s7","k":"탕가투어스 (난파선 스노클 집합)","n":"TangaTours (Snorkel the Wrecks check-in)","kind":"activity","lat":-27.1798,"lng":153.3721,"adr":"Beside Fire \u0026 Stone, Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025","a":"12:40","l":"13:15","ea":29921920,"el":29921955,"tz":600,"hrs":"TangaTours 08:30-17:00. 스노클 투어 13:00 출발(10월 가이드 기준, 11월은 확인 필요)","cost":null,"bk":"일일투어에 포함. 단독 구매 시 성인 A$69(공식 활동 페이지의 2026-03-31까지 가격이라 변동 가능, VIP 1시간45분 A$149는 13세 이상)","wt":"체크인은 투어 시작 15분 전(12:45)이므로 12:40까지 집합해 웻슈트, 마스크, 핀, 스노클, 구명조끼, 풀 누들을 받고 안전 교육을 듣습니다. 투어 전체는 90분(안전 교육과 해변에서 난파선까지 보트 이동 포함)이고 그중 물에 들어가는 시간은 약 30~35분입니다. 만 6세 이상이라 성인 3명은 문제가 없습니다. 수영에 자신이 없으면 풀 누들과 구명조끼를 꼭 쓰세요. 난파선 해역은 조류가 강하므로 개인적으로 헤엄쳐 가지 말고 공식 투어로만 갑니다. 초보자는 Intro to Snorkel(A$35, 30분, 공식 페이지상 09:15와 12:30, 최소 2명)을 추가할 수 있지만 12:30이면 점심과 겹치므로 점심을 앞당겨야 합니다(시간은 현장 확인).","bu":"파도나 바람 때문에 취소되면 데저트 사파리 + 샌드 토보건(13:15 출발 예상, A$57, 90분)이 가능한지 Tours Desk(일요일 08:00-16:00, 전화 07 3410 6920)에 문의합니다. 그것도 안 되면 비치와 수영장에서 쉬고, 리조트에 환불 여부를 문의합니다.","url":"https://www.tangalooma.com/activities-tours/snorkel-shipwrecks","one":"집합 후 장비 받고 안전 교육","m":1,"q":"TangaTours, Beside Fire \u0026 Stone, Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025"},{"id":"s8","k":"탕갈루마 난파선 (스노클링 지점)","n":"Tangalooma Wrecks","kind":"sight","lat":-27.16304,"lng":153.36826,"adr":"Tangalooma Wrecks, Moreton Island QLD 4025 (선착장에서 북쪽 약 2km, 보트로 이동)","a":"13:25","l":"14:05","ea":29921965,"el":29922005,"tz":600,"hrs":"가이드 투어로만 입장. 물속 약 30~35분","cost":null,"bk":"투어에 포함","wt":"1960년대에 침몰시킨 15척의 선박 주변에서 물고기 200여 종, 거북이, 가오리, 워비공 상어를 구경합니다. 방수 카메라가 있으면 좋습니다. 가이드 지시를 따르고 난파선 철판에 닿지 않도록 합니다.","bu":"시야가 나쁘거나 취소되면 Marine Discovery Cruise(A$69, 약 1.5시간)는 10월 가이드상 12:30 출발이라 이미 지났을 가능성이 큽니다. TangaTours에서 대체 가능한 투어를 문의합니다.","url":"","one":"난파선 사이에서 스노클링","m":1,"q":"Tangalooma Wrecks, Tangalooma Wrecks, Moreton Island QLD 4025"},{"id":"s9","k":"탕갈루마 해변과 리조트 수영장 (휴식)","n":"Tangalooma beach and resort pool","kind":"sight","lat":-27.179,"lng":153.3724,"adr":"Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025","a":"14:30","l":"15:20","ea":29922030,"el":29922080,"tz":600,"hrs":"수영장 07:00-22:00. 매점(Resort Shop) 일요일 08:00-17:00","cost":null,"bk":"불필요(투어 포함 리조트 이용권)","wt":"샤워와 옷 갈아입기를 먼저 합니다. 이후 수영장이나 해변에서 쉬고, Resort Shop이나 Coffee Lounge에서 아이스크림과 음료를 삽니다. 선착장 근처 수영은 배가 드나들어 금지입니다. 타올은 리셉션에서 보증금을 내고 빌릴 수 있습니다. 무료 프로그램인 Eco Centre(13:00-16:00)와 펠리컨 먹이주기도 볼 수 있습니다. 승선권은 출발 30분 전(15:30)까지 티켓 헛에서 받아야 하므로 15:20에는 정리를 시작합니다.","bu":"비가 오면 Eco Centre(Deep Blue 1 아래)와 Resort Shop 구경, Coffee Lounge에서 휴식합니다.","url":"","one":"샤워하고 옷 갈아입고 휴식","m":1,"q":"Tangalooma beach and resort pool, Resort Centre, Tangalooma Island Resort, Moreton Island QLD 4025"},{"id":"s10","k":"탕갈루마 선착장 (복귀 승선)","n":"Tangalooma Wharf (departure)","kind":"pier","lat":-27.18106,"lng":153.37147,"adr":"Tangalooma Island Resort, Moreton Island QLD 4025","a":"15:25","l":"16:00","ea":29922085,"el":29922120,"tz":600,"hrs":"탕갈루마 출발 매일 09:30, 14:30, 16:00, 19:00(돌고래 먹이주기 후). 티켓은 출발 30분 전에 티켓 헛에서 수령","cost":null,"bk":"일일투어에 포함","wt":"15:30까지 티켓 헛에서 승선권을 받고 16:00 카 불가. https://www.tangalooma.com/snorkel-the-wrecks-day-cruise 또는 1300 652 250","act":1},{"t":"STA 시내 셔틀 왕복 3명 (Royal on the Park 08:35 픽업, Holt St 17:30 출발): 1인 A$25 x 2, 선불 필수, 일일투어 예약과 함께 추가. 1300 652 250 또는 STA 1300 782 118","act":1},{"t":"Corbett \u0026 Claude 18:45 저녁 3명 (권장): (07) 3130 6436 또는 https://corbettandclaude.com.au/book/","act":1},{"t":"선택: Desert Safari Tour + Sand Tobogganing (성인 A$57) 또는 07:30 배 변경은 예약 때 문의","act":1},{"t":"출발 24시간 전(11/21)까지 탕갈루마에 예약 재확인 필요","act":1}],"tips":["[예약 마감 순서] 1) 탕갈루마 Snorkel the Wrecks Day Cruise Classic(10:00 출발, 성인 A$179 x 3 = A$537)을 먼저 예약합니다. 2) 같은 예약에 STA 시내 셔틀(왕복 1인 A$50)을 추가합니다. 출발 48시간 이내에는 변경과 환불이 불가하므로(11/20 오전 10시 이후) 일정과 날씨를 확인하고 11/20 아침 전에 확정하세요. 대표번호 1300 652 250(국내), 해외 +61 7 3637 2000, 한국어 사이트가 있습니다.","[샌드 토보건을 같이 하고 싶다면 대안] 07:30 배(체크인 06:30)를 타면 도착 08:45, 스노클 09:30(체크인 09:15), 점심 11:15, 데저트 사파리 + 샌드 토보건 13:15(성인 A$57, 90분), 16:00 배로 복귀가 가능합니다. 단, 07:30 배에는 셔틀이 없어서 06:00경 호텔에서 Uber/택시(추정 A$35~50)를 타야 하고, 대중교통은 이 시간에 부두까지 가지 않습니다. 추가 비용은 약 A$57 + 택시비 분담입니다. 활동 시간은 10월 가이드 기준이라 11월에는 달라질 수 있으니 예약 때 확인하세요.","[대안] 10:00 배에서 스노클링 대신 토보건만 하고 싶으면 일일투어 Desert Safari Day Cruise Classic(성인 A$165, 2027-01-31까지 가격)을 선택합니다. 13:15경 출발하는 투어에 탑승합니다. 스노클링과 토보건은 같은 시간대(13:00~13:15)라서 한 배편으로 둘 다 할 수 없습니다.","[교통] 홀트 스트리트 워프에는 대중교통 버스와 기차가 없습니다(탕갈루마 공식 안내). 아침과 저녁 STA 셔틀이 유일한 대중교통형 수단입니다. 그레이트 서던 호텔은 공식 픽업 지점이 아니므로 Royal on the Park(152 Alice St)까지 걸어서 약 8~10분 갑니다. 08:25까지 도착하세요. 셔틀은 가방 1개(56x36x23cm 이하)만 가능하고 음식과 음료는 금지입니다.","[신뢰도 주의] 셔틀 시간과 페리 시간은 공식 페이지에서 확인했습니다. 도착 예상 시간(09:00, 18:30)은 추정이고, 스노클 시간(13:00)은 10월 가이드 기준이라 확정이 아닙니다. 11/22 주간 What's On 가이드는 출발 직전에 나오므로 도착 직후 TangaTours에서 꼭 확인하세요. STA 예약 페이지(Rezdy)는 Cloudflare 때문에 직접 확인하지 못했습니다.","[준비물] 예약에 쓴 신용카드(승선 때 예약자 카드 일치 확인), 수영복, 타올, 선크림, 모자, 선글라스, 방수 카메라, 멀미약, 물. 리조트 투숙객이 아닌 일일 손님은 수영장과 식당 이용권이 패키지에 포함됩니다.","[비용] 1인 약 A$298. 구성은 크루즈 패키지 A$179, 셔틀 왕복 A$50, 아침 약 A$29(에그 베네딕트 A$24 + 커피), 점심 추가 A$5(바우처 A$25 사용), 저녁 A$35입니다. 3명이면 약 A$894입니다. 선택 사항인 데저트 사파리는 별도 A$57입니다.","[안전] 난파선 주변 조류가 강해 공식 가이드 투어로만 스노클링하세요. 선착장 근처에서는 수영 금지입니다. 이 일정은 16:00 배로 돌아오므로 돌고래 밤 먹이주기를 보지 않습니다. 보려면 늦은 배(11월 15일 이후 약 19:30~20:30 출발)를 타야 하고 도착이 21시 전후가 되며, 심야 STA 셔틀 시간(20:15)과 맞지 않을 수 있어 추천하지 않습니다.","[승선 시간] 탕갈루마에서 돌아오는 16:00 배는 티켓 헛에서 출발 30분 전(15:30)까지 승선권을 받아야 합니다.","[비자와 항공권] 이 날 일정과 직접 관련은 없습니다. 11/24 BNE 11:05 출발 비행기를 위해 11/23 밤에 짐을 싸 두세요."],"rain":"가벼운 비는 크루즈와 스노클링이 그대로 진행되는 경우가 많습니다(수영복을 입으니 상관 없음). 이 경우 갈아입을 옷과 우비를 챙기고, 비 오는 동안은 Beach Cafe나 Coffee Lounge, Eco Centre(13:00-16:00)에서 쉽니다. 강풍, 높은 파도, 뇌우로 탕갈루마가 크루즈를 취소하면 11/21 저녁이나 11/22 아침에 연락이 오며 환불 규정은 예약 때 확인하세요(출발 48시간 이내 고객 변경은 불가하지만 리조트 측 취소의 환불 조건은 공식 확인이 필요합니다). 그날 대체 일정은 오전 Museum of Brisbane(브리즈번 시청 3층, King George Square, 일요일 10:00-17:00, 무료, 호텔에서 걸어서 약 10분)을 보고 점심은 Jimmy's on the Mall에서 합니다. 오후에는 Queensland Museum Kurilpa(South Bank, 일요일 09:30-17:00, 일반 입장 무료)를 보고 저녁은 같은 Corbett \u0026 Claude에서 먹습니다.","tzchg":0,"tour":0,"advice":null,"alts":[],"live":""},{"date":"2026-11-23","key":"1123","wd":"월","ck":"bne","city":"Brisbane","short":"브리즈번 하루","sub":"마운트쿠타 전망대 · 식물원, 시내 쇼핑, 캥거루 포인트 절벽 일몰","sun":"일출 04:46 · 일몰 18:23","cost":130,"hotel":"그레이트 서던 호텔 브리즈번","hotel_city":"브리즈번","summary":"오전: 471번 버스(08:49 킹조지스퀘어 정류장 통과, 월요일 평일 시간표를 TransLink GTFS로 재확인)로 마운트쿠타 정상 전망대(09:19~10:10) -\u003e 보타닉 가든스 마운트쿠타(10:15~12:15) -\u003e 12:15 버스로 시내 복귀. 오후: Maru 한식 점심 -\u003e 퀸스트리트 몰 쇼핑(상점은 월요일 대체로 17:00 마감) -\u003e 시티 보타닉 가든 -\u003e 캥거루 포인트 그린 브리지(약 460m)로 강 건너 절벽 공원. 저녁: 절벽 위 Joey's에서 일몰(18:23) 감상 후 다리를 걸어 호텔 복귀, 내일(11/24 BNE 11:05 출발) 짐 싸기와 온라인 체크인. 전 구간 대중교통+도보, 대중교통은 회당 A$0.50 균일요금(TransLink 공식 페이지 확인).","weather":"브리즈번(AEST, UTC+10, 서머타임 없음). 11월 일반적으로 최저 약 20도/최고 약 29도, 오후 소나기·뇌우 가능, 자외선 매우 강함(일반 기후 정보이며 당일 예보 확인 필요, 날씨 출처 미검증).","stops":[{"id":"s1","k":"그레이트 서던 호텔 브리즈번","n":"Great Southern Hotel Brisbane","kind":"hotel","lat":-27.47284,"lng":153.02539,"adr":"103 George St, Brisbane City QLD 4000","a":"07:00","l":"07:40","ea":29923020,"el":29923060,"tz":600,"hrs":"연박 중(체크아웃은 내일 11/24 10:00)","cost":null,"bk":"불필요","wt":"아침에 일찍 출발. 물, 선크림, 모자, 접이우산(오후 소나기 대비), 컨택트리스 결제 카드(Visa/Mastercard, 1인 1장 권장, American Express는 TransLink 안내에 없음)를 챙긴다.","bu":"","url":"","one":"일찍 출발","m":1,"q":"Great Southern Hotel Brisbane, 103 George St, Brisbane City QLD 4000"},{"id":"s2","k":"브루 카페 앤 와인바","n":"Brew Cafe \u0026 Wine Bar (Lower Burnett Lane)","kind":"cafe","lat":-27.469089,"lng":153.0251207,"adr":"Lower Burnett Lane (off Albert St), Brisbane City QLD 4000","a":"07:48","l":"08:35","ea":29923068,"el":29923115,"tz":600,"hrs":"월요일 06:30~22:00 (Via Brisbane 2025-12-02 갱신, Time Out도 06:30~22:00. The Urban List는 07:00 개점으로 상이). 전화 (07) 3211 4242","cost":25,"bk":"불필요","wt":"아침식사(빈스\u0026초리조, 브렉퍼스트 버거, 베이글 등 브런치 메뉴)와 커피. 호텔에서 직선 약 420m(도보 약 8분), 킹조지스퀘어 버스 정류장까지 약 170m라 동선이 짧다. 좌표는 Burnett Lane 일대(OSM 기준) 근사치이므로 지도앱에서 'Brew Cafe \u0026 Wine Bar'를 검색해 정확한 입구를 확인.","bu":"Cafe Mondial (167 Albert St, 매일 07:00~21:00, Via Brisbane 2025-12 기준) 또는 호텔에서 도보 1~2분 거리의 The Pancake Manor (18 Charlotte St, 과거 자료상 24시간 영업이나 최근 시간 미확인, 신뢰도 낮음).","url":"https://www.viabrisbane.com/venues/brew-cafe-wine-bar","one":"브런치와 커피로 아침","m":1,"q":"Brew Cafe \u0026 Wine Bar, Lower Burnett Lane , Brisbane City QLD 4000"},{"id":"s3","k":"앤 스트리트 정류장 11 (킹 조지 스퀘어) - 471번 승차","n":"Ann Street Stop 11 at King George Square (bus 471)","kind":"station","lat":-27.468003,"lng":153.02397,"adr":"Ann St at King George Square, Brisbane City QLD 4000","a":"08:41","l":"08:49","ea":29923121,"el":29923129,"tz":600,"hrs":"11/23(월) 마운트쿠타 정상행 471번은 Wickham Tce 출발 08:45, 09:30, 10:30, 11:30, 12:30, 13:30, 14:30, 15:30 (이 정류장은 출발 후 약 4분 뒤 통과: 08:49, 09:34, 10:34...). 이 날이 새 시간표(11/23~12/11) 첫날이므로 11/22에 앱으로 재확인","cost":0.5,"bk":"불필요","wt":"행선지 'Mt Coot-tha Summit Lookout' 표시의 471번을 탄다. 같은 471번이라도 행선지가 'Stuartholme College'인 차(07:49, 16:09 등)는 정상에 가지 않는 학교행이니 타지 말 것. 08:49 통과 버스에 탑승, 승차 시 컨택트리스 카드 또는 go card 터치(1인 1회씩).","bu":"08:49를 놓치면 다음 정상행 471번은 이 정류장 09:34 통과(정상 도착 10:04). 이 경우 정상 약 65분(11:10 하행 탑승), 식물원 11:15~12:15 또는 13:15 버스로 조정.","url":"","one":"","m":0,"q":"Ann Street Stop 11 at King George Square, Ann St at King George Square, Brisbane City QLD 4000"},{"id":"s4","k":"마운트쿠타 정상 전망대","n":"Mt Coot-tha Summit Lookout","kind":"sight","lat":-27.4851,"lng":152.9588,"adr":"Sir Samuel Griffith Dr, Mt Coot-tha QLD 4066 (471번 종점 정류장 'Sir Samuel Griffith Dr at Mount Coot-tha')","a":"09:19","l":"10:10","ea":29923159,"el":29923210,"tz":600,"hrs":"전망대 24시간 개방(시 공식). The Summit 카페는 워크인 전용(정확한 시간 미확인). The Summit 레스토랑\u0026바는 2025년 리노베이션 후 재개장, 매일 11:00부터라 오전 일정과는 맞지 않음","cost":6,"bk":"불필요","wt":"브리즈번 시내와 모레턴 베이 전망 감상, 사진, 필요하면 정상 카페에서 커피(전망대 입장 자체는 무료, 커피 비용만 발생). 10:10 하행 버스는 정시 출발이므로 10:05에는 정류장으로 이동.","bu":"흐리거나 비가 오면 전망대는 20~25분만 보고 카페에서 대기 후 같은 10:10 버스로 이동. 카페 시간이 맞지 않으면 식물원 Botanic Gardens Cafe(08:15~16:00)를 이용.","url":"https://brisbane.qld.gov.au/things-to-see-and-do/council-venues-and-precincts/mt-coot-tha-precinct","one":"시내와 모레턴 베이 전망 감상","m":1,"q":"Mt Coot-tha Summit Lookout, Sir Samuel Griffith Dr, Mt Coot-tha QLD 4066"},{"id":"s5","k":"브리즈번 보타닉 가든스 마운트쿠타","n":"Brisbane Botanic Gardens Mt Coot-tha (bus stop 19)","kind":"sight","lat":-27.475303,"lng":152.976656,"adr":"152 Mt Coot-tha Rd, Mt Coot-tha QLD 4066 (Mt Coot-tha Rd at Botanic Gardens, stop 19)","a":"10:15","l":"12:15","ea":29923215,"el":29923335,"tz":600,"hrs":"08:00~18:00 매일(9~3월 하계). 가든 카페 08:15~16:00 매일. 방문자안내센터 09:00~16:00. 열대 돔은 제3자 자료상 09:00~16:00(공식 미확인). 입장 무료","cost":0,"bk":"불필요","wt":"방문자안내센터에서 무료 지도 수령 후 열대 돔(Tropical Display Dome), 일본 정원, 대나무 숲과 라군, 선인장·양치류 구역을 약 1시간 45분 산책. 10:50경 가든 카페에서 간식 휴식. 12:05부터 정류장 19로 이동해 12:15 버스 탑승.","bu":"비가 오면 열대 돔과 방문자센터, 카페 실내 위주로 보고 11:15 버스(정류장 19, 11:41 시내 도착)로 일찍 이동. 놓치면 다음 버스는 13:15.","url":"https://www.brisbane.qld.gov.au/things-to-see-and-do/council-venues-and-precincts/brisbane-botanic-gardens-mount-coot-tha","one":"열대 돔과 일본 정원 산책 (약 1시간 45분)","m":1,"q":"Brisbane Botanic Gardens Mt Coot-tha, 152 Mt Coot-tha Rd, Mt Coot-tha QLD 4066"},{"id":"s6","k":"아델레이드 스트리트 정류장 22 (시청 근처)","n":" ard 가능, American Express는 안내에 없음. 승하차 모두 터치하고 터치오프를 안 하면 기본요금 A$2.50이 부과될 수 있음(120일 이내 조정 요청 가능). 카드 1장은 1명분만 결제하므로 3명이 각자 카드/기기를 사용.","정상·식물원 모두 그늘이 적고 11월 자외선이 강하다. 선크림, 모자, 물 필수. 식물원에서는 야생동물에게 음식을 주지 말 것. The Summit 레스토랑은 11:00 개점이라 오전에는 카페(워크인)만 이용 가능.","퀸 스트리트 몰 매장은 월요일 대체로 17:00 마감. 쇼핑은 15:25까지로 계획되어 있음.","일몰 18:23, 일몰 후 약 25분이 가장 예쁜 시간대(시민박명 18:48). Joey's 테이블에서도 시내 쪽 전망이 보이지만 절벽 가장자리에서 보면 더 좋다.","Joey's는 월요일이라도 예약 권장. 일몰 시간대 좌석은 먼저 마감될 수 있다.","저녁 귀가 시 다리는 야간에도 이용 가능하나 조명 여부는 공식 페이지에 없으니 주변이 어두울 수 있음. 일행과 함께 이동하고 21:00 이후는 피하기.","저녁 숙소 복귀 후: 내일 BNE 11:05 출발이므로 국제선은 보통 출발 3시간 전 도착(약 08:00). 호텔 체크아웃 10:00보다 일찍 출발하게 되니 짐은 오늘 밤 정리. 온라인 체크인은 항공사별 시작 시점을 앱에서 확인."],"rain":"오전(비/구름): 정상 전망대는 20~25분만 보고 카페 실내에서 휴식 후 10:10 버스. 식물원은 열대 돔·방문자센터·가든 카페 실내 위주로 보고 11:15 버스(시내 11:41)로 일찍 복귀. 아예 비가 심하면 10:10 버스를 그대로 타고 시내(Adelaide St 10:41)로 돌아와 시청 3층 Museum of Brisbane(월 10:00~17:00, 무료)을 본 뒤 12:40경 Maru 점심. 오후: 퀸 스트리트 몰 아케이드/쇼핑센터 실내 쇼핑 연장, 시티 보타닉 가든은 취소하고 Museum of Brisbane으로 대체. 저녁: 폭우·뇌우면 다리 도보와 절벽 일몰은 취소하고 시내 Maru Grill House(월 17:00~22:00)에서 저녁, 호텔 복귀. 소나기가 짧게 지나갈 때는 다리의 그늘 덮개 구간과 Joey's에서 대기 후 이동(예약 변경 가능 여부 전화 확인).","tzchg":0,"tour":0,"advice":null,"alts":[],"live":""},{"date":"2026-11-24","key":"1124","wd":"화","ck":"bne","city":"Brisbane","short":"귀국일","sub":"이른 아침 + Airtrain + 공항 수속 · TRS, 11:05 JQ53 인천행","sun":"일출 04:45 · 일몰 18:23","cost":63,"hotel":"그레이트 서던 호텔 브리즈번","hotel_city":"브리즈번","summary":"11:05 BNE 출발 인천행 귀국일. 06:05 호텔 체크아웃 후 가까운 카페 Frankie \u0026 George에서 이른 아침을 먹고, Central역에서 07:15경 Airtrain을 타 07:38경 국제선역 도착(출발 약 3시간 25분 전). 체크인 -\u003e 보안/출국심사 -\u003e Level 3 TRS 데스크(탑승 90분 전인 09:35 이전 도착) -\u003e 면세점 -\u003e 게이트 순서입니다. 하루 1인 예상 비용 약 A$63(Airtrain 정상요금 기준, 그룹요금 적용 시 약 A$57).","weather":"11월 하순 브리즈번은 초여름. 아침 기온 약 20도, 낮 약 29도, 오후 소나기 가능. 일정은 대부분 실내.","stops":[{"id":"s1","k":"그레이트 서던 호텔 브리즈번","n":"Great Southern Hotel Brisbane","kind":"hotel","lat":-27.4728083,"lng":153.0256556,"adr":"103 George St, Brisbane City QLD 4000","a":"05:45","l":"06:05","ea":299
